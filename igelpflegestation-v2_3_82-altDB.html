    const MedikationDatenbank = ({ userData, onClose }) => {
      const isAdmin = userData?.role === 'admin';
      const [activeTab, setActiveTab] = useState('gruppen');
      const [allData, setAllData] = useState({ gruppen: [], behandlungen: [], arten: [], haeufigkeiten: [] });
      const [loadingData, setLoadingData] = useState(true);
      const [showForm, setShowForm] = useState(null);     // { mode:'create'|'edit', item:{} }
      const [formVals, setFormVals] = useState({});
      const [showDeleteConfirm, setShowDeleteConfirm] = useState(null); // { item, canDelete, reason, usageCount }
      const [showCascadeDialog, setShowCascadeDialog] = useState(null); // { item, newVals, usageCount, nameField, queryField }
      const [saving, setSaving] = useState(false);
      const [checking, setChecking] = useState(false);
      const [formError, setFormError] = useState('');
      const [showDuplicateWarning, setShowDuplicateWarning] = useState(null); // { name, existsIn: [{parentName}], proceedFn }

      const TABS = [
        { key: 'gruppen',       label: 'Gruppe',      col: 'med_gruppen',       singular: 'Gruppe',      queryField: 'gruppeId',      nameField: 'gruppeName',      parentKey: null,      parentIdField: null,       parentNameField: null          },
        { key: 'behandlungen',  label: 'Behandlung',  col: 'med_behandlungen',  singular: 'Behandlung',  queryField: 'behandlungId',  nameField: 'behandlungName',  parentKey: 'gruppen', parentIdField: 'gruppeId', parentNameField: 'gruppeName'    },
        { key: 'arten',         label: 'Art',         col: 'med_arten',         singular: 'Art',         queryField: 'artId',         nameField: 'artName',         parentKey: null,      parentIdField: null,       parentNameField: null            },
        { key: 'haeufigkeiten', label: 'Häufigkeit',  col: 'med_haeufigkeiten', singular: 'Häufigkeit',  queryField: 'haeufigkeitId', nameField: 'haeufigkeitName', parentKey: null,      parentIdField: null,       parentNameField: null            },
      ];
      const tab = TABS.find(t => t.key === activeTab);

      // Load all 4 collections — individual handlers to survive partial permission errors
      useEffect(() => {
        const config = [
          { key: 'gruppen',       col: 'med_gruppen',       sort: (a,b) => (a.name||'').localeCompare(b.name||'','de') },
          { key: 'behandlungen',  col: 'med_behandlungen',  sort: (a,b) => (a.name||'').localeCompare(b.name||'','de') },
          { key: 'arten',         col: 'med_arten',         sort: (a,b) => (a.name||'').localeCompare(b.name||'','de') },
          { key: 'haeufigkeiten', col: 'med_haeufigkeiten', sort: (a,b) => (a.sortOrder||0)-(b.sortOrder||0) },
        ];

        const localData = { gruppen: [], behandlungen: [], arten: [], haeufigkeiten: [] };
        const loaded = { gruppen: false, behandlungen: false, arten: false, haeufigkeiten: false };

        const tryFinish = () => {
          if (Object.values(loaded).every(Boolean)) {
            setAllData({ ...localData });
            setLoadingData(false);
          }
        };

        const unsubs = config.map(({ key, col, sort }) =>
          db.collection(col).onSnapshot(
            snap => {
              const docs = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort(sort);
              localData[key] = docs;
              loaded[key] = true;
              setAllData(prev => ({ ...prev, [key]: docs }));
              tryFinish();
            },
            err => {
              console.warn(`Med Stammdaten ${col}:`, err.code);
              loaded[key] = true; // mark as done even on error
              tryFinish();
            }
          )
        );

        // Timeout fallback — force-stop spinner after 6s
        const timeout = setTimeout(() => setLoadingData(false), 6000);
        return () => { unsubs.forEach(u => u()); clearTimeout(timeout); };
      }, []);

      // Check usage before delete
      const checkUsage = async (item) => {
        setChecking(true);
        try {
          // Gruppe: prüfe ob noch Behandlungen referenzieren
          if (activeTab === 'gruppen') {
            const bSnap = await db.collection('med_behandlungen').where('gruppeId', '==', item.id).get();
            if (!bSnap.empty) {
              setChecking(false);
              return { canDelete: false, reason: `${bSnap.size} Behandlung${bSnap.size > 1 ? 'en' : ''} ${bSnap.size > 1 ? 'verwenden' : 'verwendet'} diese Gruppe. Zuerst diese Behandlungen löschen oder umbenennen.`, usageCount: bSnap.size };
            }
          }
          // Alle: prüfe Nutzung in Igelkarten
          const mSnap = await db.collection('medikationen').where(tab.queryField, '==', item.id).get();
          setChecking(false);
          return { canDelete: mSnap.empty, usageCount: mSnap.size, reason: mSnap.empty ? null : `${mSnap.size} Igelkarte${mSnap.size > 1 ? 'n verwenden' : ' verwendet'} diesen Eintrag. Zuerst die Medikationen aus den Igelkarten entfernen.` };
        } catch (e) {
          setChecking(false);
          return { canDelete: true, usageCount: 0 };
        }
      };

      const handleDeleteClick = async (item) => {
        const result = await checkUsage(item);
        setShowDeleteConfirm({ item, ...result });
      };

      const confirmDelete = async () => {
        setSaving(true);
        try {
          await db.collection(tab.col).doc(showDeleteConfirm.item.id).delete();
          await db.collection('auditLog').add({ action: 'delete', timestamp: firebase.firestore.FieldValue.serverTimestamp(), userId: userData.uid || '', userName: userData.name, details: `Stammdaten gelöscht: ${tab.singular} "${showDeleteConfirm.item.name}"` });
          setShowDeleteConfirm(null);
        } catch (e) { console.error(e); }
        setSaving(false);
      };

      const openForm = (mode, item = {}) => {
        setFormError('');
        const base = { name: item.name || '' };
        // Behandlung: Eltern-Gruppe ist Pflicht
        if (tab.parentIdField) {
          base[tab.parentIdField] = item[tab.parentIdField] || '';
          base[tab.parentNameField] = item[tab.parentNameField] || '';
        }
        if (activeTab === 'haeufigkeiten') {
          base.sortOrder = item.sortOrder ?? ((allData.haeufigkeiten.length + 1) * 10);
        }
        setFormVals(base);
        setShowForm({ mode, item });
      };

      const handleFormSave = async () => {
        if (!formVals.name?.trim()) { setFormError('Name ist erforderlich'); return; }
        if (tab.parentIdField && !formVals[tab.parentIdField]) {
          const parentTab = TABS.find(t => t.key === tab.parentKey);
          setFormError(`Bitte ${parentTab?.singular || 'übergeordneten Eintrag'} auswählen`); return;
        }

        // ── Duplicate check within same scope ──
        const newName = formVals.name.trim().toLowerCase();
        const list = allData[activeTab] || [];
        const isDuplicate = list.some(existing => {
          // Skip self when editing
          if (showForm.mode === 'edit' && existing.id === showForm.item.id) return false;
          // Name must match
          if (existing.name.trim().toLowerCase() !== newName) return false;
          // For top-level (Gruppe): global uniqueness
          if (!tab.parentIdField) return true;
          // For child levels: only duplicate within same parent
          return existing[tab.parentIdField] === formVals[tab.parentIdField];
        });
        if (isDuplicate) {
          const scope = tab.parentIdField
            ? ` in dieser ${TABS.find(t => t.key === tab.parentKey)?.singular}`
            : '';
          setFormError(`„${formVals.name.trim()}" existiert bereits${scope}.`);
          return;
        }

        setFormError('');

        // ── Actual save logic (called directly or after warning confirmed) ──
        const doActualSave = async () => {
          setShowDuplicateWarning(null);
          // Edit: check cascade
          if (showForm.mode === 'edit') {
            const nameChanged = formVals.name.trim() !== showForm.item.name;
            if (nameChanged) {
              const mSnap = await db.collection('medikationen').where(tab.queryField, '==', showForm.item.id).get();
              if (mSnap.size > 0) {
                setShowCascadeDialog({ item: showForm.item, newVals: { ...formVals, name: formVals.name.trim() }, usageCount: mSnap.size });
                return;
              }
            }
            await saveEdit(false, { item: showForm.item, newVals: { ...formVals, name: formVals.name.trim() }, usageCount: 0 });
            return;
          }
          // Create new
          setSaving(true);
          try {
            const payload = { ...formVals, name: formVals.name.trim(), erstelltVon: userData.name, erstelltAm: firebase.firestore.FieldValue.serverTimestamp() };
            if (tab.parentIdField) {
              const parentList = allData[tab.parentKey] || [];
              const parentItem = parentList.find(p => p.id === formVals[tab.parentIdField]);
              payload[tab.parentNameField] = parentItem?.name || '';
            }
            await db.collection(tab.col).add(payload);
            await db.collection('auditLog').add({ action: 'create', timestamp: firebase.firestore.FieldValue.serverTimestamp(), userId: userData.uid || '', userName: userData.name, details: `Stammdaten angelegt: ${tab.singular} "${payload.name}"` });
            setShowForm(null);
          } catch (e) { setFormError('Fehler: ' + e.message); }
          setSaving(false);
        };

        await doActualSave();
      };

      const saveEdit = async (cascade, ctx) => {
        const { item, newVals } = ctx || showCascadeDialog;
        setSaving(true);
        try {
          const payload = { ...newVals, geaendertVon: userData.name, geaendertAm: firebase.firestore.FieldValue.serverTimestamp() };
          // Resolve parent display name
          if (tab.parentIdField) {
            const parentList = allData[tab.parentKey] || [];
            const parentItem = parentList.find(p => p.id === newVals[tab.parentIdField]);
            payload[tab.parentNameField] = parentItem?.name || '';
          }
          await db.collection(tab.col).doc(item.id).update(payload);

          // Cascade to Igelkarten
          if (cascade && (ctx || showCascadeDialog).usageCount > 0) {
            const snap = await db.collection('medikationen').where(tab.queryField, '==', item.id).get();
            const batch = db.batch();
            snap.docs.forEach(doc => batch.update(doc.ref, { [tab.nameField]: payload.name }));
            await batch.commit();
          }
          // Propagate name change: Gruppe → Behandlungen (nur diese Kette bleibt)
          if (activeTab === 'gruppen' && newVals.name !== item.name) {
            const bSnap = await db.collection('med_behandlungen').where('gruppeId', '==', item.id).get();
            if (!bSnap.empty) {
              const batch3 = db.batch();
              bSnap.docs.forEach(doc => batch3.update(doc.ref, { gruppeName: payload.name }));
              await batch3.commit();
            }
          }

          await db.collection('auditLog').add({ action: 'update', timestamp: firebase.firestore.FieldValue.serverTimestamp(), userId: userData.uid || '', userName: userData.name, details: `Stammdaten bearbeitet: ${tab.singular} "${payload.name}"${cascade ? ' (inkl. Igelkarten)' : ''}` });
          setShowCascadeDialog(null);
          setShowForm(null);
        } catch (e) { setFormError('Fehler: ' + e.message); }
        setSaving(false);
      };

      const currentList = allData[activeTab] || [];
      // Tree view state for Gruppe tab
      const [expandedGruppen, setExpandedGruppen] = React.useState({});
      const toggleGruppe = (id) => setExpandedGruppen(prev => ({ ...prev, [id]: !prev[id] }));
      const behandlungenFuerGruppe = (gruppeId) => (allData.behandlungen || []).filter(b => b.gruppeId === gruppeId);

      const ItemRow = ({ item, indent = false }) => (
        <div className={`flex items-center justify-between border border-gray-100 rounded-xl px-4 py-3 bg-white hover:border-gray-200 transition-all ${indent ? 'ml-4 border-l-2 border-l-gray-100' : ''}`}>
          <div className="min-w-0">
            <p className="text-sm font-medium text-gray-900 truncate">{item.name}</p>
            {item.gruppeName && <p className="text-xs text-gray-400 mt-0.5">{item.gruppeName}</p>}
            {activeTab === 'haeufigkeiten' && item.sortOrder !== undefined && (
              <p className="text-xs text-gray-300 mt-0.5">Reihenfolge: {item.sortOrder}</p>
            )}
          </div>
          {isAdmin && (
            <div className="flex items-center gap-1 ml-3 flex-shrink-0">
              <button onClick={() => openForm('edit', item)} className="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-gray-100 text-gray-400 hover:text-gray-700 transition-all">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              </button>
              <button onClick={() => handleDeleteClick(item)} className="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-red-50 text-gray-300 hover:text-red-500 transition-all">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
              </button>
            </div>
          )}
        </div>
      );

      return (
        <div className="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4 fade-in">
          <div className="bg-white rounded-2xl w-full max-w-md shadow-xl flex flex-col" style={{ maxHeight: '92vh' }}>

            {/* Header */}
            <div className="flex items-center justify-between p-5 border-b border-gray-100 flex-shrink-0">
              <div className="flex items-center gap-3">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="text-gray-700">
                  <path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"/>
                </svg>
                <h2 className="text-base font-semibold text-gray-900">Medikation Stammdaten</h2>
              </div>
              <button onClick={onClose} className="text-gray-400 hover:text-gray-600 w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 transition-all">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              </button>
            </div>

            {/* Tabs */}
            <div className="flex border-b border-gray-100 flex-shrink-0 px-2">
              {TABS.map(t => (
                <button key={t.key} onClick={() => setActiveTab(t.key)}
                  className={`flex-1 py-3 text-xs font-medium transition-all border-b-2 ${activeTab === t.key ? 'border-gray-900 text-gray-900' : 'border-transparent text-gray-400 hover:text-gray-600'}`}>
                  {t.label}
                  {allData[t.key]?.length > 0 && <span className="ml-1 text-[10px] text-gray-300">({allData[t.key].length})</span>}
                </button>
              ))}
            </div>

            {/* Read-only notice */}
            {!isAdmin && (
              <div className="mx-5 mt-4 bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 flex items-center gap-3 flex-shrink-0">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="text-gray-400 flex-shrink-0">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <p className="text-xs text-gray-500">Nur Ansicht — Bearbeiten ist auf Administratoren beschränkt.</p>
              </div>
            )}

            {/* Content */}
            <div className="flex-1 overflow-y-auto p-5">
              {loadingData ? (

    // ── TodoList ───────────────────────────────────────────────────
    const TodoList = ({ userData, onClose }) => {
      const isAdmin = userData && userData.role === 'admin';
      const PRIORITY_KEYS = ['high','medium','low'];
      const PRIORITY_LABEL = { high:'Hoch', medium:'Mittel', low:'Niedrig' };
      const emptyVals = () => ({ label:'', desc:'', priority:'medium' });

      const [items, setItems]         = useState([]);
      const [loading, setLoading]     = useState(true);
      const [saving, setSaving]       = useState(false);
      const [showForm, setShowForm]   = useState(false);
      const [editingId, setEditingId] = useState(null);
      const [formVals, setFormVals]   = useState(emptyVals());
      const [formErr, setFormErr]     = useState('');
      const [deleteIdx, setDeleteIdx] = useState(null);

      useEffect(() => {
        const unsub = db.collection('app_todos').doc('main').onSnapshot(
          snap => {
            if (snap.exists) {
              setItems(snap.data().items || []);
            } else {
              setItems([]);
            }
            setLoading(false);
          },
          (err) => { console.error('app_todos error:', err); setLoading(false); }
        );
        return () => unsub();
      }, []);

      const saveItems = async (newItems) => {
        setSaving(true);
        try { await db.collection('app_todos').doc('main').set({ items: newItems }); }
        catch(e) { console.error(e); }
        setSaving(false);
      };

      const done = items.filter(t => t.done).length;
      const pct  = items.length ? Math.round((done / items.length) * 100) : 0;

      const openCreate = () => { setFormVals(emptyVals()); setEditingId(null); setFormErr(''); setShowForm(true); };
      const openEdit   = (idx) => {
        const t = items[idx];
        setFormVals({ label: t.label||'', desc: t.desc||'', priority: t.priority||'medium' });
        setEditingId(t.id); setFormErr(''); setShowForm(true);
      };
      const closeForm  = () => { setShowForm(false); setEditingId(null); };

      const submitForm = async () => {
        if (!formVals.label.trim()) { setFormErr('Bezeichnung ist erforderlich.'); return; }
        setSaving(true); setFormErr('');
        try {
          let newItems;
          if (editingId) {
            newItems = items.map(t => t.id === editingId ? { ...t, label: formVals.label.trim(), desc: formVals.desc.trim(), priority: formVals.priority } : t);
          } else {
            const newItem = { id: `todo_${Date.now()}`, label: formVals.label.trim(), desc: formVals.desc.trim(), priority: formVals.priority, done: false, createdAt: new Date().toISOString() };
            newItems = [...items, newItem];
          }
          await saveItems(newItems);
          closeForm();
        } catch(e) { setFormErr('Fehler: ' + e.message); }
        setSaving(false);
      };

      const toggleDone = async (idx) => {
        const newItems = items.map((it, i) => i === idx ? { ...it, done: !it.done } : it);
        setItems(newItems);
        await saveItems(newItems);
      };

      const confirmDelete = async () => {
        if (deleteIdx === null) return;
        setSaving(true);
        const newItems = items.filter((_, i) => i !== deleteIdx);
        await saveItems(newItems);
        setDeleteIdx(null); setSaving(false);
      };

      if (showForm) return (
        <div className="min-h-screen bg-gray-50 pb-20 fade-in">
          <div style={{position:"sticky",top:0,background:"#fff",display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 16px",borderBottom:"2px solid #e7e5e4",zIndex:10}}>
            <button onClick={closeForm} style={{width:36,height:36,borderRadius:"50%",background:"#f5f5f4",border:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <h2 style={{position:"absolute",left:"50%",transform:"translateX(-50%)",fontSize:15,fontWeight:800,color:"#1c1917",whiteSpace:"nowrap",fontFamily:"'DM Sans',system-ui,sans-serif"}}>{editingId ? 'Aufgabe bearbeiten' : 'Neue Aufgabe'}</h2>
            <div style={{width:'36px'}}/>
          </div>
          <div className="p-5 space-y-4">
            <div>
              <p className="text-xs font-medium text-gray-500 uppercase tracking-wide mb-2">Bezeichnung *</p>
              <input type="text" placeholder="z. B. Datenschutz überprüfen"
                value={formVals.label} onChange={e => setFormVals({...formVals, label:e.target.value})}
                className="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-gray-400 bg-white"/>
            </div>
            <div>
              <p className="text-xs font-medium text-gray-500 uppercase tracking-wide mb-2">Beschreibung</p>
              <textarea placeholder="Details, Kontext, Teilaufgaben…"
                value={formVals.desc} onChange={e => setFormVals({...formVals, desc:e.target.value})}
                className="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-gray-400 bg-white resize-none" rows="4"/>
            </div>
            <div>
              <p className="text-xs font-medium text-gray-500 uppercase tracking-wide mb-2">Priorität</p>
              <div className="grid grid-cols-3 gap-2">
                {PRIORITY_KEYS.map(p => (
                  <button key={p} onClick={() => setFormVals({...formVals, priority:p})}
                    className={"py-3 rounded-xl text-sm font-medium border transition-all " + (formVals.priority===p ? 'bg-gray-900 text-white border-gray-900' : 'border-gray-200 text-gray-600 hover:border-gray-400')}>
                    {PRIORITY_LABEL[p]}
                  </button>
                ))}
              </div>
            </div>
            {formErr && <p className="text-xs text-red-500">{formErr}</p>}
            <div className="grid grid-cols-2 gap-3 pt-2">
              <button onClick={submitForm} disabled={saving}
                className="bg-gray-900 text-white py-3 rounded-xl text-sm font-medium hover:bg-gray-700 disabled:opacity-40 transition-all">
                {saving ? 'Speichert…' : 'Speichern'}
              </button>
              <button onClick={closeForm}
                className="border border-gray-200 text-gray-600 py-3 rounded-xl text-sm font-medium hover:bg-gray-50 transition-all">
                Abbrechen
              </button>
            </div>
          </div>
        </div>
      );

      return (
        <div className="min-h-screen bg-gray-50 pb-20 fade-in">
          <div style={{position:"sticky",top:0,background:"#fff",display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 16px",borderBottom:"2px solid #e7e5e4",zIndex:10}}>
            <button onClick={onClose} style={{width:36,height:36,borderRadius:"50%",background:"#f5f5f4",border:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <h2 style={{position:"absolute",left:"50%",transform:"translateX(-50%)",fontSize:15,fontWeight:800,color:"#1c1917",whiteSpace:"nowrap",fontFamily:"'DM Sans',system-ui,sans-serif"}}>To-Do</h2>
            <div>
              {isAdmin && !loading ? (
                <button onClick={openCreate} className="flex items-center gap-1.5 text-xs font-medium text-gray-900 border border-gray-200 px-3 py-1.5 rounded-lg hover:bg-gray-50 transition-all">
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M12 5v14M5 12h14"/></svg>
                  Neu
                </button>
              ) : <div style={{width:'52px'}}/>}
            </div>
          </div>

          {!loading && items.length > 0 && (
            <div className="px-5 pt-4 pb-2">
              <div className="flex items-center justify-between mb-2">
                <p className="text-xs text-gray-500">{done} von {items.length} erledigt</p>
                <p className="text-xs font-semibold text-gray-900">{pct}%</p>
              </div>
              <div className="h-1.5 bg-gray-100 rounded-full overflow-hidden">
                <div className="h-full bg-gray-900 rounded-full transition-all duration-500" style={{width:`${pct}%`}}/>
              </div>
            </div>
          )}

          <div className="px-5 pb-3 mt-3 space-y-2">
            {loading ? (
              <div className="flex justify-center py-10">
                <div className="w-5 h-5 border-2 border-gray-900 border-t-transparent rounded-full animate-spin"/>
              </div>
            ) : items.length === 0 ? (
              <div className="text-center py-10">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" className="text-gray-200 mx-auto mb-2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                <p className="text-sm text-gray-400">Noch keine Aufgaben vorhanden</p>
                {isAdmin && <p className="text-xs text-gray-300 mt-1">Klicke auf „Neu" um eine Aufgabe hinzuzufügen</p>}
              </div>
            ) : (
              <>
                {items.filter(t => !t.done).map((item, _) => {
                  const realIdx = items.indexOf(item);
                  return (
                    <div key={item.id} className="border border-gray-200 rounded-xl p-3.5 bg-white group transition-all hover:border-gray-300">
                      <div className="flex items-start gap-3">
                        <button onClick={() => toggleDone(realIdx)} disabled={saving}
                          className="w-5 h-5 rounded border-2 border-gray-300 hover:border-gray-700 flex items-center justify-center flex-shrink-0 mt-0.5 transition-all"/>
                        <div className="min-w-0 flex-1">
                          <div className="flex items-center gap-2 flex-wrap">
                            <p className="text-sm font-medium text-gray-900">{item.label}</p>
                            <span className={"text-[10px] font-semibold px-1.5 py-0.5 rounded-full " + (item.priority==='high' ? 'bg-gray-900 text-white' : item.priority==='medium' ? 'bg-gray-100 text-gray-600' : 'bg-gray-50 text-gray-400')}>
                              {PRIORITY_LABEL[item.priority] || ''}
                            </span>
                          </div>
                          {item.desc && <p className="text-xs text-gray-500 mt-0.5 leading-relaxed">{item.desc}</p>}
                        </div>
                        {isAdmin && (
                          <div className="flex gap-0.5 opacity-0 group-hover:opacity-100 transition-opacity flex-shrink-0">
                            <button onClick={() => openEdit(realIdx)} className="w-7 h-7 flex items-center justify-center rounded-lg hover:bg-gray-100 text-gray-400 hover:text-gray-700 transition-all">
                              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                            </button>
                            <button onClick={() => setDeleteIdx(realIdx)} className="w-7 h-7 flex items-center justify-center rounded-lg hover:bg-red-50 text-gray-300 hover:text-red-500 transition-all">
                              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
                            </button>
                          </div>
                        )}
                      </div>
                    </div>
                  );
                })}
                {items.some(t=>t.done) && items.some(t=>!t.done) && (
                  <div className="flex items-center gap-3 py-1">
                    <div className="h-px flex-1 bg-gray-100"/>
                    <span className="text-[10px] text-gray-300 uppercase tracking-wide">erledigt</span>
                    <div className="h-px flex-1 bg-gray-100"/>
                  </div>
                )}
                {items.filter(t=>t.done).map((item) => {
                  const realIdx = items.indexOf(item);
                  return (
                    <div key={item.id} className="border border-gray-100 rounded-xl p-3.5 bg-gray-50 opacity-60 group transition-all">
                      <div className="flex items-start gap-3">
                        <button onClick={() => toggleDone(realIdx)} disabled={saving}
                          className="w-5 h-5 rounded bg-gray-900 border-2 border-gray-900 flex items-center justify-center flex-shrink-0 mt-0.5 transition-all hover:bg-gray-700">
                          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg>
                        </button>
                        <div className="min-w-0 flex-1">
                          <p className="text-sm font-medium text-gray-400 line-through">{item.label}</p>
                          {item.desc && <p className="text-xs text-gray-300 mt-0.5">{item.desc}</p>}
                        </div>
                        {isAdmin && (
                          <div className="flex gap-0.5 opacity-0 group-hover:opacity-100 transition-opacity flex-shrink-0">
                            <button onClick={() => openEdit(realIdx)} className="w-7 h-7 flex items-center justify-center rounded-lg hover:bg-gray-100 text-gray-400 hover:text-gray-600 transition-all">
                              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                            </button>
                            <button onClick={() => setDeleteIdx(realIdx)} className="w-7 h-7 flex items-center justify-center rounded-lg hover:bg-red-50 text-gray-300 hover:text-red-400 transition-all">
                              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
                            </button>
                          </div>
                        )}
                      </div>
                    </div>
                  );
                })}
                {items.length > 0 && done === items.length && (
                  <div className="text-center py-4">
                    <p className="text-xs text-gray-400">Alle Aufgaben abgeschlossen 🎉</p>
                  </div>
                )}
              </>
            )}
          </div>

          {deleteIdx !== null && (
            <div className="fixed inset-0 bg-black bg-opacity-60 z-60 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl w-full max-w-xs shadow-xl p-5">
                <p className="text-sm font-semibold text-gray-900 mb-1">Aufgabe löschen?</p>
                <p className="text-xs text-gray-500 mb-5">„{items[deleteIdx]?.label}" wird unwiderruflich gelöscht.</p>
                <div className="grid grid-cols-2 gap-3">
                  <button onClick={confirmDelete} disabled={saving}
                    className="bg-gray-900 text-white py-3 rounded-xl text-sm font-medium hover:bg-gray-700 disabled:opacity-50 transition-all">
                    Löschen
                  </button>
                  <button onClick={() => setDeleteIdx(null)}
                    className="border border-gray-200 text-gray-600 py-3 rounded-xl text-sm font-medium hover:bg-gray-50 transition-all">
                    Abbrechen
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // ── TreatmentDB (Behandlungsvorlagen) ──────────────────────────
    const TreatmentDB = ({ userData, onClose }) => {
      const isAdmin = userData && userData.role === 'admin';
      const isPfleger = userData && (userData.role === 'admin' || userData.role === 'pfleger');
      const [templates, setTemplates] = useState([]);
      const [loading, setLoading] = useState(true);
      const [search, setSearch] = useState('');
      const [medications, setMedications] = useState([]);
      const [diagnoses, setDiagnoses] = useState([]);
      const [showForm, setShowForm] = useState(false);
      const [editingId, setEditingId] = useState(null);
      const [saving, setSaving] = useState(false);
      const [formErr, setFormErr] = useState('');
      const [delConfirm, setDelConfirm] = useState(null);

      const emptyForm = () => ({ name:'', diagnosisId:'', diagnosisName:'', notes:'',
        medications: [{ medicationId:'', medicationName:'', dose:'', unit:'mg', applicationRoute:'oral', frequency:'1x täglich', durationDays:'', plannedApplications:'', repeatAfterDays:'', notes:'' }]
      });
      const [form, setForm] = useState(null);

      const ROUTES = ['oral','subkutan','intramuskulär','topisch','inhalativ'];
      const FREQS  = ['1x täglich','2x täglich','3x täglich','alle 2 Tage','alle 14 Tage','einmalig','nach Bedarf'];
      const UNITS  = ['mg','ml','IE','Tropfen','Tablette'];

      useEffect(() => {
        const sort = arr => [...arr].sort((a,b) => (a.name||'').localeCompare(b.name||''));
        const u1 = db.collection('treatmentDatabase').onSnapshot(
          s => { setTemplates(sort(s.docs.map(d=>({id:d.id,...d.data()})))); setLoading(false); },
          (err) => { console.error('treatmentDatabase:', err); setLoading(false); }
        );
        const u2 = db.collection('medicationDatabase').onSnapshot(
          s => setMedications(sort(s.docs.map(d=>({id:d.id,...d.data()})))), ()=>{}
        );
        const u3 = db.collection('diagnosisDatabase').onSnapshot(
          s => setDiagnoses(sort(s.docs.map(d=>({id:d.id,...d.data()})))), ()=>{}
        );
        return () => { u1(); u2(); u3(); };
      }, []);

      const filtered = templates.filter(t =>
        !search || t.name?.toLowerCase().includes(search.toLowerCase()) ||
        t.diagnosisName?.toLowerCase().includes(search.toLowerCase())
      );

      const openNew = () => { setForm(emptyForm()); setFormErr(''); setEditingId(null); setShowForm(true); };
      const openEdit = (t) => {
        setForm({
          name: t.name||'', diagnosisId: t.diagnosisId||'', diagnosisName: t.diagnosisName||'', notes: t.notes||'',
          medications: (t.medications||[]).map(m=>({...m}))
        });
        setFormErr(''); setEditingId(t.id); setShowForm(true);
      };
      const closeForm = () => { setShowForm(false); setEditingId(null); };

      const addMed = () => setForm(f => ({...f, medications:[...f.medications,
        { medicationId:'', medicationName:'', dose:'', unit:'mg', applicationRoute:'oral', frequency:'1x täglich', durationDays:'', plannedApplications:'', repeatAfterDays:'', notes:'' }
      ]}));
      const removeMed = (i) => setForm(f => ({...f, medications: f.medications.filter((_,idx)=>idx!==i)}));
      const setMed = (i, field, val) => setForm(f => {
        const meds = [...f.medications];
        meds[i] = {...meds[i], [field]: val};
        if (field === 'medicationId') {
          const m = medications.find(x=>x.id===val);
          if (m) { meds[i].medicationName = m.name||''; meds[i].unit = m.unit||'mg'; meds[i].applicationRoute = m.applicationRoute||m.route||'oral'; }
        }
        return {...f, medications: meds};
      });
      const setDiagField = (val) => {
        const d = diagnoses.find(x=>x.id===val);
        setForm(f => ({...f, diagnosisId:val, diagnosisName: d ? d.name||'' : ''}));
      };

      const calcPlanned = (m) => {
        if (m.plannedApplications) return parseInt(m.plannedApplications)||1;
        if (m.durationDays && m.frequency) {
          const days = parseInt(m.durationDays)||1;
          const f = m.frequency;
          if (f==='1x täglich') return days;
          if (f==='2x täglich') return days*2;
          if (f==='3x täglich') return days*3;
          if (f==='alle 2 Tage') return Math.ceil(days/2);
          if (f==='alle 14 Tage') return Math.ceil(days/14);
          if (f==='einmalig'||f==='nach Bedarf') return 1;
        }
        return 1;
      };

      const save = async () => {
        if (!form.name.trim()) { setFormErr('Name ist erforderlich.'); return; }
        if (!form.diagnosisId) { setFormErr('Bitte eine Diagnose wählen.'); return; }
        if (form.medications.length===0) { setFormErr('Mindestens ein Medikament erforderlich.'); return; }
        for (let m of form.medications) {
          if (!m.medicationId) { setFormErr('Bitte für jedes Medikament eine Auswahl treffen.'); return; }
          if (!m.dose) { setFormErr('Dosis ist erforderlich.'); return; }
        }
        setSaving(true); setFormErr('');
        try {
          const meds = form.medications.map(m => ({
            medicationId: m.medicationId, medicationName: m.medicationName,
            dose: m.dose, unit: m.unit, applicationRoute: m.applicationRoute,
            frequency: m.frequency, durationDays: m.durationDays||'',
            plannedApplications: String(calcPlanned(m)),
            repeatAfterDays: m.repeatAfterDays||'', notes: m.notes||''
          }));
          const payload = {
            name: form.name.trim(), diagnosisId: form.diagnosisId,
            diagnosisName: form.diagnosisName, notes: form.notes.trim(),
            medications: meds, lastModified: new Date().toISOString(),
          };
          if (editingId) {
            await db.collection('treatmentDatabase').doc(editingId).update(payload);
          } else {
            await db.collection('treatmentDatabase').add({
              ...payload, createdBy: userData.uid||'', createdAt: new Date().toISOString(), usageCount: 0
            });
          }
          closeForm();
        } catch(e) { setFormErr('Fehler beim Speichern: '+e.message); }
        finally { setSaving(false); }
      };

      const deleteTemplate = async (id) => {
        try { await db.collection('treatmentDatabase').doc(id).delete(); }
        catch(e) { alert('Fehler: '+e.message); }
        setDelConfirm(null);
      };

      const SEVERITY_BADGE = {
        'leicht':  'bg-green-100 text-green-700',
        'mittel':  'bg-yellow-100 text-yellow-700',
        'schwer':  'bg-red-100 text-red-700',
      };

      if (showForm) {
      return (
        <div className="min-h-screen bg-gray-50 pb-20 fade-in">
          <div style={{position:"sticky",top:0,background:"#fff",display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 16px",borderBottom:"2px solid #e7e5e4",zIndex:10}}>
            <button onClick={() => { setShowForm(false); setEditingId(null); setFormErr(''); setForm(emptyForm()); }} style={{width:36,height:36,borderRadius:"50%",background:"#f5f5f4",border:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
            <h2 style={{position:"absolute",left:"50%",transform:"translateX(-50%)",fontSize:15,fontWeight:800,color:"#1c1917",whiteSpace:"nowrap",fontFamily:"'DM Sans',system-ui,sans-serif"}}>{editingId ? 'Vorlage bearbeiten' : 'Neue Vorlage'}</h2>
            <div style={{width:'36px'}}/>
          </div>
          <div className="p-4 space-y-4">
            <div>
              <p className="text-xs font-semibold text-gray-600 mb-1">Name *</p>
              <input value={form.name} onChange={e => setForm(f=>({...f,name:e.target.value}))}
                placeholder="z. B. Wurmkur Standard"
                className="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-gray-400 bg-white"/>
            </div>
            <div>
              <p className="text-xs font-semibold text-gray-600 mb-1">Diagnose *</p>
              <select value={form.diagnosisId} onChange={e => setDiagField(e.target.value)}
                className="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-gray-400 bg-white">
                <option value="">— Diagnose wählen —</option>
                {diagnoses.map(d => <option key={d.id} value={d.id}>{d.name}</option>)}
              </select>
            </div>
            <div>
              <p className="text-xs font-semibold text-gray-600 mb-1">Notizen</p>
              <textarea value={form.notes} onChange={e => setForm(f=>({...f,notes:e.target.value}))}
                placeholder="Hinweise zur Vorlage…"
                className="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-gray-400 bg-white resize-none" rows="2"/>
            </div>
            <div>
              <div className="flex items-center justify-between mb-2">
                <p className="text-xs font-semibold text-gray-600">Medikamente</p>
                <button onClick={addMed} className="text-xs text-gray-500 border border-gray-200 px-2 py-1 rounded-lg hover:bg-gray-50">+ Hinzufügen</button>
              </div>
              {form.medications.map((m, i) => (
                <div key={i} className="border border-gray-200 rounded-xl p-3 bg-white mb-2 space-y-2">
                  <div className="flex items-center justify-between">
                    <p className="text-xs font-semibold text-gray-500">Medikament {i+1}</p>
                    {form.medications.length > 1 && <button onClick={() => setForm(f=>({...f,medications:f.medications.filter((_,j)=>j!==i)}))} className="text-xs text-red-400 hover:text-red-600">Entfernen</button>}
                  </div>
                  <select value={m.medicationId} onChange={e => setMed(i,'medicationId',e.target.value)}
                    className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-gray-400 bg-white">
                    <option value="">— Medikament wählen —</option>
                    {medications.map(md => <option key={md.id} value={md.id}>{md.name}</option>)}
                  </select>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <p className="text-xs text-gray-500 mb-1">Dosis</p>
                      <input value={m.dose} onChange={e => setMed(i,'dose',e.target.value)} placeholder="z. B. 0.4"
                        className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-gray-400 bg-white"/>
                    </div>
                    <div>
                      <p className="text-xs text-gray-500 mb-1">Einheit</p>
                      <select value={m.unit} onChange={e => setMed(i,'unit',e.target.value)}
                        className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-gray-400 bg-white">
                        {UNITS.map(u => <option key={u} value={u}>{u}</option>)}
                      </select>
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <p className="text-xs text-gray-500 mb-1">Applikation</p>
                      <select value={m.applicationRoute} onChange={e => setMed(i,'applicationRoute',e.target.value)}
                        className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-gray-400 bg-white">
                        {ROUTES.map(r => <option key={r} value={r}>{r}</option>)}
                      </select>
                    </div>
                    <div>
                      <p className="text-xs text-gray-500 mb-1">Häufigkeit</p>
                      <select value={m.frequency} onChange={e => setMed(i,'frequency',e.target.value)}
                        className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-gray-400 bg-white">
                        {FREQS.map(f => <option key={f} value={f}>{f}</option>)}
                      </select>
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <p className="text-xs text-gray-500 mb-1">Dauer (Tage)</p>
                      <input value={m.durationDays} onChange={e => setMed(i,'durationDays',e.target.value)} placeholder="z. B. 5"
                        className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-gray-400 bg-white"/>
                    </div>
                    <div>
                      <p className="text-xs text-gray-500 mb-1">Wdh. nach (Tage)</p>
                      <input value={m.repeatAfterDays} onChange={e => setMed(i,'repeatAfterDays',e.target.value)} placeholder="opt."
                        className="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-gray-400 bg-white"/>
                    </div>
                  </div>
                </div>
              ))}
            </div>
            {formErr && <p className="text-xs text-red-500">{formErr}</p>}
            <div className="grid grid-cols-2 gap-3 pt-2">
              <button onClick={save} disabled={saving}
                className="bg-gray-900 text-white py-3 rounded-xl text-sm font-medium hover:bg-gray-700 disabled:bg-gray-200 disabled:text-gray-400 transition-all">
                {saving ? 'Speichert…' : 'Speichern'}
              </button>
              <button onClick={() => { setShowForm(false); setEditingId(null); setFormErr(''); setForm(emptyForm()); }}
                className="border border-gray-200 text-gray-600 py-3 rounded-xl text-sm font-medium hover:bg-gray-50 transition-all">
                Abbrechen
              </button>
            </div>
          </div>
        </div>
        );
      }

      return (
        <div className="min-h-screen bg-gray-50 pb-20 fade-in">

          {/* Sticky Header */}
          <div style={{position:"sticky",top:0,background:"#fff",display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 16px",borderBottom:"2px solid #e7e5e4",zIndex:10}}>
            <button onClick={onClose} style={{width:36,height:36,borderRadius:"50%",background:"#f5f5f4",border:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
            <h2 style={{position:"absolute",left:"50%",transform:"translateX(-50%)",fontSize:15,fontWeight:800,color:"#1c1917",whiteSpace:"nowrap",fontFamily:"'DM Sans',system-ui,sans-serif"}}>Behandlungsvorlagen</h2>
            {isPfleger
              ? <button onClick={openNew} className="flex items-center gap-1.5 text-xs font-medium text-gray-900 border border-gray-200 px-3 py-1.5 rounded-lg hover:bg-gray-50 transition-all">
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M12 5v14M5 12h14"/></svg>
                  Neu
                </button>
              : <div style={{width:'52px'}}/>
            }
          </div>

          {/* Search */}
          <div className="px-4 pt-4 pb-2">
            <div className="relative">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Suche nach Name oder Diagnose..."
                className="w-full pl-9 pr-4 py-2.5 text-sm bg-white border border-gray-200 rounded-xl focus:outline-none focus:border-gray-900 transition-all"/>
            </div>
          </div>

          {/* Counter */}
          <div className="px-4 pb-3">
            <p className="text-xs text-gray-400">{loading ? 'Lade...' : `${filtered.length} Vorlage${filtered.length!==1?'n':''}`}</p>
          </div>

          {/* List */}
          {loading
            ? <div className="flex items-center justify-center py-20"><div className="w-6 h-6 border-2 border-gray-900 border-t-transparent rounded-full animate-spin"/></div>
            : filtered.length === 0
              ? <div className="text-center py-16 px-6">
                  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" className="text-gray-200 mx-auto mb-2"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                  <p className="text-sm font-semibold text-gray-700">{search ? 'Keine Treffer' : 'Noch keine Vorlagen'}</p>
                  <p className="text-xs text-gray-400 mt-1">{search ? 'Suchbegriff anpassen' : 'Erste Behandlungsvorlage anlegen'}</p>
                  {!search && isPfleger && <button onClick={openNew} className="mt-4 text-sm font-semibold text-gray-900 underline underline-offset-2">Vorlage erstellen</button>}
                </div>
              : <div className="px-4 space-y-2">
                  {filtered.map(t => {
                    const diagBadge = diagnoses.find(d=>d.id===t.diagnosisId);
                    const sevCls = {'leicht':'bg-green-100 text-green-700','mittel':'bg-yellow-100 text-yellow-700','schwer':'bg-red-100 text-red-700'};
                    return (
                      <div key={t.id} className="bg-white border border-gray-200 rounded-xl overflow-hidden">
                        <div className="p-4">
                          <div className="flex items-start justify-between gap-2">
                            <div className="flex-1 min-w-0">
                              <p className="text-sm font-bold text-gray-900 truncate">{t.name||'—'}</p>
                              <div className="flex items-center gap-2 mt-1 flex-wrap">
                                <span className="text-xs font-medium text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full">{t.diagnosisName||'Keine Diagnose'}</span>
                                {diagBadge?.severity && <span className={`text-xs font-medium px-2 py-0.5 rounded-full ${sevCls[diagBadge.severity]||'bg-gray-100 text-gray-600'}`}>{diagBadge.severity}</span>}
                              </div>
                            </div>
                            {isPfleger && (
                              <div className="flex items-center gap-2 flex-shrink-0">
                                <button onClick={()=>openEdit(t)} className="p-1.5 rounded-lg hover:bg-gray-100 text-gray-400 hover:text-gray-700 transition-all">
                                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                                </button>
                                {isAdmin && <button onClick={()=>setDelConfirm(t.id)} className="p-1.5 rounded-lg hover:bg-red-50 text-gray-400 hover:text-red-500 transition-all">
                                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
                                </button>}
                              </div>
                            )}
                          </div>
                          {(t.medications||[]).length > 0 && (
                            <div className="mt-3 pt-3 border-t border-gray-100 space-y-1.5">
                              {(t.medications||[]).map((m,i) => (
                                <div key={i} className="flex items-center gap-2 text-xs text-gray-600">
                                  <div className="w-1.5 h-1.5 rounded-full bg-gray-400 flex-shrink-0"/>
                                  <span className="font-medium text-gray-800">{m.medicationName||'—'}</span>
                                  <span className="text-gray-400">·</span>
                                  <span>{m.dose} {m.unit}</span>
                                  <span className="text-gray-400">·</span>
                                  <span>{m.applicationRoute}</span>
                                  <span className="text-gray-400">·</span>
                                  <span>{m.frequency}</span>
                                  {m.durationDays && <><span className="text-gray-400">·</span><span>{m.durationDays}T</span></>}
                                </div>
                              ))}
                            </div>
                          )}
                          <div className="flex items-center gap-3 mt-3 pt-2">
                            <span className="text-xs text-gray-400">{(t.medications||[]).length} Medikament{(t.medications||[]).length!==1?'e':''}</span>
                            {(t.usageCount||0) > 0 && <span className="text-xs text-gray-400">{t.usageCount}x verwendet</span>}
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
          }

          {/* Delete confirm */}
          {delConfirm && (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-end justify-center z-50 p-4" onClick={()=>setDelConfirm(null)}>
              <div className="bg-white rounded-2xl w-full max-w-sm p-5" onClick={e=>e.stopPropagation()}>
                <p className="text-base font-bold text-gray-900 mb-1">Vorlage löschen?</p>
                <p className="text-sm text-gray-500 mb-5">Diese Aktion kann nicht rückgängig gemacht werden.</p>
                <div className="flex gap-3">
                  <button onClick={()=>setDelConfirm(null)} className="flex-1 py-2.5 rounded-xl border border-gray-200 text-sm font-semibold text-gray-700 hover:bg-gray-50">Abbrechen</button>
                  <button onClick={()=>deleteTemplate(delConfirm)} className="flex-1 py-2.5 rounded-xl bg-red-600 text-white text-sm font-bold hover:bg-red-700">Löschen</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );

    };


    // Main App
    const MainApp = ({ user, userData }) => {
      const [hedgehogs, setHedgehogs] = useState([]);
      const [users, setUsers] = useState([]);
      const [view, setView] = useState('overview');
      const [selected, setSelected] = useState(null);
      const [detailOrigin, setDetailOrigin] = useState('main'); // 'main' | 'pflegeplan'
      const [search, setSearch] = useState('');
      // const [filter, setFilter] = useState('alle'); // Removed - using statusFilter only
      const [showUserMgmt, setShowUserMgmt] = useState(false);
      const [showAddForm, setShowAddForm] = useState(false);
      const [showProfile, setShowProfile] = useState(false);
      const [showPflegeplan, setShowPflegeplan] = useState(false);
      const [showChangelog, setShowChangelog] = useState(false);
      const [showDesignSpec, setShowDesignSpec] = useState(false);
      const [showTodoList, setShowTodoList] = useState(false);
      const [showCSVImport, setShowCSVImport] = useState(false);
      const [statusFilter, setStatusFilter] = useState('all'); // 'all', 'in_pflege', 'ueberwinterung', 'ausgewildert'
      const [betreuerFilter, setBetreuerFilter] = useState([]); // Array of caretaker names
      const [showBetreuerDialog, setShowBetreuerDialog] = useState(false);
      const [showDatabaseDialog, setShowDatabaseDialog] = useState(false);
      const [showDatenbankHub, setShowDatenbankHub] = useState(false);
      const [showMedDatenbank, setShowMedDatenbank] = useState(false);
      const [showMedikamentDB, setShowMedikamentDB] = useState(false);
      const [showDiagnoseDB, setShowDiagnoseDB] = useState(false);
      const [showTreatmentDB, setShowTreatmentDB] = useState(false);
      const [dbCounts, setDbCounts] = useState({meds:0, diags:0, treatments:0});
      const [dashboardOpen, setDashboardOpen] = useState(true);
      const [verwaltungOpen, setVerwaltungOpen] = useState(true);
      const [bestandOpen, setBestandOpen] = useState(true);
      const [showBestand, setShowBestand] = useState(false);
      const [filterOpen, setFilterOpen] = useState(false);
      const [statusFilterPills, setStatusFilterPills] = useState([]);
      const [showStatusFilterDialog, setShowStatusFilterDialog] = useState(false);
      const [showSettings, setShowSettings] = useState(false);
      const [settings, setSettings] = useState(loadSettings);
      const [exportScope, setExportScope] = useState('all'); // 'all' | 'filtered'

      const updateSetting = (key, val) => {
        const next = { ...settings, [key]: val };
        setSettings(next);
        saveSettings(next);
      };

      const isGuest = userData?.role === 'gast';
      const [showQRScanner, setShowQRScanner] = useState(false);
      const [showQuickView, setShowQuickView] = useState(false);
      const [quickViewIgel, setQuickViewIgel] = useState(null);
      const [quickViewInitialAction, setQuickViewInitialAction] = useState(null);

      const isAdmin = userData?.role === 'admin';
      const [showExitConfirm, setShowExitConfirm] = useState(false);
      const [showSessionExpired, setShowSessionExpired] = useState(false);
      const [showSessionWarning, setShowSessionWarning] = useState(false);
      const _lastBackMs = React.useRef(0);

      // Browser Back/Forward support: handled by Android back useEffect below

      // Load hedgehogs
      useEffect(() => {
        const unsubscribe = db.collection('hedgehogs')
          .orderBy('aufnahmedatum', 'desc')
          .onSnapshot(snapshot => {
            setHedgehogs(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
          });
        return () => unsubscribe();
      }, []);

      // Load users (admin only)
      useEffect(() => {
        if (!isAdmin) return;
        const unsubscribe = db.collection('users').onSnapshot(snapshot => {
          setUsers(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });
        return () => unsubscribe();
      }, [isAdmin]);

      // Wire bottom nav + menu sheet to React
      useEffect(() => {
        const bar = document.getElementById('bnav');
        const neu = document.getElementById('bnav-neu');
        const adminItems = document.getElementById('ms-admin-items');
        const avatar = document.getElementById('ms-avatar');
        const nameEl = document.getElementById('ms-name');
        const roleEl = document.getElementById('ms-role');
        if (bar) bar.style.display = 'flex';
        if (neu) neu.style.display = isGuest ? 'none' : 'flex';
        if (adminItems) adminItems.style.display = isAdmin ? 'block' : 'none';
        if (avatar) avatar.textContent = userData?.name?.[0] || '?';
        if (nameEl) nameEl.textContent = userData?.name || 'Benutzer';
        if (roleEl) roleEl.textContent = userData?.role === 'admin' ? 'Administrator' : userData?.role === 'mitarbeiter' ? 'Mitarbeiter' : 'Gast';
        window.__igelCloseAll = () => {
          setShowProfile(false); setShowPflegeplan(false); setShowAddForm(false); setShowUserMgmt(false);
          setShowSettings(false); setShowChangelog(false); setShowDesignSpec(false);
          setShowTodoList(false); setShowDatenbankHub(false); setShowMedDatenbank(false);
          setShowMedikamentDB(false); setShowDiagnoseDB(false); setShowTreatmentDB(false); setShowQRScanner(false);
          setShowBestand(false);
          setSelected(null);
          igelMenuClose();
        };
        window.__igelCloseAllExceptMenu = () => {
          setShowProfile(false); setShowAddForm(false); setShowUserMgmt(false);
          setShowSettings(false); setShowChangelog(false); setShowDesignSpec(false);
          setShowTodoList(false); setShowDatenbankHub(false); setShowMedDatenbank(false);
          setShowMedikamentDB(false); setShowDiagnoseDB(false); setShowTreatmentDB(false);
          setShowQRScanner(false); setShowPflegeplan(false); setShowBestand(false);
          setSelected(null);
          // intentionally NOT calling igelMenuClose()
        };
        // Badge on Pflegeplan icon
        const pflegeplanBtn = document.getElementById('bnav-pflegeplan');
        if (pflegeplanBtn) {
          const pendingCount = (hedgehogs||[]).reduce((sum, h) => {
            return sum + (h.treatments||[]).filter(t=>t.status==='aktiv').reduce((s2, t) => {
              const todayStr = new Date().toISOString().split('T')[0];
              return s2 + (t.medications||[]).filter(m => {
                if (m.done) return false;
                const todayApps = (m.applications||[]).filter(a=>a.doneAt&&a.doneAt.startsWith(todayStr)).length;
                const freq = (()=>{ const f=(m.frequency||'').toLowerCase(); if(f.includes('2x')) return 2; if(f.includes('3x')) return 3; if(f.includes('4x')) return 4; return 1; })();
                return todayApps < freq;
              }).length;
            }, 0);
          }, 0);
          let badge = pflegeplanBtn.querySelector('.bnav-badge');
          if (pendingCount > 0) {
            if (!badge) { badge = document.createElement('span'); badge.className = 'bnav-badge'; pflegeplanBtn.style.position='relative'; pflegeplanBtn.appendChild(badge); }
            badge.textContent = pendingCount > 9 ? '9+' : String(pendingCount);
            badge.style.cssText = 'position:absolute;top:2px;right:2px;background:#ef4444;color:white;font-size:9px;font-weight:700;border-radius:999px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 3px;';
          } else if (badge) { badge.remove(); }
        }

        window.__igelAction = (action) => {
          // Always close everything first, then open the requested thing
          setShowProfile(false); setShowAddForm(false); setShowUserMgmt(false);
          setShowSettings(false); setShowChangelog(false); setShowDesignSpec(false);
          setShowTodoList(false); setShowDatenbankHub(false); setShowMedDatenbank(false);
          setShowMedikamentDB(false); setShowDiagnoseDB(false); setShowTreatmentDB(false);
          setShowQRScanner(false); setShowPflegeplan(false); setShowBestand(false);
          igelMenuClose();
          if (action === 'home') {
            setSelected(null);
            window.scrollTo({top:0,behavior:'smooth'});
            bnavSetActive('bnav-home');
          } else if (action === 'bestand') {
            setSelected(null);
            setShowBestand(true); bnavSetActive('bnav-bestand'); history.pushState({page:'bestand'},'');
          } else if (action === 'neu') {
            setSelected(null);
            if (!isGuest) { setShowAddForm(true); bnavSetActive('bnav-neu'); history.pushState({page:'addForm'},''); }
          } else if (action === 'qr') {
            setSelected(null);
            setShowQRScanner(true); bnavSetActive('bnav-qr'); history.pushState({page:'qrScanner'},'');
          } else if (action === 'pflegeplan') {
            setSelected(null);
            setQuickViewInitialAction(null);
            setShowPflegeplan(true); bnavSetActive('bnav-pflegeplan'); history.pushState({page:'pflegeplan'},'');
          }
        };
        window.__igelDatenbank = () => { window.__igelCloseAll&&window.__igelCloseAll(); setShowDatenbankHub(true); history.pushState({page:'datenbankHub'},''); };

        window.__igelUsers = () => { window.__igelCloseAll&&window.__igelCloseAll(); setShowUserMgmt(true); history.pushState({page:'userMgmt'},''); };
        window.__igelSettings = () => { window.__igelCloseAll&&window.__igelCloseAll(); setShowSettings(true); history.pushState({page:'settings'},''); };
        window.__igelTodo = () => { window.__igelCloseAll&&window.__igelCloseAll(); setShowTodoList(true); history.pushState({page:'todo'},''); };
        window.__igelSpec = () => { window.__igelCloseAll&&window.__igelCloseAll(); setShowDesignSpec(true); history.pushState({page:'spec'},''); };
        window.__igelChangelog = () => { window.__igelCloseAll&&window.__igelCloseAll(); setShowChangelog(true); history.pushState({page:'changelog'},''); };
        window.__igelProfile = () => { window.__igelCloseAll&&window.__igelCloseAll(); setShowProfile(true); history.pushState({page:'profile'},''); };
        window.__igelLogout = () => { localStorage.removeItem('igelSessionLoginAt'); auth.signOut(); };
        return () => {
          if (bar) bar.style.display = 'none';
        };
      }, [isAdmin, isGuest, userData]);

      // ── DB entry counts for Hub ──────────────────────────────────────────
      useEffect(() => {
        const unsubs = [
          db.collection('medicationDatabase').onSnapshot(s => setDbCounts(p => ({...p, meds: s.size}))),
          db.collection('diagnosisDatabase').onSnapshot(s => setDbCounts(p => ({...p, diags: s.size}))),
          db.collection('treatmentDatabase').onSnapshot(s => setDbCounts(p => ({...p, treatments: s.size}))),
        ];
        return () => unsubs.forEach(u => u());
      }, []);

      // ── Android Systemtaste Zurück ──────────────────────────────────────────
      // Refs für stale-closure-freien Zugriff im popstate-Handler
      const _backState = React.useRef({});
      _backState.current = {
        showDatabaseDialog, showMedikamentDB, showDiagnoseDB, showTreatmentDB, showCSVImport,
        showDatenbankHub, showUserMgmt, showSettings, showTodoList, showChangelog,
        showDesignSpec, showProfile, showAddForm, showQRScanner, showPflegeplan, detailOrigin,
        showQuickView, quickViewIgel,
        selected, view
      };

      useEffect(() => {
        // Genau einmal beim Mount: Puffer-Eintrag + aktiver Eintrag
        history.replaceState({ igelApp: true, level: 0 }, '');
        history.pushState({ igelApp: true, level: 1 }, '');

        const handleBack = () => {
          const s = _backState.current;
          const reBase = () => history.pushState({ igelApp: true, level: 1 }, '');
          // Menü offen → schließen
          var menuSheet = document.getElementById('menu-sheet');
          if (menuSheet && menuSheet.classList.contains('open')) {
            window.igelMenuClose && window.igelMenuClose();
            return;
          }
          // Sub-Seiten → zurück zum Hub (KEIN extra push — history ist bereits korrekt)
          if (s.showDatabaseDialog) { setShowDatabaseDialog(false); setShowDatenbankHub(true); return; }
          if (s.showTreatmentDB)    { setShowTreatmentDB(false);    setShowDatenbankHub(true); return; }
          if (s.showMedikamentDB)   { setShowMedikamentDB(false);   setShowDatenbankHub(true); return; }
          if (s.showDiagnoseDB)     { setShowDiagnoseDB(false);     setShowDatenbankHub(true); return; }
          if (s.showCSVImport)      { setShowCSVImport(false);      setShowDatenbankHub(true); return; }
          // Top-Level-Seiten → Menü öffnen (KEIN extra push)
          if (s.showDatenbankHub) { setShowDatenbankHub(false); window.igelMenuOpen&&window.igelMenuOpen(false); return; }
          if (s.showUserMgmt)     { setShowUserMgmt(false);     window.igelMenuOpen&&window.igelMenuOpen(false); return; }
          if (s.showSettings)     { setShowSettings(false);     window.igelMenuOpen&&window.igelMenuOpen(false); return; }
          if (s.showTodoList)     { setShowTodoList(false);     window.igelMenuOpen&&window.igelMenuOpen(false); return; }
          if (s.showChangelog)    { setShowChangelog(false);    window.igelMenuOpen&&window.igelMenuOpen(false); return; }
          if (s.showDesignSpec)   { setShowDesignSpec(false);   window.igelMenuOpen&&window.igelMenuOpen(false); return; }
          if (s.showQRScanner)   { setShowQRScanner(false);    return; }
          if (s.showQuickView)   { setShowQuickView(false); setQuickViewIgel(null); return; }
          if (s.showProfile)      { setShowProfile(false);      window.igelMenuOpen&&window.igelMenuOpen(false); return; }
          if (s.showPflegeplan)   { setShowPflegeplan(false);   return; }
          if (s.showBestand)      { setShowBestand(false); bnavSetActive('bnav-home'); return; }
          if (s.showAddForm)      { setShowAddForm(false);      return; }
          if (s.selected) {
            setSelected(null);
            if (s.detailOrigin === 'pflegeplan') {
              setShowPflegeplan(true);
              bnavSetActive('bnav-pflegeplan');
              history.pushState({page:'pflegeplan'},'');
            } else if (s.detailOrigin === 'bestand') {
              setShowBestand(true);
              bnavSetActive('bnav-bestand');
              history.pushState({page:'bestand'},'');
            } else {
              setView('overview');
            }
            return;
          }
          // Hauptseite — App beenden Dialog
          setShowExitConfirm(true);
          reBase();
        };

        window.addEventListener('popstate', handleBack);
        return () => window.removeEventListener('popstate', handleBack);
      }, []); // leere Deps: läuft nur einmal beim Mount

      const statusOptions = [
        { value: 'aufnahme', label: 'Aufnahme', color: 'bg-red-100 text-red-800' },
        { value: 'pflege', label: 'In Pflege', color: 'bg-blue-100 text-blue-800' },
        { value: 'ueberwinterung', label: 'Überwinterung', color: 'bg-blue-200 text-blue-900' },
        { value: 'auswilderung_bereit', label: 'Auswilderungsbereit', color: 'bg-blue-100 text-blue-800' },
        { value: 'ausgewildert', label: 'Ausgewildert', color: 'bg-gray-100 text-gray-800' },
        { value: 'verstorben', label: 'Verstorben', color: 'bg-black text-white' }
      ];

      const getStatus = (val) => statusOptions.find(s => s.value === val) || {};

    // CSV Import Dialog (Punkt 8)
    const CSVImportDialog = ({ userData, onClose }) => {
      const [file, setFile] = useState(null);
      const [preview, setPreview] = useState(null);
      const [importing, setImporting] = useState(false);
      const [result, setResult] = useState(null);

      const handleFileSelect = (e) => {
        const selectedFile = e.target.files[0];
        if (!selectedFile) return;
        if (!selectedFile.name.endsWith('.csv')) {
          alert('Bitte CSV-Datei auswählen');
          return;
        }
        setFile(selectedFile);
        const reader = new FileReader();
        reader.onload = (event) => {
          const csvText = event.target.result;
          const parsed = parseCSV(csvText);
          setPreview(parsed);
        };
        reader.readAsText(selectedFile);
      };

      const handleImport = async () => {
        if (!preview || !preview.success) return;

        setImporting(true);
        let imported = 0;
        let errors = 0;

        for (const hedgehog of preview.data) {
          try {
            const existing = await db.collection('hedgehogs').where('igelId', '==', hedgehog.igelId).get();
            const data = {
              ...hedgehog,
              erstelltVon: userData.name,
              erstelltVonId: 'import',
              erstelltAm: firebase.firestore.FieldValue.serverTimestamp(),
              zuletztBearbeitetVon: userData.name,
              zuletztBearbeitetAm: firebase.firestore.FieldValue.serverTimestamp()
            };

            if (!existing.empty) {
              await db.collection('hedgehogs').doc(existing.docs[0].id).update(data);
            } else {
              await db.collection('hedgehogs').add(data);
            }
            imported++;
          } catch (err) {
            errors++;
          }
        }

        setResult({ imported, errors });
        setImporting(false);
      };

      return (
        <div className="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4 fade-in">
          <div className="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto shadow-xl">

                  <polyline points="17 8 12 3 7 8"/>
                  <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                <h2 className="text-base font-semibold text-gray-900">CSV Import</h2>
              </div>
              <button onClick={onClose} className="text-gray-400 hover:text-gray-600 w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 transition-all">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              </button>
            </div>

            <div className="p-5 space-y-4">
              {!result ? (
                <>
                  <div className="bg-gray-50 rounded-xl p-4">
                    <p className="text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">Format</p>
                    <p className="text-xs text-gray-400">Igel-ID, Name, Status, Aufnahmedatum, Geschlecht (Pflichtfelder)</p>
                  </div>

                  <input
                    type="file"
                    accept=".csv"
                    onChange={handleFileSelect}
                    className="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm"
                  />

                  {preview && (
                    <div className="border border-gray-100 rounded-xl p-4">
                      {preview.success ? (
                        <div className="space-y-3">
                          <div className="flex items-center gap-2">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" className="text-gray-700">
                              <polyline points="20 6 9 17 4 12"/>
                            </svg>
                            <span className="text-sm font-medium text-gray-900">{preview.data.length} Igel bereit</span>
                          </div>
                          {preview.error && (
                            <p className="text-xs text-gray-500">{preview.error}</p>
                          )}
                          <div className="grid grid-cols-2 gap-2">
                            <button
                              onClick={handleImport}
                              disabled={importing}
                              className="bg-gray-900 text-white px-4 py-3 rounded-xl text-sm font-medium hover:bg-gray-700 disabled:bg-gray-200 disabled:text-gray-400 transition-all">
                              {importing ? 'Importiere...' : 'Importieren'}
                            </button>
                            <button
                              onClick={() => { setFile(null); setPreview(null); }}
                              className="border border-gray-200 text-gray-600 px-4 py-3 rounded-xl text-sm font-medium hover:bg-gray-50 transition-all">
                              Abbrechen
                            </button>
                          </div>
                        </div>
                      ) : (
                        <div className="space-y-3">
                          <p className="text-sm font-medium text-red-500">Fehler in der CSV-Datei</p>
                          <p className="text-xs text-gray-500">{preview.error}</p>
                          <button
                            onClick={() => { setFile(null); setPreview(null); }}
                            className="w-full border border-gray-200 text-gray-600 px-4 py-3 rounded-xl text-sm font-medium hover:bg-gray-50 transition-all">
                            Andere Datei wählen
                          </button>
                        </div>
                      )}
                    </div>
                  )}
                </>
              ) : (
                <div className="text-center py-8">
                  <div className="w-12 h-12 bg-gray-100 rounded-xl flex items-center justify-center mx-auto mb-4">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" className="text-gray-700">
                      <polyline points="20 6 9 17 4 12"/>
