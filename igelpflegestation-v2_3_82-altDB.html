                            <polyline points="20 6 9 17 4 12"/>
                          </svg>
                        )}
                      </div>
                    </button>
                  ))}
                  <div className="grid grid-cols-2 gap-3 pt-2">
                    <button onClick={() => setRoleModal(null)} className="py-3 border border-gray-200 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-50 transition-all">Abbrechen</button>
                    <button onClick={saveRole} className="py-3 bg-gray-900 text-white rounded-xl text-sm font-medium hover:bg-gray-700 transition-all">Speichern</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Self role change confirm */}
          {selfRoleConfirm && (
            <div className="fixed inset-0 bg-black bg-opacity-50 z-60 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl w-full max-w-sm shadow-xl p-5">
                <h2 className="text-base font-semibold text-gray-900 mb-2">Rolle ändern &amp; ausloggen</h2>
                <p className="text-sm text-gray-500 mb-4">Deine Rolle wird auf <span className="font-medium text-gray-900">{selfRoleConfirm.newRole === 'mitarbeiter' ? 'Mitarbeiter' : 'Gast'}</span> geändert. Du wirst danach ausgeloggt und hast keine Admin-Berechtigung mehr.</p>
                <div className="grid grid-cols-2 gap-3">
                  <button onClick={confirmSelfRoleChange} className="bg-gray-900 text-white py-3 rounded-xl text-sm font-medium hover:bg-gray-700 transition-all">Ja, fortfahren</button>
                  <button onClick={() => setSelfRoleConfirm(null)} className="border border-gray-200 text-gray-600 py-3 rounded-xl text-sm font-medium hover:bg-gray-50 transition-all">Abbrechen</button>
                </div>
              </div>
            </div>
          )}

          {/* Delete confirm */}
          {deleteConfirm && (
            <div className="fixed inset-0 bg-black bg-opacity-50 z-60 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl w-full max-w-sm shadow-xl p-5">
                <h2 className="text-base font-semibold text-gray-900 mb-2">{deleteConfirm.isSelf ? 'Account löschen' : 'Benutzer löschen'}</h2>
                <p className="text-sm text-gray-500 mb-4">
                  {deleteConfirm.isSelf
                    ? 'Deinen eigenen Account wirklich löschen? Du wirst ausgeloggt.'
                    : <><span className="font-medium text-gray-900">{deleteConfirm.userName}</span> wirklich löschen?</>}
                </p>
                <div className="grid grid-cols-2 gap-3">
                  <button onClick={confirmDeleteUser} className="bg-gray-900 text-white py-3 rounded-xl text-sm font-medium hover:bg-gray-700 transition-all">Löschen</button>
                  <button onClick={() => setDeleteConfirm(null)} className="border border-gray-200 text-gray-600 py-3 rounded-xl text-sm font-medium hover:bg-gray-50 transition-all">Abbrechen</button>
                </div>
              </div>
            </div>
          )}

          {/* Suspend confirm */}
          {suspendConfirm && (
            <div className="fixed inset-0 bg-black bg-opacity-50 z-60 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl w-full max-w-sm shadow-xl p-5">
                <h2 className="text-base font-semibold text-gray-900 mb-2">Benutzer {suspendConfirm.currentActive ? 'sperren' : 'entsperren'}</h2>
                <p className="text-sm text-gray-500 mb-4"><span className="font-medium text-gray-900">{suspendConfirm.userName}</span> wirklich {suspendConfirm.currentActive ? 'sperren' : 'entsperren'}?</p>
                <div className="grid grid-cols-2 gap-3">
                  <button onClick={confirmSuspendUser} className="bg-gray-900 text-white py-3 rounded-xl text-sm font-medium hover:bg-gray-700 transition-all">{suspendConfirm.currentActive ? 'Sperren' : 'Entsperren'}</button>
                  <button onClick={() => setSuspendConfirm(null)} className="border border-gray-200 text-gray-600 py-3 rounded-xl text-sm font-medium hover:bg-gray-50 transition-all">Abbrechen</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    const AddHedgehogForm = ({ userData, users, settings, onClose, onOpenHedgehog }) => {
      const [step, setStep] = useState(1);
      const [form, setForm] = useState({
        name: '',
        aufnahmedatum: new Date().toISOString().split('T')[0],
        status: 'aufnahme',
        fundort: '',
        finderName: '',
        finderCountryCode: '+49',
        finderTelefon: '',
        finderEmail: '',
        finderAdresse: '',
        geschlecht: '',
        alterSchaetzung: '',
        gewichtAktuell: '',
        betreuer: userData.name,
        notizen: ''
      });
      const [errors, setErrors] = useState({});
      const [saving, setSaving] = useState(false);
      const [addressSuggestions, setAddressSuggestions] = useState([]);
      const [showSuggestions, setShowSuggestions] = useState(false);
      const [addressLoading, setAddressLoading] = useState(false);
      const [savedHedgehog, setSavedHedgehog] = useState(null);
      const debounceTimer = useRef(null);

      const activeUsers = users.filter(u => u.active && !u.deleted);

      const searchAddress = async (query) => {
        if (query.length < 3) { setAddressSuggestions([]); setShowSuggestions(false); return; }
        setAddressLoading(true);
        try {
          const resp = await fetch(
            `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&addressdetails=1&countrycodes=de&limit=5`,
            { headers: { 'User-Agent': 'IgelpflegestationPro/1.0' } }
          );
          const data = await resp.json();
          setAddressSuggestions(data);
          setShowSuggestions(data.length > 0);
        } catch (e) { setAddressSuggestions([]); }
        setAddressLoading(false);
      };

      const handleAddressChange = (value) => {
        setForm(f => ({...f, finderAdresse: value}));
        if (debounceTimer.current) clearTimeout(debounceTimer.current);
        debounceTimer.current = setTimeout(() => searchAddress(value), 800);
      };

      const selectAddress = (s) => {
        setForm(f => ({...f, finderAdresse: s.display_name}));
        setShowSuggestions(false);
        setAddressSuggestions([]);
      };

      const validateStep1 = () => {
        const e = {};
        if (!form.name.trim())         e.name = true;
        if (!form.geschlecht)          e.geschlecht = true;
        if (!form.alterSchaetzung)     e.alterSchaetzung = true;
        if (!form.gewichtAktuell)      e.gewichtAktuell = true;
        if (!form.aufnahmedatum)       e.aufnahmedatum = true;
        if (!form.betreuer)            e.betreuer = true;
        setErrors(e);
        return Object.keys(e).length === 0;
      };

      const validateStep2 = () => {
        const e = {};
        if (!form.fundort.trim())      e.fundort = true;
        if (!form.finderName.trim())   e.finderName = true;
        if (!form.finderTelefon.trim()) e.finderTelefon = true;
        if (form.finderEmail && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.finderEmail)) e.finderEmail = true;
        setErrors(e);
        return Object.keys(e).length === 0;
      };

      const handleStep1Next = () => {
        if (validateStep1()) { setErrors({}); setStep(2); }
      };

      const doSave = async (skipStep2 = false) => {
        if (!skipStep2 && !validateStep2()) return;
        setSaving(true);
        try {
          const igelId = `IGL-${Date.now()}`;
          const hedgehogData = {
            igelId,
            name: form.name,
            aufnahmedatum: form.aufnahmedatum,
            status: form.status,
            fundort: skipStep2 ? '' : form.fundort,
            finderName: skipStep2 ? '' : form.finderName,
            finderKontakt: skipStep2 ? '' : `${form.finderCountryCode} ${form.finderTelefon}${form.finderEmail ? ' / ' + form.finderEmail : ''}`,
            finderCountryCode: form.finderCountryCode,
            finderTelefon: skipStep2 ? '' : form.finderTelefon,
            finderEmail: skipStep2 ? '' : (form.finderEmail || ''),
            finderAdresse: skipStep2 ? '' : (form.finderAdresse || ''),
            geschlecht: form.geschlecht,
            alterSchaetzung: form.alterSchaetzung,
            gewichtAktuell: form.gewichtAktuell ? parseFloat(form.gewichtAktuell) : 0,
            betreuer: form.betreuer,
            notizen: skipStep2 ? '' : form.notizen,
            gewichtsverlauf: form.gewichtAktuell ? [{
              datum: form.aufnahmedatum,
              gewicht: parseFloat(form.gewichtAktuell),
              notiz: 'Aufnahme',
              erfasstVon: userData.name,
              erfasstAm: new Date().toISOString()
            }] : [],
            diagnosen: [],
            behandlungen: [],
            statusHistory: [{ status: form.status, datum: new Date().toISOString(), geaendertVon: userData.name }],
            erstelltVon: userData.name,
            erstelltVonId: auth.currentUser.uid,
            erstelltAm: firebase.firestore.FieldValue.serverTimestamp(),
            zuletztBearbeitetVon: userData.name,
            zuletztBearbeitetAm: firebase.firestore.FieldValue.serverTimestamp()
          };
          const docRef = await db.collection('hedgehogs').add(hedgehogData);
          setSavedHedgehog({ ...hedgehogData, id: docRef.id });
        } catch (err) {
          alert('Fehler beim Speichern: ' + err.message);
          setSaving(false);
        }
      };

      const inpCls = (field) =>
        `w-full border rounded-xl px-4 py-3 text-sm focus:outline-none transition-all ${errors[field] ? 'border-red-400 bg-red-50' : 'border-gray-200 focus:border-gray-900'}`;

      // ── SUCCESS SCREEN ──────────────────────────────────────────
      if (savedHedgehog) {
        const statusLabels = { aufnahme:'Aufnahme', pflege:'In Pflege', ueberwinterung:'Überwinterung', auswilderung_bereit:'Auswilderungsbereit', ausgewildert:'Ausgewildert', verstorben:'Verstorben' };
        const printQR = () => {
          const container = document.getElementById('qrcode-container-add');
          if (container) {
            container.innerHTML = '';
            const qrUrl = `${window.location.origin}${window.location.pathname}#igel-${savedHedgehog.igelId}`;
            new QRCode(container, { text: qrUrl, width: 80, height: 80, colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
          }
          document.getElementById('qr-print-area').classList.remove('hidden');
          setTimeout(() => { window.print(); document.getElementById('qr-print-area').classList.add('hidden'); onClose(); }, 300);
        };
        return (
          <div className="min-h-screen bg-gray-50 pb-16 flex flex-col items-center justify-center px-4 py-10">
            <div className="w-full max-w-sm">
              <div className="bg-white rounded-2xl border border-gray-100 p-6 text-center">
                <div className="w-14 h-14 rounded-full bg-green-50 border-2 border-green-200 flex items-center justify-center mx-auto mb-4 text-3xl">🦔</div>
                <h2 className="text-lg font-bold text-gray-900 mb-1">{savedHedgehog.name} aufgenommen!</h2>
                <p className="text-xs text-gray-400 mb-5">Erfolgreich gespeichert · {savedHedgehog.igelId}</p>
                <div className="bg-gray-50 rounded-xl p-4 text-left mb-5 space-y-2">
                  {[
                    ['Geschlecht', savedHedgehog.geschlecht === 'männlich' ? '♂ Männlich' : savedHedgehog.geschlecht === 'weiblich' ? '♀ Weiblich' : '? Unbekannt'],
                    ['Gewicht', `${savedHedgehog.gewichtAktuell} g`],
                    ['Status', statusLabels[savedHedgehog.status] || savedHedgehog.status],
                    ['Betreuer', savedHedgehog.betreuer],
                    ['Aufnahme', savedHedgehog.aufnahmedatum]
                  ].map(([k,v]) => (
                    <div key={k} className="flex justify-between">
                      <span className="text-xs text-gray-400 font-semibold">{k}</span>
                      <span className="text-xs text-gray-900 font-bold">{v}</span>
                    </div>
                  ))}
                </div>
                <div id="qr-print-area" className="hidden">
                  <div className="qr-print-inner">
                    <div id="qrcode-container-add"></div>
                    <div style={{textAlign:'center',marginTop:'4px'}}>
                      <div style={{fontSize:'8pt',fontWeight:'bold',fontFamily:'monospace'}}>{savedHedgehog.igelId}</div>
                      <div style={{fontSize:'7pt',fontFamily:'sans-serif'}}>{savedHedgehog.name}</div>
                    </div>
                  </div>
                </div>
                <button onClick={printQR}
                  className="w-full bg-gray-900 text-white py-3 rounded-xl text-sm font-bold mb-3 hover:bg-gray-700 transition-all flex items-center justify-center gap-2">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M3 7V4a1 1 0 0 1 1-1h3"/><path d="M17 3h3a1 1 0 0 1 1 1v3"/><path d="M21 17v3a1 1 0 0 1-1 1h-3"/><path d="M7 21H4a1 1 0 0 1-1-1v-3"/><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
                  QR-Code drucken
                </button>
                <button onClick={() => onOpenHedgehog(savedHedgehog)} className="w-full border border-gray-200 text-gray-600 py-3 rounded-xl text-sm font-semibold hover:bg-gray-50 transition-all mb-3">
                  Zur Igelkarte →
                </button>
                <button onClick={() => { setSavedHedgehog(null); setStep(1); setForm({ name:'', aufnahmedatum:new Date().toISOString().split('T')[0], status:'aufnahme', fundort:'', finderName:'', finderCountryCode:'+49', finderTelefon:'', finderEmail:'', finderAdresse:'', geschlecht:'', alterSchaetzung:'', gewichtAktuell:'', betreuer:userData.name, notizen:'' }); setErrors({}); setSaving(false); }}
                  className="text-xs text-gray-400 hover:text-gray-600 transition-all">
                  Weiteren Igel erfassen
                </button>
              </div>
            </div>
          </div>
        );
      }

      // ── SHARED STYLES ───────────────────────────────────────────
      const fInpStyle = (err) => ({
        width:'100%', border: err ? '1.5px solid #e11d48' : '1.5px solid #e7e5e4',
        borderRadius:10, padding:'8px 11px', fontSize:12,
        fontFamily:"'DM Sans',sans-serif", color:'#1c1917',
        background: err ? '#fff7f7' : '#fafaf8', outline:'none'
      });
      const fLblStyle = (err) => ({
        fontSize:8, fontWeight:800, color: err ? '#e11d48' : '#a8a29e',
        textTransform:'uppercase', letterSpacing:'.1em',
        display:'block', marginBottom:4
      });
      const cardStyle = {
        background:'#fff', borderRadius:14, border:'1px solid #e7e5e4',
        boxShadow:'0 2px 8px rgba(28,25,23,.07)', overflow:'hidden', marginBottom:10
      };
      const cardHeaderStyle = {
        padding:'10px 13px 9px', display:'flex', alignItems:'center',
        gap:9, borderBottom:'1px solid #f5f5f4'
      };
      const cardIconStyle = {
        width:30, height:30, borderRadius:9, background:'#f5f5f4',
        display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0
      };
      const pflichtBadge = (txt) => (
        <span style={{marginLeft:'auto',fontSize:9,fontWeight:700,padding:'3px 8px',borderRadius:999,background:'#fff',color:'#1c1917',border:'1.5px solid #1c1917',whiteSpace:'nowrap',flexShrink:0}}>{txt}</span>
      );
      const optBadge = (
        <span style={{marginLeft:'auto',fontSize:9,fontWeight:700,padding:'3px 8px',borderRadius:999,background:'#f5f5f4',color:'#78716c',border:'1px solid #e7e5e4',whiteSpace:'nowrap',flexShrink:0}}>Optional</span>
      );

      // ── STEPPER ──────────────────────────────────────────────────
      const StepperHeader = () => (
        <div style={{background:'#fff',borderBottom:'1px solid #f0eeec',padding:'10px 16px 12px',display:'flex',alignItems:'flex-start',gap:0}}>
          {/* Step 1 */}
          <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:5}}>
            <div style={{width:28,height:28,borderRadius:'50%',background:'#1c1917',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:800,fontFamily:"'DM Mono',monospace"}}>
              {step > 1 ? <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg> : '1'}
            </div>
            <div style={{fontSize:10,fontWeight:700,color:'#1c1917',textAlign:'center'}}>Igel-Daten</div>
            <div style={{fontSize:8,color:'#a8a29e',textAlign:'center'}}>{step===1 ? '5 Pflichtfelder' : 'erledigt'}</div>
          </div>
          {/* Line */}
          <div style={{flex:1,height:1.5,background:step>1?'#1c1917':'#e7e5e4',marginTop:14}}/>
          {/* Step 2 */}
          <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:5}}>
            <div style={{width:28,height:28,borderRadius:'50%',background:step===2?'#1c1917':'#f5f5f4',color:step===2?'#fff':'#a8a29e',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:800,fontFamily:"'DM Mono',monospace"}}>2</div>
            <div style={{fontSize:10,fontWeight:700,color:step===2?'#1c1917':'#a8a29e',textAlign:'center'}}>Finder & Fundort</div>
            <div style={{fontSize:8,color:'#a8a29e',textAlign:'center'}}>optional</div>
          </div>
        </div>
      );

      // ── SCHRITT 1 ───────────────────────────────────────────────
      if (step === 1) return (
        <div style={{minHeight:'100vh',background:'#fafaf8',paddingBottom:'calc(env(safe-area-inset-bottom,0px) + 140px)'}}>
          <div style={{position:'sticky',top:0,zIndex:10}}>
            <div style={{background:'#fff',display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 16px',borderBottom:'2px solid #e7e5e4',position:'relative'}}>
              <button onClick={onClose} style={{width:36,height:36,borderRadius:'50%',background:'#f5f5f4',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1c1917" strokeWidth="2.5"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
              <span style={{position:'absolute',left:'50%',transform:'translateX(-50%)',fontSize:15,fontWeight:800,color:'#1c1917',fontFamily:"'DM Sans',sans-serif",whiteSpace:'nowrap'}}>Neuer Igel</span>
              <span style={{fontSize:11,fontWeight:700,color:'#a8a29e',fontFamily:"'DM Mono',monospace"}}>1 / 2</span>
            </div>
            <StepperHeader />
          </div>

          <div style={{padding:'12px 12px 0'}}>

            {/* Karte: Basisdaten */}
            <div style={cardStyle}>
              <div style={cardHeaderStyle}>
                <div style={cardIconStyle}><span style={{fontSize:14}}>🦔</span></div>
                <div>
                  <div style={{fontSize:13,fontWeight:800,color:'#1c1917'}}>Basisdaten</div>
                  <div style={{fontSize:9,color:'#a8a29e',marginTop:1}}>Name, Maße, Datum</div>
                </div>
                {pflichtBadge('5 Pflicht')}
              </div>
              <div style={{padding:'11px 13px',display:'flex',flexDirection:'column',gap:10}}>

                {/* Name */}
                <div>
                  <label style={fLblStyle(errors.name)}>Name <span style={{color:'#e11d48'}}>*</span></label>
                  <input type="text" value={form.name} onChange={e => setForm(f=>({...f,name:e.target.value}))}
                    placeholder="z.B. Stachi" style={fInpStyle(errors.name)} />
                  {errors.name && <div style={{fontSize:9,color:'#e11d48',fontWeight:600,marginTop:3}}>Bitte Namen eingeben</div>}
                </div>

                {/* Geschlecht */}
                <div>
                  <label style={fLblStyle(errors.geschlecht)}>Geschlecht <span style={{color:'#e11d48'}}>*</span></label>
                  <div style={{display:'flex',gap:0,padding:3,background:'#f5f5f4',borderRadius:11,outline:errors.geschlecht?'2px solid #fecdd3':'none',outlineOffset:1}}>
                    {[['männlich','♂ Männlich'],['weiblich','♀ Weiblich'],['unbekannt','? Unbek.']].map(([val,label]) => (
                      <button key={val} onClick={() => { setForm(f=>({...f,geschlecht:val})); setErrors(e=>({...e,geschlecht:undefined})); }}
                        style={{flex:1,padding:'7px 4px',borderRadius:8,fontSize:10,fontWeight:700,border:'none',cursor:'pointer',fontFamily:"'DM Sans',sans-serif",transition:'all .15s',
                          background:form.geschlecht===val?'#1c1917':'transparent',
                          color:form.geschlecht===val?'#fff':'#78716c'}}>
                        {label}
                      </button>
                    ))}
                  </div>
                  {errors.geschlecht && <div style={{fontSize:9,color:'#e11d48',fontWeight:600,marginTop:3}}>Bitte Geschlecht wählen</div>}
                </div>

                {/* Alter + Gewicht */}
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                  <div>
                    <label style={fLblStyle(errors.alterSchaetzung)}>Alter (Wo.) <span style={{color:'#e11d48'}}>*</span></label>
                    <input type="number" value={form.alterSchaetzung} onChange={e => setForm(f=>({...f,alterSchaetzung:e.target.value}))}
                      placeholder="z.B. 8" style={fInpStyle(errors.alterSchaetzung)} />
                    {errors.alterSchaetzung && <div style={{fontSize:9,color:'#e11d48',fontWeight:600,marginTop:3}}>Pflichtfeld</div>}
                  </div>
                  <div>
                    <label style={fLblStyle(errors.gewichtAktuell)}>Gewicht (g) <span style={{color:'#e11d48'}}>*</span></label>
                    <input type="number" value={form.gewichtAktuell} onChange={e => setForm(f=>({...f,gewichtAktuell:e.target.value}))}
                      placeholder="z.B. 420" style={fInpStyle(errors.gewichtAktuell)} />
                    {errors.gewichtAktuell && <div style={{fontSize:9,color:'#e11d48',fontWeight:600,marginTop:3}}>Pflichtfeld</div>}
                  </div>
                </div>

                {/* Aufnahmedatum */}
                <div>
                  <label style={fLblStyle(errors.aufnahmedatum)}>Aufnahmedatum <span style={{color:'#e11d48'}}>*</span></label>
                  <input type="date" value={form.aufnahmedatum} onChange={e => setForm(f=>({...f,aufnahmedatum:e.target.value}))}
                    style={fInpStyle(errors.aufnahmedatum)} />
                </div>

              </div>
            </div>

            {/* Karte: Status & Betreuung */}
            <div style={cardStyle}>
              <div style={cardHeaderStyle}>
                <div style={cardIconStyle}>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#78716c" strokeWidth="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </div>
                <div>
                  <div style={{fontSize:13,fontWeight:800,color:'#1c1917'}}>Status & Betreuung</div>
                  <div style={{fontSize:9,color:'#a8a29e',marginTop:1}}>Aktueller Zustand</div>
                </div>
                {pflichtBadge('2 Pflicht')}
              </div>
              <div style={{padding:'11px 13px',display:'flex',flexDirection:'column',gap:10}}>

                {/* Status — Chips */}
                <div>
                  <label style={fLblStyle(false)}>Status <span style={{color:'#e11d48'}}>*</span></label>
                  <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
                    {[['aufnahme','Aufnahme'],['pflege','In Pflege'],['ueberwinterung','Überwinterung'],['auswilderung_bereit','Auswilderungsbereit'],['ausgewildert','Ausgewildert'],['verstorben','Verstorben']].map(([val,label]) => (
                      <div key={val} onClick={() => setForm(f=>({...f,status:val}))}
                        style={{padding:'5px 10px',borderRadius:999,fontSize:10,fontWeight:700,cursor:'pointer',border:'1.5px solid',userSelect:'none',transition:'all .15s',
                          background:form.status===val?'#1c1917':'#fafaf8',
                          color:form.status===val?'#fff':'#78716c',
                          borderColor:form.status===val?'#1c1917':'#e7e5e4'}}>
                        {label}
                      </div>
                    ))}
                  </div>
                </div>

                {/* Betreuer */}
                <div>
                  <label style={fLblStyle(errors.betreuer)}>Betreuer <span style={{color:'#e11d48'}}>*</span></label>
                  <select value={form.betreuer} onChange={e => setForm(f=>({...f,betreuer:e.target.value}))}
                    style={{...fInpStyle(errors.betreuer), appearance:'none'}}>
                    {activeUsers.map(u => <option key={u.id} value={u.name}>{u.name}</option>)}
                  </select>
                </div>

              </div>
            </div>

          </div>

          {/* Nav */}
          <div style={{position:'fixed',bottom:0,left:0,right:0,background:'#fff',borderTop:'1px solid #e7e5e4',padding:'10px 12px',display:'flex',gap:8,paddingBottom:'calc(env(safe-area-inset-bottom,0px) + 74px)',zIndex:20}}>
            <button onClick={onClose} style={{flex:1,padding:12,borderRadius:12,background:'#f5f5f4',color:'#78716c',fontSize:13,fontWeight:700,border:'none',cursor:'pointer',fontFamily:"'DM Sans',sans-serif"}}>Abbrechen</button>
            <button onClick={handleStep1Next} style={{flex:2,padding:12,borderRadius:12,background:'#1c1917',color:'#fff',fontSize:13,fontWeight:800,border:'none',cursor:'pointer',fontFamily:"'DM Sans',sans-serif",display:'flex',alignItems:'center',justifyContent:'center',gap:6}}>
              Weiter → Finder
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
          </div>
        </div>
      );

      // ── SCHRITT 2 ───────────────────────────────────────────────
      return (
        <div style={{minHeight:'100vh',background:'#fafaf8',paddingBottom:'calc(env(safe-area-inset-bottom,0px) + 140px)'}}>
          <div style={{position:'sticky',top:0,zIndex:10}}>
            <div style={{background:'#fff',display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 16px',borderBottom:'2px solid #e7e5e4',position:'relative'}}>
              <button onClick={() => { setErrors({}); setStep(1); }} style={{width:36,height:36,borderRadius:'50%',background:'#f5f5f4',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1c1917" strokeWidth="2.5"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
              <span style={{position:'absolute',left:'50%',transform:'translateX(-50%)',fontSize:15,fontWeight:800,color:'#1c1917',fontFamily:"'DM Sans',sans-serif",whiteSpace:'nowrap'}}>Neuer Igel</span>
              <span style={{fontSize:11,fontWeight:700,color:'#a8a29e',fontFamily:"'DM Mono',monospace"}}>2 / 2</span>
            </div>
            <StepperHeader />
          </div>

          <div style={{padding:'12px 12px 0'}}>

            {/* Skip-Hinweis */}
            <div style={{background:'#fff',borderRadius:12,border:'1px solid #e7e5e4',padding:'10px 12px',display:'flex',alignItems:'flex-start',gap:9,marginBottom:10}}>
              <div style={{width:26,height:26,borderRadius:8,background:'#f5f5f4',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#78716c" strokeWidth="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
              </div>
              <p style={{fontSize:10,color:'#44403c',lineHeight:1.5}}><b style={{fontWeight:800}}>Finder-Infos optional.</b> Kann in der Igelkarte später ergänzt werden.</p>
            </div>

            {/* Karte: Fundort */}
            <div style={cardStyle}>
              <div style={cardHeaderStyle}>
                <div style={cardIconStyle}>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#78716c" strokeWidth="2.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                </div>
                <div>
                  <div style={{fontSize:13,fontWeight:800,color:'#1c1917'}}>Fundort</div>
                  <div style={{fontSize:9,color:'#a8a29e',marginTop:1}}>Wo wurde der Igel gefunden?</div>
                </div>
                {pflichtBadge('Pflicht')}
              </div>
              <div style={{padding:'11px 13px'}}>
                <label style={fLblStyle(errors.fundort)}>Fundort <span style={{color:'#e11d48'}}>*</span></label>
                <input type="text" value={form.fundort} onChange={e => setForm(f=>({...f,fundort:e.target.value}))}
                  placeholder="z.B. Stadtpark München, Nähe Brunnen" style={fInpStyle(errors.fundort)} />
                {errors.fundort && <div style={{fontSize:9,color:'#e11d48',fontWeight:600,marginTop:3}}>Bitte Fundort eingeben</div>}
              </div>
            </div>

            {/* Karte: Finder-Kontakt */}
            <div style={cardStyle}>
              <div style={cardHeaderStyle}>
                <div style={cardIconStyle}>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#78716c" strokeWidth="2.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </div>
                <div>
                  <div style={{fontSize:13,fontWeight:800,color:'#1c1917'}}>Finder-Kontakt</div>
                  <div style={{fontSize:9,color:'#a8a29e',marginTop:1}}>Wer hat den Igel gebracht?</div>
                </div>
                {pflichtBadge('2 Pflicht')}
              </div>
              <div style={{padding:'11px 13px',display:'flex',flexDirection:'column',gap:10}}>
                <div>
                  <label style={fLblStyle(errors.finderName)}>Name <span style={{color:'#e11d48'}}>*</span></label>
                  <input type="text" value={form.finderName} onChange={e => setForm(f=>({...f,finderName:e.target.value}))}
                    placeholder="Vor- und Nachname" style={fInpStyle(errors.finderName)} />
                  {errors.finderName && <div style={{fontSize:9,color:'#e11d48',fontWeight:600,marginTop:3}}>Bitte Namen eingeben</div>}
                </div>
                <div>
                  <label style={fLblStyle(errors.finderTelefon)}>Telefon <span style={{color:'#e11d48'}}>*</span></label>
                  <div style={{display:'flex',gap:7}}>
                    <select value={form.finderCountryCode} onChange={e => setForm(f=>({...f,finderCountryCode:e.target.value}))}
                      style={{...fInpStyle(false), width:88, flexShrink:0, appearance:'none'}}>
                      <option value="+49">🇩🇪 +49</option>
                      <option value="+43">🇦🇹 +43</option>
                      <option value="+41">🇨🇭 +41</option>
                      <option value="+33">🇫🇷 +33</option>
                      <option value="+31">🇳🇱 +31</option>
                      <option value="+32">🇧🇪 +32</option>
                      <option value="+48">🇵🇱 +48</option>
                      <option value="+420">🇨🇿 +420</option>
                    </select>
                    <input type="tel" value={form.finderTelefon} onChange={e => setForm(f=>({...f,finderTelefon:e.target.value.replace(/[^\d\s]/g,'')}))}
                      placeholder="Nummer" autoComplete="tel-national" name="phone"
                      style={{...fInpStyle(errors.finderTelefon), flex:1}} />
                  </div>
                  {errors.finderTelefon && <div style={{fontSize:9,color:'#e11d48',fontWeight:600,marginTop:3}}>Bitte Telefonnummer eingeben</div>}
                </div>
              </div>
            </div>

            {/* Karte: Weitere Infos (optional) */}
            <div style={cardStyle}>
              <div style={cardHeaderStyle}>
                <div style={cardIconStyle}>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#78716c" strokeWidth="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                </div>
                <div>
                  <div style={{fontSize:13,fontWeight:800,color:'#1c1917'}}>Weitere Infos</div>
                  <div style={{fontSize:9,color:'#a8a29e',marginTop:1}}>E-Mail, Adresse, Notizen</div>
                </div>
                {optBadge}
              </div>
              <div style={{padding:'11px 13px',display:'flex',flexDirection:'column',gap:10}}>
                <div>
                  <label style={fLblStyle(errors.finderEmail)}>E-Mail</label>
                  <input type="email" value={form.finderEmail} onChange={e => setForm(f=>({...f,finderEmail:e.target.value}))}
                    placeholder="finder@email.de" style={fInpStyle(errors.finderEmail)} />
                  {errors.finderEmail && <div style={{fontSize:9,color:'#e11d48',fontWeight:600,marginTop:3}}>Ungültige E-Mail</div>}
                </div>
                <div style={{position:'relative'}}>
                  <label style={fLblStyle(false)}>Adresse</label>
                  <input type="text" value={form.finderAdresse} onChange={e => handleAddressChange(e.target.value)}
                    onFocus={() => form.finderAdresse && searchAddress(form.finderAdresse)}
                    placeholder="Adresse (Autocomplete)" style={fInpStyle(false)} />
                  {addressLoading && (
                    <div style={{position:'absolute',right:10,top:'60%',width:14,height:14,border:'2px solid #e7e5e4',borderTopColor:'#1c1917',borderRadius:'50%',animation:'spin 1s linear infinite'}}/>
                  )}
                  {showSuggestions && addressSuggestions.length > 0 && (
                    <div style={{position:'absolute',zIndex:10,width:'100%',marginTop:4,background:'#fff',border:'1.5px solid #e7e5e4',borderRadius:10,boxShadow:'0 4px 16px rgba(28,25,23,.1)',maxHeight:200,overflowY:'auto'}}>
                      {addressSuggestions.map((sug, i) => (
                        <button key={i} type="button" onClick={() => selectAddress(sug)}
                          style={{width:'100%',textAlign:'left',padding:'8px 11px',borderBottom:'1px solid #f5f5f4',background:'transparent',cursor:'pointer',fontFamily:"'DM Sans',sans-serif"}}>
                          <div style={{fontSize:11,fontWeight:700,color:'#1c1917'}}>
                            {sug.address?.road && sug.address?.house_number ? sug.address.road+' '+sug.address.house_number : sug.display_name.split(',')[0]}
                          </div>
                          <div style={{fontSize:9,color:'#a8a29e',marginTop:2}}>
                            {sug.address?.postcode && sug.address?.city ? sug.address.postcode+' '+sug.address.city : sug.display_name.split(',').slice(1,3).join(', ')}
                          </div>
                        </button>
                      ))}
                    </div>
                  )}
                </div>
                <div>
                  <label style={fLblStyle(false)}>Notizen</label>
                  <textarea value={form.notizen} onChange={e => setForm(f=>({...f,notizen:e.target.value}))}
                    placeholder="Notizen, Befunde, Besonderheiten…"
                    style={{...fInpStyle(false), minHeight:64, resize:'none', lineHeight:1.4}} />
                </div>
              </div>
            </div>

          </div>

        if (diff > 0) return { label: '+'+diff+'g', up: true };

      const tlDoseTime  = (di, total, dayStart, dayLen) => dayStart + (dayLen/total)*di + (dayLen/total)*0.5;
      const tlGetFreq   = (frequency) => { const f=(frequency||'').toLowerCase(); if(f.includes('3x'))return 3; if(f.includes('2x'))return 2; return 1; };
      const tlSlotState = (med, di) => {
        const dayStart = tlDayStartH*3600;

        const freq     = tlGetFreq(med.frequency);

          return appSec >= (t-tolSec) && appSec <= (t+tolSec);
        });
        if (slotGiven) return inW ? 'done-open' : 'done-locked';

        return 'overdue-locked';

                          {/* ── Verlauf-Toggle ── */}
                          <div onClick={() => toggleVerlauf(idx)}

                          {/* ── Verlauf-Inhalt ── */}
                          {verlaufOpen && (() => {
                            // Baue geclusterte Zukunfts-Einträge pro Medikament
                            const futureClusters = (t.medications||[]).flatMap((m) => {
                              const planned   = parseInt(m.plannedApplications)||0;
                              const completed = parseInt(m.completedApplications)||0;
                              const remaining = planned - completed;
                              if (remaining <= 0) return [];
                              const freq = (() => { const f=(m.frequency||'').toLowerCase(); if(f.includes('2x')) return 2; if(f.includes('3x')) return 3; if(f.includes('4x')) return 4; return 1; })();
                              const todayCount = (m.applications||[]).filter(a => a.doneAt && a.doneAt.startsWith(todayStr)).length;
                              const todayPending = Math.max(0, freq - todayCount);
                              // Heute ausstehend: separat, nicht in clusters
                              let gaveNr = completed + todayPending + 1; // erste Gabe ab morgen
                              let remainingAfterToday = remaining - todayPending;
                              const clusters = [];
                              const startD = new Date(todayStr);
                              let dayOffset = 1;
                              while (remainingAfterToday > 0) {
                                const d = new Date(startD);
                                d.setDate(d.getDate() + dayOffset);
                                const dayStr = d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
                                const dayKey = d.toISOString().split('T')[0];
                                const gabsThisDay = Math.min(freq, remainingAfterToday);
                                const gaben = [];
                                for(let g=0;g<gabsThisDay;g++) { gaben.push({nr: gaveNr++, med: m.medicationName, dose: (m.actualDose||m.dose)+' '+m.unit+' · '+m.applicationRoute}); }
                                clusters.push({dayStr, dayKey, gaben, medName: m.medicationName});
                                remainingAfterToday -= gabsThisDay;
                                dayOffset++;
                              }
                              return clusters;
                            });
                            // Merge clusters by day
                            const dayMap = {};
                            futureClusters.forEach(c => {
                              if (!dayMap[c.dayKey]) dayMap[c.dayKey] = {dayStr: c.dayStr, dayKey: c.dayKey, gaben: []};
                              dayMap[c.dayKey].gaben.push(...c.gaben);
                            });
                            const sortedDays = Object.values(dayMap).sort((a,b) => a.dayKey.localeCompare(b.dayKey));
                            // Gruppiere weit entfernte Tage (>3 Tage) zusammen
                            const nearDays = sortedDays.filter((_,i) => i < 3);
                            const farDays  = sortedDays.filter((_,i) => i >= 3);
                            const farGaben = farDays.flatMap(d => d.gaben);
                            return (
                              <div style={{background:'#f5f5f4',borderTop:'1px solid #e7e5e4',padding:14}}>
                                {/* Legende */}
                                <div style={{display:'flex',gap:12,marginBottom:12,flexWrap:'wrap'}}>
                                  {[['#22c55e','erledigt'],['#fb923c','heute offen'],['#d1d5db','geplant']].map(([c,l]) => (
                                    <div key={l} style={{display:'flex',alignItems:'center',gap:5,fontSize:10,color:'#888',fontWeight:600}}>
                                      <div style={{width:9,height:9,borderRadius:'50%',background:c}}/>{l}
                                    </div>
                                  ))}
                                </div>
                                <div style={{position:'relative',paddingLeft:26}}>
                                  <div style={{position:'absolute',left:8,top:8,bottom:8,width:2,background:'#efefef',borderRadius:2}}/>

                                  {/* Erledigte Gaben + verpasste Slots */}
                                  {(() => {
                                    // Baue pro Tag eine Liste: given[] + missed[]
                                    const allMeds = t.medications || [];
                                    // Alle Tage mit mind. einer App (vergangen, nicht heute)
                                    const pastApps = allApps.filter(a => a.doneAt && !a.doneAt.startsWith(tlTodayStr));
                                    const todayApps = allApps.filter(a => a.doneAt && a.doneAt.startsWith(tlTodayStr));
                                    // Verpasste Gaben: pro Medikament, pro vergangenen Tag
                                    // Alle Tage seit startDate bis gestern
                                    const startDate = t.startDate ? t.startDate : null;
                                    const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
                                    const missedEntries = [];
                                    if (startDate) {
                                      const sD = new Date(startDate);
                                      for (let d = new Date(sD); d <= yesterday; d.setDate(d.getDate()+1)) {
                                        const dStr = d.toISOString().split('T')[0];
                                        allMeds.forEach(m => {
                                          if (m.done) return;
                                          const freq = tlGetFreq(m.frequency);
                                          const dayCount = (m.applications||[]).filter(a => a.doneAt && a.doneAt.startsWith(dStr)).length;
                                          const missed = freq - dayCount;
                                          if (missed > 0) {
                                            missedEntries.push({
                                              date: dStr,
                                              dateLabel: new Date(dStr).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit'}),
                                              medName: m.medicationName,
                                              missed,
                                              freq
                                            });
                                          }
                                        });
                                      }
                                    }

                                    // Merge: alle Einträge sortiert nach Datum
                                    const givenItems = pastApps.map(a => ({type:'given', date: a.doneAt?.split('T')[0]||'', entry: a}));
                                    const missedItems = missedEntries.map(e => ({type:'missed', date: e.date, entry: e}));
                                    const allItems = [...givenItems, ...missedItems].sort((a,b) => a.date.localeCompare(b.date)).slice(0, 20);

                                    if (allItems.length === 0 && todayApps.length === 0) {
                                      return <p style={{fontSize:11,color:'#bbb',marginBottom:10}}>Noch keine Gaben dokumentiert</p>;
                                    }
                                    return allItems.map((item, ii) => {
                                      if (item.type === 'given') {
                                        const a = item.entry;
                                        const isToday = a.doneAt && a.doneAt.startsWith(tlTodayStr);
                                        return (
                                          <div key={'g'+ii} style={{position:'relative',marginBottom:10}}>
                                            <div style={{position:'absolute',left:-22,width:12,height:12,borderRadius:'50%',top:5,background:'#22c55e',border:'2px solid #fafafa',boxShadow: isToday ? '0 0 0 3px rgba(34,197,94,.2)' : 'none'}}/>
                                            <div style={{background:'#fff',borderRadius:12,border:'1px solid #eee',padding:'9px 12px'}}>
                                              <div style={{fontSize:10,fontWeight:700,color:'#22c55e',marginBottom:3}}>✓ {isToday ? 'Heute · '+tlTodayStr.split('-').reverse().join('.') : new Date(a.doneAt).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'2-digit'})}</div>
                                              <div style={{fontSize:12,fontWeight:600,color:'#222'}}>{a.medName}</div>
                                              <div style={{fontSize:10,color:'#aaa',marginTop:2}}>{a.dose}</div>
                                              <div style={{fontSize:10,fontWeight:600,color:'#a8a29e',marginTop:3}}>{a.doneBy} · {new Date(a.doneAt).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})} Uhr</div>
                                            </div>
                                          </div>
                                        );
                                      } else {
                                        // Verpasste Gabe
                                        const e = item.entry;
                                        return (
                                          <div key={'m'+ii} style={{position:'relative',marginBottom:10}}>
                                            <div style={{position:'absolute',left:-24,top:5,width:16,height:16,borderRadius:4,background:'#fff1f2',border:'1px solid #fecdd3',display:'flex',alignItems:'center',justifyContent:'center'}}>
                                              <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#e11d48" strokeWidth="2.5"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                                            </div>
                                            <div style={{background:'#fff7f7',borderRadius:12,border:'1px solid #fecdd3',padding:'9px 12px'}}>
                                              <div style={{fontSize:10,fontWeight:700,color:'#e11d48',marginBottom:3}}>{e.missed}× verpasst · {e.dateLabel}</div>
                                              <div style={{fontSize:12,fontWeight:600,color:'#444'}}>{e.medName}</div>
                                              <div style={{fontSize:10,color:'#aaa',marginTop:2}}>{e.missed} von {e.freq} Gaben nicht durchgeführt</div>
                                            </div>
                                          </div>
                                        );
                                      }
                                    });
                                  })()}

                                  {/* Heute erledigte Gaben */}
                                  {allApps.filter(a => a.doneAt && a.doneAt.startsWith(tlTodayStr)).map((a,ai) => (
                                    <div key={'t'+ai} style={{position:'relative',marginBottom:10}}>
                                      <div style={{position:'absolute',left:-22,width:12,height:12,borderRadius:'50%',top:5,background:'#22c55e',border:'2px solid #fafafa',boxShadow:'0 0 0 3px rgba(34,197,94,.2)'}}/>
                                      <div style={{background:'#fff',borderRadius:12,border:'1px solid #eee',padding:'9px 12px'}}>
                                        <div style={{fontSize:10,fontWeight:700,color:'#22c55e',marginBottom:3}}>✓ Heute · {tlTodayStr.split('-').reverse().join('.')}</div>
                                        <div style={{fontSize:12,fontWeight:600,color:'#222'}}>{a.medName}</div>
                                        <div style={{fontSize:10,color:'#aaa',marginTop:2}}>{a.dose}</div>
                                        <div style={{fontSize:10,fontWeight:600,color:'#a8a29e',marginTop:3}}>{a.doneBy} · {new Date(a.doneAt).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})} Uhr</div>
                                      </div>
                                    </div>
                                  ))}

                                  {/* Heute offen */}
                                  {(t.medications||[]).some(m => {
                                    const freq = (() => { const f=(m.frequency||'').toLowerCase(); if(f.includes('2x')) return 2; if(f.includes('3x')) return 3; if(f.includes('4x')) return 4; return 1; })();
                                    const tc = (m.applications||[]).filter(a => a.doneAt && a.doneAt.startsWith(todayStr)).length;
                                    return tc < freq && !m.done && parseInt(m.plannedApplications) > parseInt(m.completedApplications||0);
                                  }) && isAktiv && (
                                    <div style={{position:'relative',marginBottom:10}}>
                                      <div style={{position:'absolute',left:-22,width:12,height:12,borderRadius:'50%',top:5,background:'#fb923c',border:'2px solid #fafafa',boxShadow:'0 0 0 3px rgba(251,146,60,.2)'}}/>
                                      <div style={{background:'#fff',borderRadius:12,border:'1px solid #fed7aa',padding:'9px 12px'}}>
                                        <div style={{fontSize:10,fontWeight:700,color:'#fb923c',marginBottom:3}}>⏳ Heute noch ausstehend</div>
                                        {(t.medications||[]).map((m,mi) => {
                                          const freq = (() => { const f=(m.frequency||'').toLowerCase(); if(f.includes('2x')) return 2; if(f.includes('3x')) return 3; if(f.includes('4x')) return 4; return 1; })();
                                          const tc = (m.applications||[]).filter(a => a.doneAt && a.doneAt.startsWith(todayStr)).length;
                                          const pending = freq - tc;
                                          if(pending <= 0 || m.done) return null;
                                          return <div key={mi} style={{fontSize:11,color:'#f97316',marginTop:2}}>{m.medicationName} · noch {pending}× {m.actualDose||m.dose} {m.unit}</div>;
                                        })}
                                      </div>
                                    </div>
                                  )}

                                  {/* Geclusterte Zukunft — nächste 3 Tage einzeln */}
                                  {nearDays.map((day, di) => {
                                    const isExp = !!expandedDays[day.dayKey];
                                    const tomorrow = new Date(todayStr); tomorrow.setDate(tomorrow.getDate()+1);
                                    const tomorrowStr = tomorrow.toISOString().split('T')[0];
                                    const dayLabel = day.dayKey === tomorrowStr ? 'Morgen' : day.dayStr;
                                    return (
                                      <div key={day.dayKey} style={{position:'relative',marginBottom:10}}>
                                        <div style={{position:'absolute',left:-22,width:12,height:12,borderRadius:'50%',top:5,background:'#fff',border:'2px solid #d1d5db'}}/>
                                        <div onClick={() => toggleDay(day.dayKey)}
                                          style={{background:'#f7f7f7',borderRadius:12,border:'1px dashed #e5e7eb',padding:'9px 12px',cursor:'pointer',transition:'background .15s'}}>
                                          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                                            <div>
                                              <div style={{fontSize:10,fontWeight:700,color:'#aaa',marginBottom:3}}>{day.dayStr} — {dayLabel}</div>
                                              <div style={{fontSize:12,fontWeight:600,color:'#bbb'}}>{day.gaben.length} Gabe{day.gaben.length>1?'n':''} geplant</div>
                                              <div style={{fontSize:10,color:'#d1d5db',marginTop:2}}>{[...new Set(day.gaben.map(g=>g.med))].join(', ')}</div>
                                            </div>
                                            <div style={{display:'flex',alignItems:'center',gap:6,flexShrink:0}}>
                                              <span style={{fontSize:10,fontWeight:700,background:'#e5e7eb',color:'#888',padding:'2px 8px',borderRadius:999}}>{day.gaben.length}</span>
                                              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" strokeWidth="2.5" style={{transition:'transform .3s',transform: isExp ? 'rotate(90deg)' : 'none'}}><polyline points="9 18 15 12 9 6"/></svg>
                                            </div>
                                          </div>
                                          {/* Aufgeklappt: Einzelgaben */}
                                          {isExp && (
                                            <div style={{marginTop:8,paddingTop:8,borderTop:'1px solid #f0f0f0'}}>
                                              {day.gaben.map((g,gi) => (
                                                <div key={gi} style={{display:'flex',alignItems:'center',gap:8,padding:'3px 0'}}>
                                                  <div style={{width:6,height:6,borderRadius:'50%',background:'#d1d5db',flexShrink:0}}/>
                                                  <span style={{fontSize:11,color:'#bbb',flex:1}}>Gabe {g.nr} · {g.med}</span>
                                                  <span style={{fontSize:10,color:'#d1d5db'}}>{g.dose}</span>
                                                </div>
                                              ))}
                                            </div>
                                          )}
                                        </div>
                                      </div>
                                    );
                                  })}

                                  {/* Weit entfernte Tage: zusammengefasst */}
                                  {farDays.length > 0 && (() => {
                                    const isExp = !!expandedDays['__far__'];
                                    const firstDay = farDays[0].dayStr;
                                    const lastDay  = farDays[farDays.length-1].dayStr;
                                    return (
                                      <div style={{position:'relative',marginBottom:0}}>
                                        <div style={{position:'absolute',left:-22,width:12,height:12,borderRadius:'50%',top:5,background:'#fff',border:'2px solid #d1d5db'}}/>
                                        <div onClick={() => toggleDay('__far__')}
                                          style={{background:'#f7f7f7',borderRadius:12,border:'1px dashed #e5e7eb',padding:'9px 12px',cursor:'pointer'}}>
                                          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                                            <div>
                                              <div style={{fontSize:10,fontWeight:700,color:'#aaa',marginBottom:3}}>{firstDay} – {lastDay}</div>
                                              <div style={{fontSize:12,fontWeight:600,color:'#bbb'}}>{farGaben.length} Gaben · {farDays.length} Tage</div>
                                            </div>
                                            <div style={{display:'flex',alignItems:'center',gap:6,flexShrink:0}}>
                                              <span style={{fontSize:10,fontWeight:700,background:'#e5e7eb',color:'#888',padding:'2px 8px',borderRadius:999}}>{farGaben.length}</span>
                                              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" strokeWidth="2.5" style={{transition:'transform .3s',transform: isExp ? 'rotate(90deg)' : 'none'}}><polyline points="9 18 15 12 9 6"/></svg>
                                            </div>
                                          </div>
                                          {isExp && (
                                            <div style={{marginTop:8,paddingTop:8,borderTop:'1px solid #f0f0f0'}}>
                                              {farDays.map((day,di) => (
                                                <div key={di} style={{padding:'3px 0',borderBottom: di < farDays.length-1 ? '1px solid #f5f5f5' : 'none'}}>
                                                  <div style={{fontSize:10,fontWeight:700,color:'#bbb',marginBottom:2}}>{day.dayStr}</div>
                                                  {day.gaben.map((g,gi) => (
                                                    <div key={gi} style={{display:'flex',alignItems:'center',gap:8,padding:'2px 0'}}>
                                                      <div style={{width:5,height:5,borderRadius:'50%',background:'#e5e7eb',flexShrink:0}}/>
                                                      <span style={{fontSize:11,color:'#bbb',flex:1}}>Gabe {g.nr} · {g.med}</span>
                                                      <span style={{fontSize:10,color:'#d1d5db'}}>{g.dose}</span>
                                                    </div>
                                                  ))}
                                                </div>
                                              ))}
                                            </div>
                                          )}
                                        </div>
                                      </div>
                                    );
                                  })()}

                                </div>
                                {t.notes && <p style={{fontSize:11,color:'#aaa',fontStyle:'italic',marginTop:12,paddingTop:10,borderTop:'1px solid #f0f0f0'}}>{t.notes}</p>}
                              </div>
                            );
                          })()}

                        </div>
                      );
                    };
                    return (
                      <div className="space-y-3">
                        {aktive.map((t,i) => <TRow key={i} t={t} idx={treatments.indexOf(t)} />)}
                        {abg.length > 0 && aktive.length > 0 && (
                          <div className="flex items-center gap-3 py-1">
                            <div className="h-px flex-1 bg-gray-100"/>
                            <span className="text-[10px] text-gray-400 uppercase tracking-wide">abgeschlossen</span>
                            <div className="h-px flex-1 bg-gray-100"/>
                          </div>
                        )}
                        {abg.map((t,i) => <TRow key={'a'+i} t={t} idx={treatments.indexOf(t)} />)}
                      </div>
                    );
                  })()}
                </div>

              </div>
            )}
            {/* GEWICHT */}
            {activeKachel === 'gewicht' && (
              <div className="space-y-3 fade-in">
                {/* Gewicht */}
            <div className="bg-white rounded-xl border border-gray-100 p-4">
              <div className="flex items-center justify-between mb-3">
                <p className="text-xs font-medium text-gray-500 uppercase tracking-wide">Gewicht</p>
                {edit && (
                  <button onClick={() => setShowWeightModal(true)} className="text-xs font-medium text-gray-900 border border-gray-200 px-3 py-1.5 rounded-lg hover:bg-gray-50 transition-all">
                    + Messung
                  </button>
                )}
              </div>
              <div className="space-y-2">
                {(data.gewichtsverlauf || []).slice().reverse().map((w, i) => (
                  <div key={i} className="flex justify-between items-center py-2 border-b border-gray-50 last:border-0">
                    <span style={{fontSize:13,fontWeight:700,color:"#1c1917"}}>{w.gewicht} g</span>
                    <div className="text-right">
                      <div className="text-xs text-gray-400">{w.datum}</div>
                      <div className="text-xs text-gray-400">{w.erfasstVon}</div>
                    </div>
                  </div>
                ))}
                {(!data.gewichtsverlauf || data.gewichtsverlauf.length === 0) && (
                  <p className="text-sm text-gray-400 py-2">Noch keine Messungen</p>
                )}
              </div>
            </div>
              </div>
            )}

            {/* DIAGNOSE */}
            {activeKachel === 'diagnose' && (() => {
              // Diagnosen automatisch aus Behandlungen ableiten
              const allTreatments = data.treatments || [];
              // Deduplizieren nach diagnosisName
              const diagMap = {};
              allTreatments.forEach(t => {
                if (!t.diagnosisName) return;
                const key = t.diagnosisName;
                if (!diagMap[key]) {
                  diagMap[key] = { name: t.diagnosisName, treatments: [] };
                }
                diagMap[key].treatments.push(t);
              });
              const diagList = Object.values(diagMap);
              return (
                <div className="space-y-3 fade-in">
                  <div className="bg-white rounded-xl border border-gray-100 p-4">
                    <p className="text-xs font-medium text-gray-500 uppercase tracking-wide mb-3">Diagnosen aus Behandlungen</p>
                    {diagList.length === 0 ? (
                      <p className="text-sm text-gray-400">Keine Diagnosen — werden automatisch aus Behandlungsvorlagen übernommen.</p>
                    ) : (
                      <div className="space-y-3">
                        {diagList.map((d, i) => {
                          const aktive = d.treatments.filter(t => t.status === 'aktiv');
                          const abg    = d.treatments.filter(t => t.status !== 'aktiv');
                          return (
                            <div key={i} className="border border-gray-100 rounded-xl p-3">
                              <div className="flex items-start justify-between gap-2 mb-2">
                                <p style={{fontSize:13,fontWeight:700,color:"#1c1917"}}>{d.name}</p>
                                <div className="flex gap-1 flex-shrink-0">
                                  {aktive.length > 0 && (
                                    <span className="text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-gray-900 text-white">{aktive.length} aktiv</span>
                                  )}
                                  {abg.length > 0 && (
                                    <span className="text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-gray-100 text-gray-500">{abg.length} abg.</span>
                                  )}
                                </div>
                              </div>
                              <div className="space-y-1">
                                {d.treatments.map((t, ti) => (
                                  <div key={ti} className="flex justify-between items-center text-xs py-1 border-t border-gray-50 first:border-0">
                                    <span className="text-gray-600">{t.templateName}</span>
                                    <span className="text-gray-400">{t.startDate}{t.endDate ? ' – ' + t.endDate : ''}</span>
                                  </div>
                                ))}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                </div>
              );
            })()}

            {/* INFO */}
            {activeKachel === 'info' && (
              <div className="space-y-3 fade-in">
                {/* Fundort & Finder */}
            <div className="bg-white rounded-xl border border-gray-100 p-4">
              <p className="text-xs font-medium text-gray-500 uppercase tracking-wide mb-3">Fundort & Finder</p>
              {edit ? (
                <div className="space-y-3">
                  <input type="text" value={data.fundort || ''} placeholder="Fundort"
                    onChange={(e) => updateField('fundort', e.target.value)} className={fieldClass} />
                  <input type="text" value={data.finderName || ''} placeholder="Finder Name"
                    onChange={(e) => updateField('finderName', e.target.value)} className={fieldClass} />
                  <input type="text" value={data.finderTelefon || ''} placeholder="Telefon"
                    onChange={(e) => updateField('finderTelefon', e.target.value)} className={fieldClass} />
                  <input type="email" value={data.finderEmail || ''} placeholder="E-Mail"
                    onChange={(e) => updateField('finderEmail', e.target.value)} className={fieldClass} />
                  <input type="text" value={data.finderAdresse || ''} placeholder="Adresse"
                    onChange={(e) => updateField('finderAdresse', e.target.value)} className={fieldClass} />
                </div>
              ) : (
              <div className="space-y-2">
                {[
                  ['Ort', data.fundort],
                  ['Finder', data.finderName],
                ].map(([label, value]) => (
                  <div key={label} className="flex justify-between items-baseline">
                    <span className="text-sm text-gray-400">{label}</span>
                    <span className="text-sm font-medium text-gray-900">{value || '–'}</span>
                  </div>
                ))}
                {/* Telefon - anklickbar */}
                {(data.finderTelefon || data.finderKontakt) && (
                  <div className="flex justify-between items-baseline">
                    <span className="text-sm text-gray-400">Telefon</span>
                    <a 
                      href={`tel:${data.finderCountryCode || '+49'}${data.finderTelefon || data.finderKontakt}`}
                      className="text-sm font-medium text-gray-900 underline underline-offset-2"
                    >
                      {data.finderCountryCode || '+49'} {data.finderTelefon || data.finderKontakt}
                    </a>
                  </div>
                )}
                {/* Email - anklickbar */}
                {data.finderEmail && (
                  <div className="flex justify-between items-baseline">
                    <span className="text-sm text-gray-400">E-Mail</span>
                    <a 
                      href={`mailto:${data.finderEmail}`}
                      className="text-sm font-medium text-gray-900 underline underline-offset-2"
                    >
                      {data.finderEmail}
                    </a>
                  </div>
                )}
                {data.finderAdresse && (
                  <div className="flex justify-between items-baseline">
                    <span className="text-sm text-gray-400">Adresse</span>
                    <a
                      href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(data.finderAdresse)}`}
                      target="_blank" rel="noopener noreferrer"
                      className="text-sm font-medium text-gray-900 underline underline-offset-2"
                    >
                      {data.finderAdresse}
                    </a>
                  </div>
                )}
              </div>
              )}
            </div>

            {/* Basisdaten */}
            <div className="bg-white rounded-xl border border-gray-100 p-4">
              <p className="text-xs font-medium text-gray-500 uppercase tracking-wide mb-3">Basisdaten</p>
              <div className="space-y-3">
                {edit ? (
                  <>
                    <input type="text" value={data.name} placeholder="Name"
                      onChange={(e) => updateField('name', e.target.value)} className={fieldClass} />
                    <select value={data.geschlecht} onChange={(e) => updateField('geschlecht', e.target.value)} className={fieldClass}>
                      <option value="">Geschlecht</option>
                      <option value="männlich">Männlich</option>
                      <option value="weiblich">Weiblich</option>
                    </select>
                    <input type="text" value={data.alterSchaetzung} placeholder="Alter (Wochen)"
                      onChange={(e) => updateField('alterSchaetzung', e.target.value)} className={fieldClass} />
                    <input type="number" value={data.gewichtAktuell || ''} placeholder="Gewicht aktuell (g)"
                      onChange={(e) => updateField('gewichtAktuell', e.target.value)} className={fieldClass} />
                    <input type="date" value={data.aufnahmedatum || ''}
                      onChange={(e) => updateField('aufnahmedatum', e.target.value)} className={fieldClass} />
                    <select value={data.betreuer} onChange={(e) => updateField('betreuer', e.target.value)} className={fieldClass}>
                      {activeUsers.map(u => <option key={u.id} value={u.name}>{u.name}</option>)}
                    </select>
                    <select value={data.status} onChange={(e) => { updateField('status', e.target.value); changeStatus(e.target.value); }} className={fieldClass}>
                      <option value="aufnahme">Aufnahme</option>
                      <option value="pflege">In Pflege</option>
                      <option value="ueberwinterung">Überwinterung</option>
                      <option value="auswilderung_bereit">Auswilderungsbereit</option>
                      <option value="ausgewildert">Ausgewildert</option>
                      <option value="verstorben">Verstorben</option>
                    </select>
                  </>
                ) : (
                  <div className="space-y-2">
                    {[
                      ['Name', data.name],
                      ['Geschlecht', data.geschlecht],
                      ['Alter', data.alterSchaetzung ? `${data.alterSchaetzung} Wochen` : null],
                      ['Betreuer', data.betreuer],
                      ['Status', statusLabel[data.status] || data.status],
                    ].map(([label, value]) => (
                      <div key={label} className="flex justify-between items-baseline">
                        <span className="text-sm text-gray-400">{label}</span>
                        <span className="text-sm font-medium text-gray-900">{value || '–'}</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>

            {/* Notizen */}
            <div className="bg-white rounded-xl border border-gray-100 p-4">
              <p className="text-xs font-medium text-gray-500 uppercase tracking-wide mb-3">Notizen</p>
              {edit ? (
                <textarea value={data.notizen} onChange={(e) => updateField('notizen', e.target.value)}
                  className="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-gray-400 min-h-24 resize-none" />
              ) : (
                <p className="text-sm text-gray-700 whitespace-pre-wrap leading-relaxed">{data.notizen || <span className="text-gray-400">Keine Notizen</span>}</p>
              )}
            </div>

            {/* Meta-Info */}
            <div className="bg-gray-50 rounded-xl p-4">
              <div className="space-y-1">
                <div className="flex justify-between">
                  <span className="text-xs text-gray-400">ID</span>
                  <span className="text-xs font-mono text-gray-600">{data.igelId}</span>
                </div>
                <div className="flex justify-between">
                  <span className="text-xs text-gray-400">Aufnahme</span>
                  <span className="text-xs text-gray-600">{data.aufnahmedatum}</span>
                </div>
                <div className="flex justify-between">
                  <span className="text-xs text-gray-400">Erfasst von</span>
                  <span className="text-xs text-gray-600">{data.erstelltVon}</span>
                </div>
                {data.zuletztBearbeitetVon && (
                  <div className="flex justify-between">
                    <span className="text-xs text-gray-400">Zuletzt bearbeitet</span>
                    <span className="text-xs text-gray-600">{data.zuletztBearbeitetVon}</span>
                  </div>
                )}
              </div>
            </div>

                  {/* Notiz */}
                  <div className="border-t border-gray-50 pt-4">
                    <p className="text-xs font-medium text-gray-500 mb-1.5">Notiz / Besonderheiten</p>
                    <textarea placeholder="Optionale Anmerkung, Reaktionen, Dosierungsanpassungen…"

                      Abbrechen
                    </button>
                  </div>
                </div>
                </>
                )}
              </div>
            </div>
            );
          })()}

          {/* Delete Confirm Modal */}
          {showDeleteModal && (
            <div className="fixed inset-0 bg-black bg-opacity-50 z-60 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl w-full max-w-sm shadow-xl">
                <div className="p-5">
                  <h2 className="text-base font-semibold text-gray-900 mb-2">Igel löschen</h2>
                  <p className="text-sm text-gray-500 mb-4">
                    Möchtest du <span className="font-medium text-gray-900">{data.name}</span> wirklich löschen? Diese Aktion kann nicht rückgängig gemacht werden.

                  <div className="grid grid-cols-2 gap-3">
                    <button onClick={deleteHedgehog}

                    </button>
                    <button onClick={() => setShowDeleteModal(false)}
                      className="border border-gray-200 text-gray-600 py-3 rounded-xl text-sm font-medium hover:bg-gray-50 transition-all">
                      Abbrechen
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
          {showQR && (
            <div className="fixed inset-0 bg-black bg-opacity-50 z-60 flex items-center justify-center p-4" onClick={() => setShowQR(false)}>
              <div className="bg-white rounded-2xl w-full max-w-sm shadow-xl" onClick={(e) => e.stopPropagation()} id="qr-print-area">
                <div className="flex items-center justify-between p-5 border-b border-gray-100">

                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="text-gray-700">
                      <rect x="3" y="3" width="7" height="7"/>
                      <rect x="14" y="3" width="7" height="7"/>
                      <rect x="14" y="14" width="7" height="7"/>
                      <rect x="3" y="14" width="7" height="7"/>
                    </svg>
                    <h2 className="text-base font-semibold text-gray-900">QR-Code</h2>
                  </div>
                  <button onClick={() => setShowQR(false)} className="text-gray-400 hover:text-gray-600 w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 transition-all no-print">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                  </button>
                </div>

                <div className="p-6 flex flex-col items-center space-y-4">
                  {/* QR Code */}
                  <div id="qrcode-container" className="bg-white p-3 rounded-xl border border-gray-200"></div>
                  
                  {/* Igel Info */}
                  <div className="text-center space-y-1">
                    <p style={{fontSize:13,fontWeight:700,color:"#1c1917"}}>{data.name || 'Unbenannt'}</p>
                    <p className="text-xs text-gray-500">
                      {data.alterSchaetzung ? `${data.alterSchaetzung} Wochen` : 'Alter unbekannt'}
                      {data.geschlecht && `, ${data.geschlecht}`}
                    </p>
                    <p className="text-xs font-mono text-gray-400">{data.igelId}</p>
                  </div>

                  {/* Buttons */}
                  <div className="grid grid-cols-2 gap-3 w-full pt-2 no-print">
                    <button
                      onClick={() => window.print()}
                      className="py-3 bg-gray-900 text-white rounded-xl text-sm font-medium hover:bg-gray-700 transition-all"
                    >
                      Drucken
                    </button>
                    <button
                      onClick={() => setShowQR(false)}
                      className="py-3 border border-gray-200 text-gray-600 rounded-xl text-sm font-medium hover:bg-gray-50 transition-all"
                    >
                      Schließen
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // Design Specification Modal
    const DESIGN_SPEC = `# Design System — Igelpflege Pro

## 16. Muster-Prompt für neue Seiten

- X-Button: w-8 h-8 rounded-full hover:bg-gray-100

    const DesignSpec = ({ onClose }) => {
      const [copied, setCopied] = useState(false);

      const handleCopy = () => {
        navigator.clipboard.writeText(DESIGN_SPEC).then(() => {
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        });
      };

      return (
        <div className="min-h-screen bg-gray-50 pb-20 fade-in">

          {/* Sticky Header — Vollseiten-Muster */}
          <div style={{position:"sticky",top:0,background:"#fff",display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 16px",borderBottom:"2px solid #e7e5e4",zIndex:10}}>
            <button onClick={onClose} style={{width:36,height:36,borderRadius:"50%",background:"#f5f5f4",border:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
            <h2 style={{position:"absolute",left:"50%",transform:"translateX(-50%)",fontSize:15,fontWeight:800,color:"#1c1917",whiteSpace:"nowrap",fontFamily:"'DM Sans',system-ui,sans-serif"}}>App Spezifikation</h2>
            <div style={{width:'64px'}}/>
          </div>

          <div className="p-5 space-y-4">

            {/* Info */}
            <div className="bg-gray-50 rounded-xl p-4">
              <p className="text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">Design System</p>
              <p className="text-xs text-gray-400">Minimalistisch · Schwarz/Weiß · Igelpflege Pro</p>
            </div>

            {/* Copy Button */}
            <button
              onClick={handleCopy}
              className={`w-full py-3 rounded-xl text-sm font-medium transition-all flex items-center justify-center gap-2 ${
                copied
                  ? 'bg-gray-100 text-gray-600'
                  : 'bg-gray-900 text-white hover:bg-gray-700'
              }`}
            >
              {copied ? (
                <>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                    <polyline points="20 6 9 17 4 12"/>
                  </svg>
                  Kopiert!
                </>
              ) : (
                <>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                  </svg>
                  Spezifikation kopieren
                </>
              )}
            </button>

            <div className="border-t border-gray-100"></div>

            {/* Content preview */}
            <div>
              <p className="text-xs font-medium text-gray-500 uppercase tracking-wide mb-3">Inhalt</p>
              <pre className="text-xs text-gray-600 leading-relaxed whitespace-pre-wrap bg-gray-50 rounded-xl p-4 overflow-x-auto">
                {DESIGN_SPEC}
              </pre>
            </div>

          </div>
        </div>
      );
    };

    // Render

    ReactDOM.render(<App />, document.getElementById('root'));
