    };

    // ── Igel-Farbpalette (Pflegeplan Banner) ────────────────────────────────
    const IGEL_COLORS = ['#5c5248','#6b4f38','#4a6352','#5c4a6b','#7a5c34','#4a5568','#5a4a3a','#3d5a4a'];

    // User Profile Component
    const Pflegeplan = ({ userData, hedgehogs, onClose, onSelectHedgehog, settings, onUpdateSetting }) => {
      const [selectedDate, setSelectedDate] = React.useState(new Date().toISOString().split('T')[0]);
      const [filterPfleger, setFilterPfleger] = React.useState('');
      const [saving, setSaving] = React.useState(false);
      const [tapped, setTapped] = React.useState(new Set());
      const [tlOpenMap, setTlOpenMap] = React.useState({});
      const [filterStatus, setFilterStatus] = React.useState(new Set());
      const [filterMed, setFilterMed] = React.useState(new Set());
      const [filterDiag, setFilterDiag] = React.useState(new Set());
      const [showMoreFilters, setShowMoreFilters] = React.useState(false);
      const [filterOpen, setFilterOpen] = React.useState(false);

      // ── Tages-Einstellungen (gespiegelt mit App-Einstellungen) ──
      const dayStartH    = settings.tlDayStartH ?? 6;
      const dayEndH      = settings.tlDayEndH   ?? 22;
      const toleranceMins= settings.tlTolMins   ?? 120;
      const simTime      = settings.tlSimTime   ?? -1;
      const [showDaySettings, setShowDaySettings] = React.useState(false);
      const setDayStartH   = (v) => onUpdateSetting('tlDayStartH', v);
      const setDayEndH     = (v) => onUpdateSetting('tlDayEndH', v);
      const setToleranceMins=(v) => onUpdateSetting('tlTolMins', v);
      const setSimTime     = (v) => onUpdateSetting('tlSimTime', v);

      // ── Live-Uhr ─────────────────────────────────────────────────────────
      const [nowSec, setNowSec] = React.useState(() => {
        const d = new Date();
        return d.getHours()*3600 + d.getMinutes()*60 + d.getSeconds();
      });
      const [nowDisplay, setNowDisplay] = React.useState(() => {
        const d = new Date();
        return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
      });
      React.useEffect(() => {
        const iv = setInterval(() => {
          const d = new Date();
          const s = d.getHours()*3600 + d.getMinutes()*60 + d.getSeconds();
          setNowSec(s);
          setNowDisplay(String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'));
        }, 10000);
        return () => clearInterval(iv);
      }, []);

      const activeSec = simTime >= 0 ? simTime : nowSec;
      const activeDisplay = (() => {
        const s = activeSec;
        return String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor((s%3600)/60)).padStart(2,'0');
      })();

      const todayStr = new Date().toISOString().split('T')[0];
      const isToday  = selectedDate === todayStr;
      const isGuest  = userData?.role === 'gast';

      // ── Alle Tasks ──────────────────────────────────────────────────────
      const allTasks = React.useMemo(() => {
        const tasks = [];
        (hedgehogs || []).forEach(h => {
          (h.treatments || []).forEach((t, ti) => {
            if (t.status !== 'aktiv') return;
            (t.medications || []).forEach((m, mi) => {
              if (m.done) return;
              const selApps = (m.applications||[]).filter(a => a.doneAt && a.doneAt.startsWith(selectedDate));
              const freqPerDay = (() => {
                const f = (m.frequency||'').toLowerCase();
                if (f.includes('2x')) return 2;
                if (f.includes('3x')) return 3;
                if (f.includes('4x')) return 4;
                return 1;
              })();
              const doneToday  = selApps.length >= freqPerDay;
              const lastApp    = (m.applications||[]).slice(-1)[0] || null;
              const overdue    = !doneToday && isToday && lastApp && lastApp.doneAt && lastApp.doneAt.split('T')[0] < todayStr;
              const neverGiven = !doneToday && isToday && !lastApp;
              tasks.push({
                igelId: h.id,
                igelName: h.name || h.fundtiernummer || '?',
                igelNr: h.fundtiernummer || '',
                igelBetreuer: h.betreuer || '',
                treatmentIdx: ti, medIdx: mi,
                treatmentName: t.templateName,
                medName: m.medicationName,
                dose: (m.actualDose || m.dose) + ' ' + m.unit,
                route: m.applicationRoute,
                frequency: m.frequency,
                freqPerDay, todayCount: selApps.length,
                doneToday, overdue, neverGiven, lastApp,
                applications: m.applications || [],
              });
            });
          });
        });
        return tasks;
      }, [hedgehogs, selectedDate]);

      // ── Quittieren ──────────────────────────────────────────────────────
      const recordFromPlan = async (task, circleKey) => {
        if (saving || isGuest) return;
        // Optimistic local tap
        setTapped(prev => new Set([...prev, circleKey]));
        setSaving(true);
        try {
          const h = (hedgehogs||[]).find(x => x.id === task.igelId);
          if (!h) return;
          const treatments = [...(h.treatments||[])];
          const t = { ...treatments[task.treatmentIdx] };
          const meds = t.medications.map((m, i) => {
            if (i !== task.medIdx) return m;
            const app = { doneAt: new Date().toISOString(), doneBy: userData.name, weightAtTime: h.gewichtAktuell||'' };
            const completed = (parseInt(m.completedApplications)||0) + 1;
            const planned   = parseInt(m.plannedApplications)||0;
            return { ...m, completedApplications: completed, applications:[...(m.applications||[]),app], done: planned>0 && completed>=planned };
          });
          t.medications = meds;
          if (meds.every(m=>m.done)) t.status = 'abgeschlossen';
          treatments[task.treatmentIdx] = t;
          await db.collection('hedgehogs').doc(task.igelId).update({
            treatments,
            zuletztBearbeitetVon: userData.name,
            zuletztBearbeitetAm: firebase.firestore.FieldValue.serverTimestamp()
          });
          // Remove from tapped — Firestore onSnapshot will now reflect the new todayCount
          setTapped(prev => { const n = new Set(prev); n.delete(circleKey); return n; });
          window.__pflegeplanRefresh && window.__pflegeplanRefresh();
        } catch(e) { console.error(e); }
        setSaving(false);
      };

      const pendingTasks  = allTasks.filter(t => !t.doneToday);
      const doneTasks     = allTasks.filter(t => t.doneToday);
      const overdueTasks  = pendingTasks.filter(t => t.overdue);
      const totalTasks    = allTasks.length;

      const allPfleger = [...new Set((hedgehogs||[]).map(h=>h.betreuer).filter(Boolean))];

      // ── Filter-Hilfsdaten ───────────────────────────────────────────────
      const availMeds = {};
      allTasks.filter(t => !filterPfleger || t.igelBetreuer === filterPfleger)
        .forEach(t => { availMeds[t.medName] = (availMeds[t.medName]||0) + 1; });

      const availDiags = {};
      (hedgehogs||[]).filter(h => !filterPfleger || h.betreuer === filterPfleger).forEach(h => {
        if (!(h.treatments||[]).some(t2=>t2.status==='aktiv')) return;
        [...(h.diagnosen||[]).map(d=>d.diagnose), ...(h.treatments||[]).map(t2=>t2.diagnosisName)]
          .filter(Boolean).forEach(d => { availDiags[d] = (availDiags[d]||0) + 1; });
      });

      const dueCnt  = pendingTasks.filter(t => (!filterPfleger || t.igelBetreuer === filterPfleger) && !t.overdue).length;
      const overCnt = overdueTasks.filter(t => !filterPfleger || t.igelBetreuer === filterPfleger).length;
      const doneCnt = doneTasks.filter(t => !filterPfleger || t.igelBetreuer === filterPfleger).length;

      const toggleStatus = (key) => setFilterStatus(prev => { const n=new Set(prev); n.has(key)?n.delete(key):n.add(key); return n; });
      const toggleMed    = (med)  => setFilterMed   (prev => { const n=new Set(prev); n.has(med) ?n.delete(med) :n.add(med);  return n; });
      const toggleDiag   = (diag) => setFilterDiag  (prev => { const n=new Set(prev); n.has(diag)?n.delete(diag):n.add(diag); return n; });
      const clearAllFilters = () => { setFilterStatus(new Set()); setFilterMed(new Set()); setFilterDiag(new Set()); };

      const applyAllFilters = (tasks) => {
        let r = filterPfleger ? tasks.filter(t => t.igelBetreuer === filterPfleger) : [...tasks];
        if (filterMed.size > 0)  r = r.filter(t => filterMed.has(t.medName));
        if (filterDiag.size > 0) r = r.filter(t => {
          const h = (hedgehogs||[]).find(x=>x.id===t.igelId);
          if (!h) return false;
          const hd = [...(h.diagnosen||[]).map(d=>d.diagnose), ...(h.treatments||[]).map(t2=>t2.diagnosisName)].filter(Boolean);
          return hd.some(d => filterDiag.has(d));
        });
        return r;
      };

      const hasStatusFilter = filterStatus.size > 0;
      const showDueSec  = !hasStatusFilter || filterStatus.has('due');
      const showOverSec = !hasStatusFilter || filterStatus.has('over');
      const showDoneSec = !hasStatusFilter || filterStatus.has('done');

      const basePending = applyAllFilters(pendingTasks);
      const baseDone    = applyAllFilters(doneTasks);
      const visiblePending = basePending.filter(t => (showOverSec && t.overdue) || (showDueSec && !t.overdue));
      const visibleDone    = showDoneSec ? baseDone : [];

      const anyFilter = filterStatus.size > 0 || filterMed.size > 0 || filterDiag.size > 0 || !!filterPfleger;

      const applyFilter = (list) => filterPfleger ? list.filter(t => t.igelBetreuer === filterPfleger) : list;

      // Group by Igel
      const groupByIgel = (list) => {
        const map = {};
        list.forEach(t => {
          if (!map[t.igelId]) {
            const hog = (hedgehogs||[]).find(x => x.id === t.igelId);
            const colorIdx = Object.keys(map).length % IGEL_COLORS.length;
            const fromDiagnosen = (hog && hog.diagnosen || []).map(d => d.diagnose).filter(Boolean);
            const fromTreatments = (hog && hog.treatments || []).map(t2 => t2.diagnosisName).filter(Boolean);
            const allDiag = [...new Set([...fromDiagnosen, ...fromTreatments])];
            map[t.igelId] = {
              igelName: t.igelName, igelNr: t.igelNr,
              igelId: t.igelId, igelBetreuer: t.igelBetreuer, tasks: [],
              igelColor: IGEL_COLORS[colorIdx],
              igelDiagnosen: allDiag
            };
          }
          map[t.igelId].tasks.push(t);
        });
        return Object.values(map);
      };

      const pendingGroups = groupByIgel(visiblePending);
      const doneGroups    = groupByIgel(visibleDone);

      // ── Status-Kreis je Igel-Gruppe ──────────────────────────────────────
      const StatusCircle = ({ group }) => {
        const hasOverdue = group.tasks.some(t => t.overdue);
        const totalCircles = group.tasks.reduce((s, t) => s + t.freqPerDay, 0);
        const tappedInGroup = group.tasks.reduce((s, t) => {
          for (let ci = 0; ci < t.freqPerDay; ci++) {
            const key = t.igelId + '-' + t.treatmentIdx + '-' + t.medIdx + '-' + ci;
            if (tapped.has(key) || ci < t.todayCount) s++;
          }
          return s;
        }, 0);
        const allDone = tappedInGroup >= totalCircles;
        if (allDone) return (
          <div style={{width:30,height:30,borderRadius:'50%',background:'#16a34a',border:'2px solid #16a34a',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,transition:'all .3s'}}>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3.5"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
        );
        if (hasOverdue) return (
          <div style={{width:30,height:30,borderRadius:'50%',border:'2px solid #dc2626',background:'#fef2f2',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,animation:'qv-pulse-red 1.8s ease-in-out infinite'}}>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#dc2626" strokeWidth="3" strokeLinecap="round"><line x1="12" y1="7" x2="12" y2="13"/><circle cx="12" cy="17" r="1.2" fill="#dc2626" stroke="none"/></svg>
          </div>
        );
        return (
          <div style={{width:30,height:30,borderRadius:'50%',border:'2px solid #d97706',background:'#fffbeb',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,animation:'qv-pulse-amber 2.5s ease-in-out infinite'}}>
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#d97706" strokeWidth="2.5"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
        );
      };

      // ── Undo last application ────────────────────────────────────────────
      const undoFromPlan = async (task, circleKey) => {
        if (saving || isGuest) return;
        setSaving(true);
        try {
          const h = (hedgehogs||[]).find(x => x.id === task.igelId);
          if (!h) return;
          const treatments = JSON.parse(JSON.stringify(h.treatments || []));
          const t = { ...treatments[task.treatmentIdx] };
          const meds = t.medications.map((m, i) => {
            if (i !== task.medIdx) return m;
            const apps = [...(m.applications || [])];
            const lastTodayIdx = apps.map((a,ai) => ({a,ai})).reverse()
              .find(({a}) => a.doneAt && a.doneAt.startsWith(todayStr))?.ai;
            if (lastTodayIdx !== undefined) apps.splice(lastTodayIdx, 1);
            return { ...m, applications: apps, completedApplications: Math.max(0,(parseInt(m.completedApplications)||1)-1), done: false };
          });
          t.medications = meds;
          treatments[task.treatmentIdx] = t;
          await db.collection('hedgehogs').doc(task.igelId).update({
            treatments,
            zuletztBearbeitetVon: userData.name,
            zuletztBearbeitetAm: firebase.firestore.FieldValue.serverTimestamp()
          });
          setTapped(prev => { const n = new Set(prev); n.delete(circleKey); return n; });
          window.__pflegeplanRefresh && window.__pflegeplanRefresh();
        } catch(e) { console.error(e); }
        setSaving(false);
      };

      // ── Timeline helpers ─────────────────────────────────────────────────
      const tlHHMM = (s) => String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor((s%3600)/60)).padStart(2,'0');
      const tlDoseTime = (di, total, start, len) => start + (len/total)*di + (len/total)*0.5;

      // 6-state slot logic with tolerance window
      const tlSlotState = (task, di, cur, dayStart, dayLen) => {
        const t = tlDoseTime(di, task.freqPerDay, dayStart, dayLen);
        const tolSec = toleranceMins * 60;
        const winStart = t - tolSec;
        const winEnd   = t + tolSec;
        const inWindow = cur >= winStart && cur <= winEnd;
        const pastWindow = cur > winEnd;

        // Check if this slot was given today
        const todayApps = (task.applications||[]).filter(a => a.doneAt && a.doneAt.startsWith(todayStr));
        // Map apps to slots by time proximity
        const slotGiven = (() => {
          // Count how many apps fall within this slot's window
          const appsInWindow = todayApps.filter(a => {
            const appSec = (() => { const d=new Date(a.doneAt); return d.getHours()*3600+d.getMinutes()*60+d.getSeconds(); })();
            return appSec >= winStart && appSec <= winEnd;
          });
          return appsInWindow.length > 0;
        })();

        // Also check tapped (optimistic)
        const circleKey = task.igelId+'-'+task.treatmentIdx+'-'+task.medIdx+'-'+di;
        const tappedThis = tapped.has(circleKey);
        const given = slotGiven || tappedThis;

        if (given) return inWindow ? 'done-open' : 'done-locked';
        if (cur < winStart) return 'pending';
        if (inWindow) return 'due';
        return 'overdue-locked'; // pastWindow + not given
      };

      const TL_SEG  = {'done-open':'#f0fdf4','done-locked':'#f0fdf4','due':'#fefce8','overdue-locked':'#fff1f2','overdue-open':'#fff1f2','pending':'#fafaf8'};
      const TL_ICOL = {'done-open':'#166634','done-locked':'#166634','due':'#ca8a04','overdue-locked':'#e11d48','overdue-open':'#e11d48','pending':'#d6d3d1'};
      const TL_ICON = {'done-open':'✓','done-locked':'✓','due':'◎','overdue-locked':'●','overdue-open':'●','pending':'○'};
      const TL_ANIM = {'due':'qv-pulse-amber 2.2s ease-in-out infinite','overdue-open':'qv-pulse-red 1.8s ease-in-out infinite'};
      const TL_LOCKED = {'done-locked':true,'overdue-locked':true};
      const TL_CAN   = {'done-open':true,'due':true};
      const QV_BG  = {'done-open':'#dcfce7','done-locked':'#dcfce7','due':'#fefce8','overdue-locked':'#fff1f2','pending':'#fafaf8'};
      const QV_BD  = {'done-open':'#86efac','done-locked':'#86efac','due':'#fde68a','overdue-locked':'#fecdd3','pending':'#e7e5e4'};
      const QV_COL = {'done-open':'#166634','done-locked':'#166634','due':'#ca8a04','overdue-locked':'#e11d48','pending':'#d6d3d1'};
      const QV_ICN = {'done-open':'✓','done-locked':'✓','due':'◎','overdue-locked':'●','pending':'○'};
      const QV_ANM = {'due':'qv-pulse-amber 2.2s ease-in-out infinite','overdue-locked':'qv-pulse-red 1.8s ease-in-out infinite'};

      return (
        <div className="min-h-screen pb-20" style={{background:'#fafaf8'}}>
          <style>{`@keyframes qv-pulse-red{0%,100%{opacity:1}50%{opacity:.5}}@keyframes qv-pulse-amber{0%,100%{opacity:1}50%{opacity:.55}}`}</style>

          {/* Sticky Header + Filter-Block */}
          <div style={{position:'sticky',top:0,zIndex:10}}>

            {/* Header-Zeile */}
            <div style={{background:'#fff',display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 16px',position:'relative',borderBottom:'2px solid #e7e5e4'}}>
              <button onClick={onClose} style={{width:36,height:36,borderRadius:'50%',background:'#f5f5f4',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1c1917" strokeWidth="2.5" strokeLinecap="round"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
              <span style={{position:'absolute',left:'50%',transform:'translateX(-50%)',fontSize:15,fontWeight:800,color:'#1c1917',fontFamily:"'DM Sans',system-ui,sans-serif",whiteSpace:'nowrap'}}>Pflegeplan</span>
              <div style={{display:'flex',alignItems:'center',gap:5}}>
                <button onClick={() => setShowDaySettings(s => !s)}
                  style={{display:'flex',alignItems:'center',gap:5,background:showDaySettings?'#1c1917':'#f5f5f4',border:'none',borderRadius:10,padding:'6px 10px',cursor:'pointer',transition:'all .15s'}}>
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke={showDaySettings?'#fafaf8':'#78716c'} strokeWidth="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                  <span style={{fontSize:11,fontWeight:800,fontFamily:'monospace',color:showDaySettings?'#fafaf8':'#1c1917'}}>{activeDisplay}</span>
                </button>
                <button onClick={() => window.igelMenuToggle && window.igelMenuToggle()}
                  style={{width:32,height:32,borderRadius:'50%',background:'#f5f5f4',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                  <svg width="16" height="16" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5" fill="#1c1917"/><circle cx="12" cy="12" r="1.5" fill="#1c1917"/><circle cx="19" cy="12" r="1.5" fill="#1c1917"/></svg>
                </button>
              </div>
            </div>

            {/* Test-Panel: Tageseinstellungen */}
            {showDaySettings && (
              <div style={{margin:'0 12px 0',background:'#fef9c3',border:'1.5px dashed #fde68a',borderRadius:10,padding:'10px 12px'}}>
                <div style={{fontSize:9,fontWeight:800,color:'#92400e',textTransform:'uppercase',letterSpacing:'.1em',marginBottom:8}}>
                  Test: Einstellungen — später in App-Einstellungen
                </div>
                <div style={{display:'flex',gap:10}}>
                  <div style={{flex:1}}>
                    <div style={{fontSize:9,color:'#92400e',fontWeight:700,marginBottom:3}}>Tagesbeginn</div>
                    <div style={{display:'flex',alignItems:'center',gap:5}}>
                      <input type="range" min="0" max="12" value={dayStartH} onChange={e=>setDayStartH(parseInt(e.target.value))} style={{flex:1,accentColor:'#d97706'}}/>
                      <span style={{fontSize:10,fontWeight:800,fontFamily:'monospace',color:'#92400e',width:34,textAlign:'right'}}>{String(dayStartH).padStart(2,'0')}:00</span>
                    </div>
                  </div>
                  <div style={{flex:1}}>
                    <div style={{fontSize:9,color:'#92400e',fontWeight:700,marginBottom:3}}>Tagesende</div>
                    <div style={{display:'flex',alignItems:'center',gap:5}}>
                      <input type="range" min="12" max="24" value={dayEndH} onChange={e=>setDayEndH(parseInt(e.target.value))} style={{flex:1,accentColor:'#d97706'}}/>
                      <span style={{fontSize:10,fontWeight:800,fontFamily:'monospace',color:'#92400e',width:34,textAlign:'right'}}>{String(dayEndH).padStart(2,'0')}:00</span>
                    </div>
                  </div>
                </div>
                <div style={{marginTop:8}}>
                  <div style={{fontSize:9,color:'#92400e',fontWeight:700,marginBottom:3}}>Toleranz (±)</div>
                  <div style={{display:'flex',alignItems:'center',gap:8}}>
                    <input type="range" min="15" max="720" value={toleranceMins} step="15"
                      onChange={e=>setToleranceMins(parseInt(e.target.value))} style={{flex:1,accentColor:'#1c1917'}}/>

                    </span>
                  </div>
                </div>
                <div style={{marginTop:8}}>
                  <div style={{fontSize:9,color:'#92400e',fontWeight:700,marginBottom:3}}>Uhrzeit simulieren</div>
                  <div style={{display:'flex',alignItems:'center',gap:8}}>
                    <input type="range" min={dayStartH*3600} max={dayEndH*3600} value={simTime>=0?simTime:activeSec}
