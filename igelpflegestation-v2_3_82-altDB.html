                    <span style={{fontSize:11,fontWeight:800,fontFamily:'monospace',color:'#1c1917',width:36,textAlign:'right'}}>{activeDisplay}</span>
                    {simTime>=0 && (
                      <button onClick={()=>setSimTime(-1)} style={{fontSize:9,fontWeight:700,color:'#92400e',background:'#fff',border:'1px solid #fde68a',borderRadius:5,padding:'2px 6px',cursor:'pointer',fontFamily:'inherit',whiteSpace:'nowrap'}}>live</button>
                    )}
                  </div>
                </div>
                <div style={{fontSize:9,color:'#a8a29e',marginTop:5,textAlign:'center'}}>
                  {String(dayStartH).padStart(2,'0')}:00 – {String(dayEndH).padStart(2,'0')}:00 · {dayEndH-dayStartH}h · {simTime>=0?'Sim':'Live'}: {activeDisplay}
                </div>
              </div>
            )}

            {/* Filter-Block — aufklappbar */}
            {(() => {
              const hasActiveFilter = filterStatus.size > 0 || filterMed.size > 0 || filterDiag.size > 0 || !!filterPfleger;
              const iconBg = filterStatus.has('over') ? '#fee2e2' : filterStatus.has('due') ? '#fef3c7' : filterStatus.has('done') ? '#dcfce7' : (filterMed.size > 0 || filterDiag.size > 0 || filterPfleger) ? '#eff6ff' : '#f5f5f4';
              const iconStroke = filterStatus.has('over') ? '#dc2626' : filterStatus.has('due') ? '#d97706' : filterStatus.has('done') ? '#166634' : (filterMed.size > 0 || filterDiag.size > 0 || filterPfleger) ? '#1d4ed8' : '#78716c';
              return (
                <div style={{background:'#fff',borderBottom:'2px solid #e7e5e4',boxShadow:'0 3px 14px rgba(28,25,23,.07)'}}>

                  {/* Toggle-Zeile */}
                  <div onClick={() => setFilterOpen(v=>!v)}
                    style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'9px 12px',cursor:'pointer',userSelect:'none'}}>
                    <div style={{display:'flex',alignItems:'center',gap:8,minWidth:0,flex:1}}>
                      {/* Icon */}
                      <div style={{width:28,height:28,borderRadius:8,background:iconBg,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,transition:'background .15s'}}>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={iconStroke} strokeWidth="2.5"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
                      </div>
                      {/* Summary oder Label */}
                      {hasActiveFilter ? (
                        <div style={{display:'flex',alignItems:'center',gap:5,flexWrap:'wrap',flex:1,minWidth:0}}>
                          {filterPfleger && (
                            <span style={{display:'inline-flex',alignItems:'center',gap:3,padding:'3px 8px',borderRadius:999,fontSize:9,fontWeight:700,background:'#f5f5f4',color:'#44403c',border:'1px solid #e7e5e4',whiteSpace:'nowrap'}}>
                              <svg width="7" height="7" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                              {filterPfleger}
                            </span>
                          )}
                          {filterStatus.has('due') && (
                            <span style={{display:'inline-flex',alignItems:'center',gap:3,padding:'3px 8px',borderRadius:999,fontSize:9,fontWeight:700,background:'#fef3c7',color:'#92400e',border:'1px solid #fde68a',whiteSpace:'nowrap'}}>
                              <svg width="7" height="7" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                              Fällig
                            </span>
                          )}
                          {filterStatus.has('over') && (
                            <span style={{display:'inline-flex',alignItems:'center',gap:3,padding:'3px 8px',borderRadius:999,fontSize:9,fontWeight:700,background:'#fee2e2',color:'#dc2626',border:'1px solid #fca5a5',whiteSpace:'nowrap'}}>
                              <svg width="7" height="7" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>
                              Überfällig
                            </span>
                          )}
                          {filterStatus.has('done') && (
                            <span style={{display:'inline-flex',alignItems:'center',gap:3,padding:'3px 8px',borderRadius:999,fontSize:9,fontWeight:700,background:'#dcfce7',color:'#166634',border:'1px solid #86efac',whiteSpace:'nowrap'}}>
                              <svg width="7" height="7" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="20 6 9 17 4 12"/></svg>
                              Erledigt
                            </span>
                          )}
                          {[...filterMed].map(m => (
                            <span key={m} style={{display:'inline-flex',alignItems:'center',padding:'3px 8px',borderRadius:999,fontSize:9,fontWeight:700,background:'#eff6ff',color:'#1d4ed8',border:'1px solid #93c5fd',whiteSpace:'nowrap'}}>{m}</span>
                          ))}
                          {[...filterDiag].map(d => (
                            <span key={d} style={{display:'inline-flex',alignItems:'center',gap:3,padding:'3px 8px',borderRadius:999,fontSize:9,fontWeight:700,background:'#f5f3ff',color:'#7c3aed',border:'1px solid #c4b5fd',whiteSpace:'nowrap'}}>
                              <svg width="7" height="7" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="12" cy="12" r="10"/></svg>
                              {d}
                            </span>
                          ))}
                        </div>
                      ) : (
                        <span style={{fontSize:12,fontWeight:700,color:'#a8a29e'}}>Filter</span>
                      )}
                    </div>
                    <div style={{display:'flex',alignItems:'center',gap:6,flexShrink:0,marginLeft:6}}>
                      {/* Reset-Button — immer sichtbar wenn Filter aktiv */}
                      {hasActiveFilter && (
                        <button onClick={e => { e.stopPropagation(); clearAllFilters(); }}
                          style={{fontSize:9,fontWeight:700,color:'#e11d48',background:'none',border:'none',cursor:'pointer',fontFamily:'inherit',padding:'2px 4px',whiteSpace:'nowrap'}}>
                          Zurücksetzen
                        </button>
                      )}
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a8a29e" strokeWidth="2.5"
                        style={{transition:'transform .22s',transform:filterOpen?'none':'rotate(180deg)'}}>
                        <polyline points="6 9 12 15 18 9"/>
                      </svg>
                    </div>
                  </div>

                  {/* Aufklappbares Panel */}
                  {filterOpen && (
                    <div style={{borderTop:'1px solid #f0eeec',padding:'0 12px 11px',display:'flex',flexDirection:'column',gap:8}}>

                      {/* Datum + Pfleger */}
                      <div style={{display:'flex',gap:7,paddingTop:10}}>
                        <input type="date" value={selectedDate} onChange={e => { setSelectedDate(e.target.value); setTapped(new Set()); setFilterStatus(new Set()); }}
                          style={{flex:1,border:'1.5px solid #e7e5e4',borderRadius:10,padding:'7px 10px',fontSize:12,outline:'none',background:'#fafaf8',color:'#1c1917',fontFamily:'inherit'}} />
                        {allPfleger.length > 0 && (
                          <select value={filterPfleger} onChange={e => setFilterPfleger(e.target.value)}
                            style={{border:'1.5px solid #e7e5e4',borderRadius:10,padding:'7px 10px',fontSize:12,outline:'none',background:'#fafaf8',color:'#1c1917',fontFamily:'inherit'}}>
                            <option value="">Alle Pfleger</option>
                            {allPfleger.map(p => <option key={p} value={p}>{p}</option>)}
                          </select>
                        )}
                      </div>

                      <div style={{height:1,background:'#f0eeec'}}/>

                      {/* Status-Chips */}
                      {(dueCnt > 0 || overCnt > 0 || doneCnt > 0) && (
                        <div>
                          <div style={{fontSize:8,fontWeight:800,color:'#a8a29e',textTransform:'uppercase',letterSpacing:'.1em',marginBottom:4}}>Status heute</div>
                          <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
                            {dueCnt > 0 && (
                              <div onClick={() => toggleStatus('due')}
                                style={{display:'inline-flex',alignItems:'center',gap:4,padding:'5px 9px',borderRadius:999,fontSize:10,fontWeight:700,cursor:'pointer',border:'1.5px solid #fde68a',userSelect:'none',transition:'all .15s',
                                  background:filterStatus.has('due')?'#fef3c7':'#fef9ec',opacity:filterStatus.has('due')?1:0.55}}>
                                <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                                <span style={{color:'#92400e'}}>Fällig</span>
                                <span style={{fontSize:9,fontWeight:800,opacity:.7,fontFamily:'monospace',color:'#92400e'}}>({dueCnt})</span>
                              </div>
                            )}
                            {overCnt > 0 && (
                              <div onClick={() => toggleStatus('over')}
                                style={{display:'inline-flex',alignItems:'center',gap:4,padding:'5px 9px',borderRadius:999,fontSize:10,fontWeight:700,cursor:'pointer',border:'1.5px solid #fca5a5',userSelect:'none',transition:'all .15s',
                                  background:filterStatus.has('over')?'#fee2e2':'#fef2f2',
                                  boxShadow:filterStatus.has('over')?'0 0 0 3px rgba(220,38,38,.1)':'none',
                                  opacity:filterStatus.has('over')?1:0.55}}>
                                <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#dc2626" strokeWidth="2.5"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                                <span style={{color:'#dc2626'}}>Überfällig</span>
                                <span style={{fontSize:9,fontWeight:800,opacity:.7,fontFamily:'monospace',color:'#dc2626'}}>({overCnt})</span>
                              </div>
                            )}
                            {doneCnt > 0 && (
                              <div onClick={() => toggleStatus('done')}
                                style={{display:'inline-flex',alignItems:'center',gap:4,padding:'5px 9px',borderRadius:999,fontSize:10,fontWeight:700,cursor:'pointer',border:'1.5px solid '+(filterStatus.has('done')?'#86efac':'#bbf7d0'),userSelect:'none',transition:'all .15s',
                                  background:filterStatus.has('done')?'#dcfce7':'#f0fdf4',opacity:filterStatus.has('done')?1:0.55}}>
                                <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#166634" strokeWidth="2"><polyline points="20 6 9 17 4 12"/></svg>
                                <span style={{color:'#166634'}}>Erledigt</span>
                                <span style={{fontSize:9,fontWeight:800,opacity:.7,fontFamily:'monospace',color:'#166634'}}>({doneCnt})</span>
                              </div>
                            )}
                          </div>
                        </div>
                      )}

                      {/* Medikament + Diagnose */}
                      {(Object.keys(availMeds).length > 0 || Object.keys(availDiags).length > 0) && (
                        <div>
                          <div onClick={() => setShowMoreFilters(v=>!v)}
                            style={{display:'flex',alignItems:'center',justifyContent:'space-between',cursor:'pointer',userSelect:'none'}}>
                            <span style={{fontSize:8,fontWeight:800,color:'#a8a29e',textTransform:'uppercase',letterSpacing:'.1em'}}>Weitere Filter</span>
                            <span style={{display:'flex',alignItems:'center',gap:3,fontSize:9,fontWeight:700,color:'#78716c'}}>
                              {(filterMed.size + filterDiag.size) > 0 && (
                                <span style={{background:'#1c1917',color:'#fff',borderRadius:999,padding:'1px 6px',fontSize:8,fontWeight:800}}>{filterMed.size + filterDiag.size}</span>
                              )}
                              Medikament · Diagnose
                              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"
                                style={{transition:'transform .2s',transform:showMoreFilters?'rotate(180deg)':'none'}}>
                                <polyline points="6 9 12 15 18 9"/>
                              </svg>
                            </span>
                          </div>
                          {showMoreFilters && (
                            <div style={{marginTop:8,display:'flex',flexDirection:'column',gap:7}}>
                              {Object.keys(availMeds).length > 0 && (
                                <div>
                                  <div style={{fontSize:8,fontWeight:800,color:'#a8a29e',textTransform:'uppercase',letterSpacing:'.1em',marginBottom:4}}>Medikament</div>
                                  <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
                                    {Object.entries(availMeds).map(([med, cnt]) => (
                                      <div key={med} onClick={() => toggleMed(med)}
                                        style={{display:'inline-flex',alignItems:'center',gap:4,padding:'5px 9px',borderRadius:999,fontSize:10,fontWeight:700,cursor:'pointer',userSelect:'none',transition:'all .15s',
                                          border:'1.5px solid '+(filterMed.has(med)?'#93c5fd':'#c7d7fe'),
                                          background:filterMed.has(med)?'#eff6ff':'#f0f4ff',
                                          opacity:filterMed.has(med)?1:0.55}}>
                                        <span style={{color:filterMed.has(med)?'#1d4ed8':'#3730a3'}}>{med}</span>
                                        <span style={{fontSize:9,fontWeight:800,opacity:.7,fontFamily:'monospace',color:filterMed.has(med)?'#1d4ed8':'#3730a3'}}>({cnt})</span>
                                      </div>
                                    ))}
                                  </div>
                                </div>
                              )}
                              {Object.keys(availDiags).length > 0 && (
                                <div>
                                  <div style={{fontSize:8,fontWeight:800,color:'#a8a29e',textTransform:'uppercase',letterSpacing:'.1em',marginBottom:4}}>Diagnose</div>
                                  <div style={{display:'flex',gap:5,flexWrap:'wrap'}}>
                                    {Object.entries(availDiags).map(([diag, cnt]) => (
                                      <div key={diag} onClick={() => toggleDiag(diag)}
                                        style={{display:'inline-flex',alignItems:'center',gap:4,padding:'5px 9px',borderRadius:999,fontSize:10,fontWeight:700,cursor:'pointer',userSelect:'none',transition:'all .15s',
                                          border:'1.5px solid '+(filterDiag.has(diag)?'#c4b5fd':'#e9d5ff'),
                                          background:filterDiag.has(diag)?'#f5f3ff':'#faf5ff',
                                          opacity:filterDiag.has(diag)?1:0.55}}>
                                        <svg width="7" height="7" viewBox="0 0 24 24" fill="none" stroke={filterDiag.has(diag)?'#7c3aed':'#6d28d9'} strokeWidth="2.5"><circle cx="12" cy="12" r="10"/></svg>
                                        <span style={{color:filterDiag.has(diag)?'#7c3aed':'#6d28d9'}}>{diag}</span>
                                        <span style={{fontSize:9,fontWeight:800,opacity:.7,fontFamily:'monospace',color:filterDiag.has(diag)?'#7c3aed':'#6d28d9'}}>({cnt})</span>
                                      </div>
                                    ))}
                                  </div>
                                </div>
                              )}
                            </div>
                          )}
                        </div>
                      )}

                    </div>
                  )}
                </div>
              );
            })()}
          </div>

          <div style={{padding:'14px 12px',display:'flex',flexDirection:'column',gap:12}}>

            {/* Stats-Strip (kein Fortschrittsbalken) */}
            {totalTasks > 0 && !anyFilter && (
              <div style={{background:'#fff',borderRadius:12,border:'1px solid #e7e5e4',padding:'9px 13px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                <span style={{fontSize:9,fontWeight:700,color:'#a8a29e',textTransform:'uppercase',letterSpacing:'.1em'}}>{isToday ? 'Heute' : selectedDate}</span>
                <span style={{fontSize:13,fontWeight:800,color:'#1c1917'}}>{doneTasks.length} / {totalTasks} erledigt</span>
              </div>
            )}
            {anyFilter && (pendingGroups.length > 0 || doneGroups.length > 0) && (() => {
              const label = [...filterStatus].map(k=>({due:'Fällig',over:'Überfällig',done:'Erledigt'}[k])).join(' + ') || (isToday ? 'Heute' : selectedDate);
              const cnt = pendingGroups.length + doneGroups.length;
              const col = filterStatus.has('over') ? '#dc2626' : filterStatus.has('due') ? '#d97706' : filterStatus.has('done') ? '#166634' : '#1c1917';
              return (
                <div style={{background:'#fff',borderRadius:12,border:'1px solid #e7e5e4',padding:'9px 13px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                  <span style={{fontSize:9,fontWeight:700,color:'#a8a29e',textTransform:'uppercase',letterSpacing:'.1em'}}>{label}</span>
                  <span style={{fontSize:13,fontWeight:800,color:col}}>{cnt} {cnt===1?'Igel':'Igel'}</span>
                </div>
              );
            })()}

            {/* Leer — keine Behandlungen */}
            {totalTasks === 0 && (
              <div style={{background:'#fff',borderRadius:14,border:'1px solid #e7e5e4',padding:'40px 20px',textAlign:'center'}}>
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#d6d3d1" strokeWidth="1.5" style={{margin:'0 auto 12px',display:'block'}}><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><polyline points="8 14 11 17 16 12"/></svg>
                <p style={{fontSize:13,color:'#a8a29e'}}>Keine aktiven Behandlungen</p>
              </div>
            )}

            {/* Leer — Filter kein Ergebnis */}
            {totalTasks > 0 && anyFilter && pendingGroups.length === 0 && doneGroups.length === 0 && (
              <div style={{background:'#fff',borderRadius:14,border:'1px solid #e7e5e4',padding:'36px 20px',textAlign:'center'}}>
                <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#d6d3d1" strokeWidth="1.5" style={{margin:'0 auto 10px',display:'block'}}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                <p style={{fontSize:12,color:'#a8a29e',fontWeight:600,marginBottom:4}}>Kein Ergebnis für diesen Filter</p>
                <button onClick={clearAllFilters}
                  style={{marginTop:10,padding:'7px 16px',borderRadius:99,border:'1.5px solid #e7e5e4',background:'#fff',fontSize:11,fontWeight:700,color:'#44403c',cursor:'pointer',fontFamily:'inherit'}}>
                  Filter zurücksetzen
                </button>
              </div>
            )}

            {/* Ausstehend */}
            {pendingGroups.length > 0 && (
              <div>
                <p style={{fontSize:10,fontWeight:700,color:'#a8a29e',textTransform:'uppercase',letterSpacing:'.1em',marginBottom:8,paddingLeft:2}}>
                  {filterStatus.has('over') && !filterStatus.has('due') ? 'Überfällig' : filterStatus.has('due') && !filterStatus.has('over') ? 'Fällig' : 'Ausstehend'} · {visiblePending.length}
                </p>
                <div style={{display:'flex',flexDirection:'column',gap:12}}>
                  {pendingGroups.map((group, gi) => (
                    <div key={gi} style={{borderRadius:14,overflow:'hidden',border:'1px solid #e7e5e4',boxShadow:'0 2px 8px rgba(28,25,23,.07)'}}>

                      {/* ── Banner: Name + Pfleger ── */}
                      <div style={{padding:'9px 12px',background:group.igelColor,display:'flex',alignItems:'center',justifyContent:'space-between',gap:10,cursor:'pointer'}}
                        onClick={() => { const h=(hedgehogs||[]).find(x=>x.id===group.igelId); if(h&&onSelectHedgehog) onSelectHedgehog(h); }}>
                        <span style={{fontSize:13,fontWeight:800,color:'#fff',lineHeight:1}}>{group.igelName}</span>
                        {group.igelBetreuer ? (
                          <span style={{display:'inline-flex',alignItems:'center',gap:4,background:'rgba(255,255,255,.18)',border:'1px solid rgba(255,255,255,.25)',padding:'2px 7px',borderRadius:999,fontSize:9,fontWeight:700,color:'rgba(255,255,255,.9)',whiteSpace:'nowrap',flexShrink:0}}>
                            <svg width="7" height="7" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            {group.igelBetreuer}
                          </span>
                        ) : (
                          <span style={{display:'inline-flex',alignItems:'center',gap:4,background:'rgba(255,255,255,.08)',border:'1px solid rgba(255,255,255,.12)',padding:'2px 7px',borderRadius:999,fontSize:9,fontWeight:600,color:'rgba(255,255,255,.4)',whiteSpace:'nowrap',flexShrink:0}}>
                            <svg width="7" height="7" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            nicht zugew.
                          </span>
                        )}
                      </div>

                      {/* ── Behandlungen + Status + Diagnosen ── */}
                      <div style={{padding:'7px 12px 8px',background:'#fafaf8',borderBottom:'1px solid #e7e5e4'}}>
                        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,marginBottom:(group.igelDiagnosen||[]).length>0?6:0}}>
                          <span style={{background:'#f0efee',color:'#57534e',fontSize:9,fontWeight:700,padding:'2px 7px',borderRadius:999,whiteSpace:'nowrap'}}>
                            {group.tasks.length} {group.tasks.length===1?'Behandlung':'Behandlungen'}
                          </span>
                          <StatusCircle group={group} />
                        </div>
                        {(group.igelDiagnosen||[]).length > 0 && (
                          <div style={{display:'flex',alignItems:'center',gap:5,flexWrap:'wrap'}}>
                            {(group.igelDiagnosen||[]).slice(0,3).map((d,di) => (
                              <span key={di} style={{display:'inline-flex',alignItems:'center',gap:4,background:'#f0efee',padding:'2px 7px',borderRadius:999,fontSize:9,fontWeight:600,color:'#57534e',lineHeight:1.2}}>
                                <svg width="7" height="7" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="12" cy="12" r="10"/></svg>
                                {d}
                              </span>
                            ))}
                          </div>
                        )}
                      </div>

                      {/* Medikament-Zeilen — QV-Style */}
                      <div>
                        {group.tasks.map((t, ti) => {
                          const dayStart = dayStartH * 3600;
                          const dayLen = (dayEndH - dayStartH) * 3600;
                          const dots = Array.from({length:t.freqPerDay}).map((_,ci) => {
                            const doseT = tlDoseTime(ci,t.freqPerDay,dayStart,dayLen);
                            const pct   = Math.min(96,Math.max(4,(doseT-dayStart)/dayLen*100));
                            const st    = tlSlotState(t,ci,activeSec,dayStart,dayLen);
                            const key   = t.igelId+'-'+t.treatmentIdx+'-'+t.medIdx+'-'+ci;
                            return {ci,doseT,pct,st,key};
                          });
                          const bounds = [0,...dots.map(d=>d.pct),100];
                          const nowPct = Math.min(100,Math.max(0,(activeSec-dayStart)/dayLen*100));
                          const allDoneToday = dots.every(d=>d.st.startsWith('done'));
                          const tlOpenKey = t.igelId+'-'+t.treatmentIdx+'-'+t.medIdx;
                          const tlOpen = !!tlOpenMap[tlOpenKey];
                          const setTlOpen = (v) => setTlOpenMap(prev => ({...prev, [tlOpenKey]: typeof v === 'function' ? v(prev[tlOpenKey]) : v}));
                          const hasDue = dots.some(d=>d.st==='due');
                          const hasOverdue = dots.some(d=>d.st==='overdue-locked');
                          const todayAppsT = (t.applications||[]).filter(a=>a.doneAt&&a.doneAt.startsWith(todayStr));
                          const lastTodayAppT = todayAppsT.slice(-1)[0];
                          const lastTodayTimeT = lastTodayAppT ? new Date(lastTodayAppT.doneAt).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}) : null;
                          const prevAllDone = ti > 0 ? Array.from({length:group.tasks[ti-1].freqPerDay}).every((_,i) => tlSlotState(group.tasks[ti-1],i,activeSec,dayStart,dayLen).startsWith('done')) : false;
                          return (
                            <React.Fragment key={ti}>
                              {ti > 0 && allDoneToday && !prevAllDone && (
                                <div style={{height:1,background:'#e0ddd9'}}/>
                              )}
                              {allDoneToday ? (
                                <React.Fragment>
                                  <div style={{padding:'8px 12px',borderTop:ti===0?'none':'1px solid #f5f5f4',background:'#f7f6f5',display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,opacity:.75}}>
                                    <span style={{fontSize:11,fontWeight:700,color:'#a8a29e',textDecoration:'line-through'}}>{t.medName}</span>
                                    {lastTodayTimeT && (
                                      <span style={{display:'inline-flex',alignItems:'center',gap:4,background:'#f0fdf4',color:'#166634',border:'1px solid #bbf7d0',fontSize:9,fontWeight:700,padding:'2px 7px',borderRadius:999,flexShrink:0,whiteSpace:'nowrap'}}>
                                        <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="20 6 9 17 4 12"/></svg>
                                        {lastTodayTimeT}
                                      </span>
                                    )}
                                  </div>
                                  <div onClick={()=>setTlOpen(v=>!v)}
                                    style={{display:'flex',alignItems:'center',justifyContent:'center',gap:5,padding:'6px 12px',borderTop:'1px solid #ede9e6',fontSize:10,fontWeight:700,color:'#a8a29e',cursor:'pointer',background:'#f7f6f5',userSelect:'none'}}>
                                    <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                                    Timeline
                                    <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" style={{transition:'transform .25s',transform:tlOpen?'rotate(180deg)':'none'}}><polyline points="6 9 12 15 18 9"/></svg>
                                  </div>
                                </React.Fragment>
                              ) : (
                                <React.Fragment>
                                  <div style={{padding:'9px 12px',borderTop:ti===0?'none':'1px solid #f5f5f4',background:'#fff'}}>
                                    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:5}}>
                                      <div>
                                        <span style={{fontSize:11,fontWeight:700,color:'#1c1917'}}>{t.medName}</span>
                                        <div style={{fontSize:9,color:'#a8a29e',marginTop:1}}>{t.dose}{t.dose&&t.route?' · ':''}{t.route} · {t.freqPerDay}x tägl.</div>
                                      </div>
                                      {hasOverdue ? (
                                        <span style={{fontSize:8,fontWeight:700,padding:'2px 7px',borderRadius:999,background:'#fee2e2',color:'#dc2626',flexShrink:0}}>überfällig</span>
                                      ) : hasDue ? (
                                        <span style={{fontSize:8,fontWeight:700,padding:'2px 7px',borderRadius:999,background:'#fef3c7',color:'#92400e',flexShrink:0}}>fällig</span>
                                      ) : null}
                                    </div>
                                    <div style={{display:'flex',gap:5,marginBottom:5,flexWrap:'wrap'}}>
                                      {dots.map(d => {
                                        const canClick = TL_CAN[d.st] && !isGuest;
                                        const locked = TL_LOCKED[d.st];
                                        return (
                                          <div key={d.ci} style={{position:'relative'}}>
                                            <div
                                              onClick={()=>canClick?(d.st==='done-open'?undoFromPlan(t,d.key):recordFromPlan(t,d.key)):null}
                                              style={{display:'inline-flex',alignItems:'center',gap:5,padding:'6px 10px 6px 8px',borderRadius:999,cursor:canClick?'pointer':'default',userSelect:'none',background:QV_BG[d.st],border:'2px solid '+QV_BD[d.st],animation:QV_ANM[d.st]||'none',opacity:d.st==='pending'?0.5:1}}>
                                              <span style={{fontSize:13,lineHeight:1,color:QV_COL[d.st]}}>{QV_ICN[d.st]}</span>
                                              <span style={{fontSize:10,fontWeight:700,fontFamily:"'DM Mono',monospace",lineHeight:1,color:QV_COL[d.st]}}>{tlHHMM(d.doseT)}</span>
                                            </div>
                                            {locked&&<div style={{position:'absolute',top:-4,right:-4,width:14,height:14,borderRadius:'50%',background:'#1c1917',display:'flex',alignItems:'center',justifyContent:'center',fontSize:7,border:'1.5px solid #fff'}}>🔒</div>}
                                          </div>
                                        );
                                      })}
                                    </div>
                                    <div style={{height:3,background:'#f0f0f0',borderRadius:999,overflow:'hidden'}}>
                                      <div style={{height:'100%',borderRadius:999,background:'#3b82f6',width:(t.todayCount/t.freqPerDay*100)+'%'}}/>
                                    </div>
                                    {t.lastApp && (
                                      <div style={{fontSize:8,color:'#d6d3d1',fontFamily:"'DM Mono',monospace",marginTop:3}}>
                                        Zuletzt: {new Date(t.lastApp.doneAt).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})} {new Date(t.lastApp.doneAt).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})} · {t.lastApp.doneBy}
                                      </div>
                                    )}
                                  </div>
                                  <div onClick={()=>setTlOpen(v=>!v)}
                                    style={{display:'flex',alignItems:'center',justifyContent:'center',gap:5,padding:'6px 12px',borderTop:'1px solid #ede9e6',fontSize:10,fontWeight:700,color:'#78716c',cursor:'pointer',background:'#fffdfb',userSelect:'none'}}>
                                    <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                                    Timeline
                                    <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" style={{transition:'transform .25s',transform:tlOpen?'rotate(180deg)':'none'}}><polyline points="6 9 12 15 18 9"/></svg>
                                  </div>
                                </React.Fragment>
                              )}
                              {tlOpen && (
                                <div style={{padding:'10px 12px',background:'#fffdfb',borderTop:'1px solid #ede9e6',opacity:allDoneToday?0.7:1}}>
                                  <div style={{position:'relative',borderRadius:8,height:44,overflow:'hidden',marginBottom:2}}>
                                    {bounds.slice(0,-1).map((b,i) => {
                                      const segSt = i===0 ? dots[0].st : dots[i-1].st;
                                      return <div key={i} style={{position:'absolute',top:0,height:'100%',left:b+'%',width:(bounds[i+1]-b)+'%',background:TL_SEG[segSt]}}/>;
                                    })}
                                    {dots.map((d,i) => TL_LOCKED[d.st] ? (
                                      <div key={'h'+i} style={{position:'absolute',top:0,left:(i===0?0:dots[i-1].pct)+'%',width:(d.pct-(i===0?0:dots[i-1].pct))+'%',height:'100%',background:'repeating-linear-gradient(45deg,transparent,transparent 4px,rgba(0,0,0,.05) 4px,rgba(0,0,0,.05) 8px)',zIndex:2,pointerEvents:'none'}}/>
                                    ) : null)}
                                    {nowPct>0&&nowPct<100&&(
                                      <div style={{position:'absolute',top:3,bottom:3,left:nowPct+'%',width:2.5,background:'#fff',borderRadius:2,zIndex:8,opacity:.9}}>
                                        <div style={{position:'absolute',top:-5,left:'50%',transform:'translateX(-50%)',width:0,height:0,borderLeft:'4px solid transparent',borderRight:'4px solid transparent',borderTop:'5px solid #fff'}}/>
                                      </div>
                                    )}
                                    {dots.map(d => {
                                      const locked = TL_LOCKED[d.st];
                                      const canClick = TL_CAN[d.st] && !isGuest;
                                      return (
                                        <div key={d.ci} style={{position:'absolute',left:d.pct+'%',top:0,bottom:0,transform:'translateX(-50%)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',zIndex:7}}>
                                          <div style={{fontSize:7,fontWeight:700,fontFamily:'monospace',color:TL_ICOL[d.st],lineHeight:1,marginBottom:3,whiteSpace:'nowrap'}}>{tlHHMM(d.doseT)}</div>
                                          <div onClick={()=>canClick?(d.st==='done-open'?undoFromPlan(t,d.key):recordFromPlan(t,d.key)):null}
                                            style={{position:'relative',width:21,height:21,borderRadius:'50%',background:locked?'rgba(255,255,255,.6)':'rgba(255,255,255,.92)',boxShadow:locked?'none':'0 1px 4px rgba(0,0,0,.12)',display:'flex',alignItems:'center',justifyContent:'center',cursor:canClick?'pointer':'default',animation:TL_ANIM[d.st]||'none',opacity:d.st==='pending'?0.5:1}}>
                                            <span style={{fontSize:d.st.startsWith('done')?9:11,color:TL_ICOL[d.st]}}>{TL_ICON[d.st]}</span>
                                            {locked&&<div style={{position:'absolute',bottom:-2,right:-2,width:10,height:10,borderRadius:'50%',background:'#1c1917',display:'flex',alignItems:'center',justifyContent:'center',fontSize:7}}>🔒</div>}
                                          </div>
                                        </div>
                                      );
                                    })}
                                  </div>
                                  <div style={{display:'flex',justifyContent:'space-between',padding:'0 2px'}}>
                                    {[0,0.25,0.5,0.75,1].map(f => (
                                      <span key={f} style={{fontSize:7,color:'#d6d3d1',fontFamily:'monospace'}}>{tlHHMM(dayStart+dayLen*f)}</span>
                                    ))}
                                  </div>
                                </div>
                              )}
                            </React.Fragment>
                          );
                        })}
                      </div>

                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Erledigt */}
            {doneGroups.length > 0 && (
              <div>
                <p style={{fontSize:10,fontWeight:700,color:'#a8a29e',textTransform:'uppercase',letterSpacing:'.1em',marginBottom:8,paddingLeft:2}}>Erledigt · {visibleDone.length}</p>
                <div style={{display:'flex',flexDirection:'column',gap:12}}>
                  {doneGroups.map((group, gi) => (
                    <div key={gi} style={{borderRadius:14,overflow:'hidden',border:'1px solid #e7e5e4',boxShadow:'0 2px 8px rgba(28,25,23,.07)'}}>
                      <div style={{padding:'9px 12px',background:group.igelColor,display:'flex',alignItems:'center',justifyContent:'space-between',gap:10,cursor:'pointer'}}
                        onClick={() => { const h=(hedgehogs||[]).find(x=>x.id===group.igelId); if(h&&onSelectHedgehog) onSelectHedgehog(h); }}>
                        <span style={{fontSize:13,fontWeight:800,color:'#fff',lineHeight:1}}>{group.igelName}</span>
                        {group.igelBetreuer && (
                          <span style={{display:'inline-flex',alignItems:'center',gap:4,background:'rgba(255,255,255,.18)',border:'1px solid rgba(255,255,255,.25)',padding:'2px 7px',borderRadius:999,fontSize:9,fontWeight:700,color:'rgba(255,255,255,.9)',whiteSpace:'nowrap',flexShrink:0}}>
                            <svg width="7" height="7" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            {group.igelBetreuer}
                          </span>
                        )}
                      </div>
                      <div style={{padding:'6px 12px 7px',background:'#fafaf8',borderBottom:'1px solid #e7e5e4'}}>
                        <span style={{background:'#f0efee',color:'#57534e',fontSize:9,fontWeight:700,padding:'2px 7px',borderRadius:999}}>
                          {group.tasks.length} {group.tasks.length===1?'Behandlung':'Behandlungen'}
                        </span>
                      </div>
                      {group.tasks.map((t, ti) => {
                        const todayAppsT = (t.applications||[]).filter(a=>a.doneAt&&a.doneAt.startsWith(todayStr));
                        const lastTodayAppT = todayAppsT.slice(-1)[0];
                        const lastTodayTimeT = lastTodayAppT ? new Date(lastTodayAppT.doneAt).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}) : null;
                        return (
                          <div key={ti} style={{padding:'8px 12px',borderTop:ti===0?'none':'1px solid #f5f5f4',background:'#f7f6f5',display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,opacity:.75,cursor:'pointer'}}
                            onClick={() => { const h=(hedgehogs||[]).find(x=>x.id===t.igelId); if(h&&onSelectHedgehog) onSelectHedgehog(h); }}>
                            <span style={{fontSize:11,fontWeight:700,color:'#a8a29e',textDecoration:'line-through'}}>{t.medName}</span>
                            {lastTodayTimeT && (
                              <span style={{display:'inline-flex',alignItems:'center',gap:4,background:'#f0fdf4',color:'#166634',border:'1px solid #bbf7d0',fontSize:9,fontWeight:700,padding:'2px 7px',borderRadius:999,flexShrink:0,whiteSpace:'nowrap'}}>
                                <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="20 6 9 17 4 12"/></svg>
                                {lastTodayTimeT}
                              </span>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  ))}
                </div>
              </div>
            )}

          </div>
        </div>
      );
    };

    // =============================================
    // QR QUICK-VIEW (Bottom Sheet)
    // =============================================
    const QRQuickView = ({ igel: h, hedgehogs: allHedgehogs, userData, onClose, onOpenCard }) => {
      const [saving, setSaving] = React.useState(false);
      const [weightVal, setWeightVal] = React.useState('');
      const [weightSaved, setWeightSaved] = React.useState(false);
      const [lastWeight, setLastWeight] = React.useState(() => {
        if (!h) return '–';
        const vs = h.gewichtsverlauf || [];
        if (vs.length > 0) {
          const last = vs[vs.length - 1];
          const days = Math.floor((Date.now() - new Date(last.erfasstAm||last.datum).getTime()) / 86400000);
          const dayStr = days === 0 ? 'heute' : days === 1 ? 'gestern' : `vor ${days} Tagen`;
          return `Zuletzt: ${last.gewicht} g · ${dayStr}`;
        }
        return h.gewichtAktuell ? `Aktuell: ${h.gewichtAktuell} g` : 'Noch kein Gewicht erfasst';
      });
      const [noteInput, setNoteInput] = React.useState('');
      const [noteSaved, setNoteSaved] = React.useState(false);

      const todayStr = new Date().toISOString().split('T')[0];

      // ── Live-Uhr für Slot-Berechnung ─────────────────────────────────────
      const [qvNowSec, setQvNowSec] = React.useState(() => {
        const d = new Date(); return d.getHours()*3600+d.getMinutes()*60+d.getSeconds();
      });
      React.useEffect(() => {
        const iv = setInterval(() => {
          const d = new Date(); setQvNowSec(d.getHours()*3600+d.getMinutes()*60+d.getSeconds());
        }, 10000);
        return () => clearInterval(iv);
      }, []);

      // ── Tages-Einstellungen (später aus App-Settings) ─────────────────────
      const QV_DAY_START = 6*3600;
      const QV_DAY_END   = 22*3600;
      const QV_DAY_LEN   = QV_DAY_END - QV_DAY_START;
      const QV_TOL_MINS  = 120; // ±2h default — später aus App-Settings

      const qvDoseTime = (di, total) =>
        QV_DAY_START + (QV_DAY_LEN/total)*di + (QV_DAY_LEN/total)*0.5;

      const qvHHMM = (s) =>
        String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor((s%3600)/60)).padStart(2,'0');

      const [medState, setMedState] = React.useState(() => {
        const list = [];
        (h?.treatments || []).forEach((t, ti) => {
          if (t.status === 'abgeschlossen' || t.status === 'inaktiv') return;
          (t.medications || []).forEach((m, mi) => {
            const todayCount = (m.applications || []).filter(a => a.doneAt && a.doneAt.startsWith(todayStr)).length;
            const freqPerDay = (() => {
              const f = (m.frequency || '').toLowerCase();
              if (f.includes('4x')) return 4;
              if (f.includes('3x')) return 3;
              if (f.includes('2x')) return 2;
              return 1;
            })();
            const lastApp = (m.applications||[]).slice(-1)[0];
            const wasGivenBefore = !!(lastApp && lastApp.doneAt && !lastApp.doneAt.startsWith(todayStr));
            list.push({
              ti, mi,
              name: m.medicationName || m.medName || m.name || '–',
              detail: [m.dose ? `${m.dose} ${m.unit||''}`.trim() : null, m.applicationRoute, m.frequency].filter(Boolean).join(' · '),
              doneToday: todayCount >= freqPerDay,
              todayCount,
              freqPerDay,
              wasGivenBefore,
              applications: [...(m.applications||[])],
            });
          });
        });
        return list;
      });

      const hasTreatments = medState.length > 0;

      // ── Toleranz-bewusster Slot-State (analog Pflegeplan) ─────────────────
      const qvSlotState = (item, di) => {
        const t      = qvDoseTime(di, item.freqPerDay);
        const tolSec = QV_TOL_MINS * 60;
        const inW    = qvNowSec >= (t - tolSec) && qvNowSec <= (t + tolSec);
        const slotGiven = (item.applications||[]).some(a => {
          if (!a.doneAt || !a.doneAt.startsWith(todayStr)) return false;
          const d = new Date(a.doneAt);
          const appSec = d.getHours()*3600 + d.getMinutes()*60 + d.getSeconds();
          return appSec >= (t - tolSec) && appSec <= (t + tolSec);
        });
        if (slotGiven) return inW ? 'done-open' : 'done-locked';
        if (qvNowSec < t - tolSec) return 'pending';
        if (inW) return 'due';
        return 'overdue-locked';
      };

      // Pill-Farben
      const QV_PILL_BG  = {'done-open':'#dcfce7','done-locked':'#dcfce7','due':'#fefce8','overdue-locked':'#fff1f2','pending':'#fafaf8'};
      const QV_PILL_BD  = {'done-open':'#86efac','done-locked':'#86efac','due':'#fde68a','overdue-locked':'#fecdd3','pending':'#e7e5e4'};
      const QV_PILL_COL = {'done-open':'#166634','done-locked':'#166634','due':'#ca8a04','overdue-locked':'#e11d48','pending':'#d6d3d1'};
      const QV_PILL_ICN = {'done-open':'✓','done-locked':'✓','due':'◎','overdue-locked':'●','pending':'○'};
      const QV_PILL_ANM = {'due':'qv-pulse-amber 2.2s ease-in-out infinite','overdue-locked':'qv-pulse-red 1.8s ease-in-out infinite'};
      const QV_LOCKED   = {'done-locked':true,'overdue-locked':true};
      const QV_CAN      = {'done-open':true,'due':true};

      const toggleDot = async (medIdx, dotIdx) => {
        if (saving) return;
        const item  = medState[medIdx];
        const state = qvSlotState(item, dotIdx);
        if (!QV_CAN[state]) return; // nur due + done-open
        setSaving(true);
        try {
          const freshH = (allHedgehogs || []).find(x => x.id === h.id) || h;
          const treatments = JSON.parse(JSON.stringify(freshH.treatments || []));
          const t = treatments[item.ti];
          if (!t) { setSaving(false); return; }
          const m = t.medications[item.mi];
          if (!m) { setSaving(false); return; }
          if (state === 'done-open') {
            // Undo: letzten Heute-Eintrag entfernen
            const allApps = [...(m.applications || [])];
            const lastTodayIdx = allApps.map((a,i) => ({a,i})).reverse()
              .find(({a}) => a.doneAt && a.doneAt.startsWith(todayStr))?.i;
            if (lastTodayIdx !== undefined) allApps.splice(lastTodayIdx, 1);
            m.applications = allApps;
            m.completedApplications = Math.max(0, (parseInt(m.completedApplications)||1) - 1);
            m.done = false;
            const newCount = Math.max(0, item.todayCount - 1);
            setMedState(prev => prev.map((it,i) => i===medIdx
              ? {...it, todayCount: newCount, doneToday: newCount >= it.freqPerDay, applications: allApps}
              : it));
          } else {
            // Record
            const app = { doneAt: new Date().toISOString(), doneBy: userData.name, weightAtTime: freshH.gewichtAktuell||'' };
            const completed = (parseInt(m.completedApplications)||0) + 1;
            m.completedApplications = completed;
            m.applications = [...(m.applications||[]), app];
            const planned = parseInt(m.plannedApplications)||0;
            if (planned>0 && completed>=planned) m.done = true;
            const newCount = item.todayCount + 1;
            const newApps  = [...(item.applications||[]), app];
            setMedState(prev => prev.map((it,i) => i===medIdx
              ? {...it, todayCount: newCount, doneToday: newCount >= it.freqPerDay, applications: newApps}
              : it));
          }
          await db.collection('hedgehogs').doc(h.id).update({
            treatments,
            zuletztBearbeitetVon: userData.name,
            zuletztBearbeitetAm: firebase.firestore.FieldValue.serverTimestamp()
          });
          window.__pflegeplanRefresh && window.__pflegeplanRefresh();
        } catch(e) { console.error('QV toggleDot:', e); }
        setSaving(false);
      };

      const saveWeight = async () => {
        if (!weightVal || isNaN(parseFloat(weightVal)) || saving) return;
        setSaving(true);
        const newEntry = { datum: todayStr, gewicht: parseFloat(weightVal), notiz: '', erfasstVon: userData.name, erfasstAm: new Date().toISOString() };
        await db.collection('hedgehogs').doc(h.id).update({
          gewichtsverlauf: firebase.firestore.FieldValue.arrayUnion(newEntry),
          gewichtAktuell: weightVal,
          zuletztBearbeitetVon: userData.name,
          zuletztBearbeitetAm: firebase.firestore.FieldValue.serverTimestamp()
        });
        setLastWeight(`✓ ${weightVal} g gespeichert`);
        setWeightSaved(true);
        setWeightVal('');
        setSaving(false);
        setTimeout(() => setWeightSaved(false), 3000);
      };

      const saveNote = async () => {
        if (!noteInput.trim() || saving) return;
        setSaving(true);
        const note = { datum: todayStr, notiz: noteInput.trim(), erfasstVon: userData.name, erfasstAm: new Date().toISOString() };
        await db.collection('hedgehogs').doc(h.id).update({
          notizen: [...(h.notizen||[]), note],
          zuletztBearbeitetVon: userData.name,
          zuletztBearbeitetAm: firebase.firestore.FieldValue.serverTimestamp()
        });
        setNoteInput('');
        setNoteSaved(true);
        setSaving(false);
        setTimeout(() => setNoteSaved(false), 2000);
      };

      const statusLabel = { aufnahme:'Aufnahme', pflege:'In Pflege', ueberwinterung:'Überwinterung', auswilderung_bereit:'Auswilderung', ausgewildert:'Ausgewildert' };
      const statusColor = { aufnahme:{bg:'#f5f5f4',color:'#57534e',border:'1px solid #d6d3d1'}, pflege:{bg:'#fef3c7',color:'#92400e',border:'none'}, ueberwinterung:{bg:'#e0f2fe',color:'#0369a1',border:'none'}, auswilderung_bereit:{bg:'#dcfce7',color:'#166534',border:'none'}, ausgewildert:{bg:'#f3f4f6',color:'#6b7280',border:'none'} };
      const sc = statusColor[h?.status] || {bg:'#f5f5f4',color:'#57534e',border:'1px solid #d6d3d1'};
      const recentNotes = (h?.notizen || []).slice(-2).reverse();

      if (!h) return null;

      return (
        <div style={{position:'fixed',inset:0,zIndex:60,display:'flex',flexDirection:'column',justifyContent:'flex-end',background:'rgba(0,0,0,0.45)'}}
          onClick={onClose}>
          <div onClick={e => e.stopPropagation()}
            style={{background:'#fafaf8',borderRadius:'20px 20px 0 0',overflow:'hidden',maxHeight:'92vh',display:'flex',flexDirection:'column',fontFamily:"'DM Sans',system-ui,sans-serif"}}>
            <style>{`@keyframes qv-pulse-red{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.35)}50%{box-shadow:0 0 0 5px rgba(220,38,38,0)}}@keyframes qv-pulse-amber{0%,100%{box-shadow:0 0 0 0 rgba(217,119,6,.3)}50%{box-shadow:0 0 0 4px rgba(217,119,6,0)}}`}</style>
            <div style={{width:32,height:3,borderRadius:2,background:'#d6d3d1',margin:'10px auto 0',flexShrink:0}}/>

            {/* Header */}
            <div style={{display:'flex',alignItems:'center',gap:8,padding:'10px 16px 8px',background:'#fff',borderBottom:'2px solid #e7e5e4',flexShrink:0}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:15,fontWeight:800,color:'#1c1917'}}>{h.name}</div>
                <div style={{fontSize:9,fontFamily:'monospace',color:'#a8a29e',marginTop:1}}>{h.fundtiernummer || h.igelId || '–'} · {h.aufnahmedatum || '–'}{h.gewichtAktuell ? ` · ${h.gewichtAktuell} g` : ''}</div>
              </div>
              <span style={{fontSize:9,fontWeight:700,padding:'2px 8px',borderRadius:999,...sc,flexShrink:0}}>{statusLabel[h.status] || h.status}</span>
              <button onClick={onOpenCard} title="Igelkarte öffnen"
                style={{width:26,height:26,borderRadius:8,background:'#1c1917',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fafaf8" strokeWidth="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
              </button>
              <button onClick={onClose} style={{width:26,height:26,borderRadius:'50%',background:'#e7e5e4',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#78716c" strokeWidth="2.5" strokeLinecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              </button>
            </div>

            {/* Scrollable body */}
            <div style={{overflowY:'auto',flex:1}}>

              {/* Gewicht */}
              <div style={{padding:'10px 16px',borderBottom:'1px dashed #e7e5e4'}}>
                <div style={{fontSize:8,fontWeight:700,textTransform:'uppercase',letterSpacing:'.12em',color:'#a8a29e',marginBottom:6}}>Gewicht eintragen</div>
                <div style={{display:'flex',gap:6,alignItems:'center'}}>
                  <input type="number" value={weightVal} onChange={e=>setWeightVal(e.target.value)} placeholder="––"
                    style={{flex:1,border:`1.5px solid ${weightSaved?'#86efac':'#d6d3d1'}`,borderRadius:7,padding:'8px 10px',fontSize:18,fontWeight:800,fontFamily:'monospace',color:'#1c1917',background:'#fff',outline:'none',textAlign:'center',transition:'border-color .2s'}}/>
                  <span style={{fontSize:11,fontWeight:600,color:'#a8a29e',flexShrink:0}}>g</span>
                  <button onClick={saveWeight} disabled={saving}
                    style={{background:'#1c1917',color:'#fafaf8',border:'none',borderRadius:7,padding:'8px 13px',fontSize:11,fontWeight:700,cursor:'pointer',fontFamily:'inherit',flexShrink:0,opacity:saving?0.6:1}}>OK</button>
                </div>
                <div style={{fontSize:9,color:weightSaved?'#16a34a':'#a8a29e',marginTop:5,fontWeight:weightSaved?700:400}}>{lastWeight}</div>
              </div>

              {/* Medikamente */}
              <div style={{padding:'10px 16px',borderBottom:'1px dashed #e7e5e4'}}>
                <div style={{fontSize:8,fontWeight:700,textTransform:'uppercase',letterSpacing:'.12em',color:'#a8a29e',marginBottom:6,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <span>Medikamente heute</span>
                  {hasTreatments && (
                    <span style={{fontSize:8,fontWeight:600,color:medState.every(m=>m.todayCount>=m.freqPerDay)?'#16a34a':medState.some(m=>m.wasGivenBefore&&m.todayCount===0)?'#dc2626':'#d97706'}}>
                      {medState.reduce((s,m)=>s+Math.min(m.todayCount,m.freqPerDay),0)} / {medState.reduce((s,m)=>s+m.freqPerDay,0)} erledigt
                    </span>
                  )}
                </div>
                {hasTreatments ? medState.map((m, medIdx) => {
                  const allDone = m.todayCount >= m.freqPerDay;
                  const hasOv   = Array.from({length: m.freqPerDay}).some((_,i) => qvSlotState(m,i) === 'overdue-locked');
                  const hasDue  = Array.from({length: m.freqPerDay}).some((_,i) => qvSlotState(m,i) === 'due');
                  const pct     = m.freqPerDay > 0 ? Math.round(Math.min(m.todayCount, m.freqPerDay) / m.freqPerDay * 100) : 0;
                  const barCol  = allDone ? '#16a34a' : hasOv ? '#e11d48' : '#3b82f6';
                  return (
                    <div key={medIdx} style={{padding:'9px 0', borderBottom: medIdx < medState.length-1 ? '1px solid #f0efee' : 'none'}}>
                      {/* Med-Name + Status */}
                      <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:7}}>
                        <div style={{flex:1, minWidth:0}}>
                          <div style={{fontSize:12, fontWeight:700, color:'#1c1917', textDecoration:allDone?'line-through':'none', opacity:allDone?0.5:1}}>{m.name}</div>
                          <div style={{fontSize:9, color:'#a8a29e', marginTop:1}}>{m.detail}</div>
                        </div>
                        <span style={{fontSize:8, fontWeight:700, padding:'2px 7px', borderRadius:999, flexShrink:0, marginLeft:6,
                          background: allDone?'#dcfce7': hasOv?'#fee2e2': hasDue?'#fef3c7':'#f5f5f4',
                          color:       allDone?'#166534': hasOv?'#dc2626': hasDue?'#92400e':'#a8a29e'}}>
                          {allDone ? '✓ erledigt' : hasOv ? 'überfällig' : hasDue ? 'fällig' : 'ausstehend'}
                        </span>
                      </div>
                      {/* Pills */}
                      <div style={{display:'flex', gap:5, flexWrap:'wrap', alignItems:'center'}}>
                        {Array.from({length: m.freqPerDay}).map((_, di) => {
                          const st      = qvSlotState(m, di);
                          const canClick= QV_CAN[st];
                          const locked  = QV_LOCKED[st];
                          const doseT   = qvDoseTime(di, m.freqPerDay);
                          return (
                            <div key={di} style={{position:'relative'}}>
                              <div
                                onClick={() => toggleDot(medIdx, di)}
                                style={{
                                  display:'flex', alignItems:'center', gap:5,
                                  padding:'6px 10px 6px 8px',
                                  borderRadius:999,
                                  background: QV_PILL_BG[st],
                                  border: '2px solid '+QV_PILL_BD[st],
                                  cursor: canClick ? 'pointer' : 'default',
                                  opacity: st === 'pending' ? 0.45 : 1,
                                  animation: QV_PILL_ANM[st] || 'none',
                                  transition: 'transform .12s',
                                  userSelect: 'none',
                                }}
                                title={st==='done-open'?'Rückgängig': locked?'Gesperrt — außerhalb Toleranzfenster': st==='pending'?'Noch nicht fällig':'Jetzt quittieren'}>
                                <span style={{fontSize:13, color: QV_PILL_COL[st], lineHeight:1}}>{QV_PILL_ICN[st]}</span>
                                <span style={{fontSize:10, fontWeight:700, fontFamily:'monospace', color: QV_PILL_COL[st], lineHeight:1}}>{qvHHMM(doseT)}</span>
                              </div>
                              {/* Schloss-Badge */}
                              {locked && (
                                <div style={{position:'absolute', top:-4, right:-4, width:13, height:13, borderRadius:'50%', background:'#1c1917', display:'flex', alignItems:'center', justifyContent:'center', fontSize:6, border:'1.5px solid #fff'}}>🔒</div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                      {/* Fortschrittsbalken */}
                      {m.freqPerDay > 1 && (
                        <div style={{height:3, background:'#e7e5e4', borderRadius:2, marginTop:6, overflow:'hidden'}}>
                          <div style={{height:'100%', borderRadius:2, width:`${pct}%`, background:barCol, transition:'width .3s'}}/>
                        </div>
                      )}
                    </div>
                  );
                }) : (
                  <div>
                    <div style={{fontSize:11,color:'#a8a29e',fontStyle:'italic',paddingBottom:5}}>Kein Behandlungsplan hinterlegt.</div>
                    <button onClick={() => onOpenCard('startVorlage')} style={{fontSize:10,fontWeight:700,color:'#78716c',border:'1.5px solid #d6d3d1',borderRadius:6,padding:'4px 9px',background:'#fff',cursor:'pointer',fontFamily:'inherit',display:'inline-flex',alignItems:'center',gap:4}}>
                      <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                      Behandlung in Igelkarte anlegen
                    </button>
                  </div>
                )}
                {hasTreatments && (
                  <div style={{marginTop:8,display:'flex',gap:6,flexWrap:'wrap'}}>
                    <button onClick={() => onOpenCard('startVorlage')} style={{fontSize:10,fontWeight:700,color:'#78716c',border:'1.5px solid #d6d3d1',borderRadius:6,padding:'4px 9px',background:'#fff',cursor:'pointer',fontFamily:'inherit',display:'inline-flex',alignItems:'center',gap:4}}>
                      <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                      Behandlung hinzufügen
                    </button>
                    <button onClick={onOpenCard} style={{fontSize:10,fontWeight:700,color:'#78716c',border:'1.5px solid #d6d3d1',borderRadius:6,padding:'4px 9px',background:'#fff',cursor:'pointer',fontFamily:'inherit',display:'inline-flex',alignItems:'center',gap:4}}>
                      <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                      Plan bearbeiten
                    </button>
                  </div>
                )}
              </div>

              {/* Notizen */}
              <div style={{padding:'10px 16px 14px',borderBottom:'1px dashed #e7e5e4'}}>
                <div style={{fontSize:8,fontWeight:700,textTransform:'uppercase',letterSpacing:'.12em',color:'#a8a29e',marginBottom:6}}>Notizen</div>
                {recentNotes.length === 0 && <div style={{fontSize:11,color:'#a8a29e',fontStyle:'italic',marginBottom:7}}>Noch keine Notizen vorhanden.</div>}
                {recentNotes.map((n, i) => (
                  <div key={i} style={{padding:'5px 0',borderBottom:i<recentNotes.length-1?'1px solid #e7e5e4':'none'}}>
                    <div style={{fontSize:11,color:'#44403c',lineHeight:1.5}}>{n.notiz}</div>
                    <div style={{fontSize:9,color:'#a8a29e',marginTop:2}}>{n.erfasstVon} · {n.datum}</div>
                  </div>
                ))}
                {noteSaved && <div style={{fontSize:10,color:'#16a34a',fontWeight:700,marginTop:4}}>✓ Notiz gespeichert</div>}
                <div style={{display:'flex',gap:5,marginTop:8,alignItems:'flex-end'}}>
                  <textarea value={noteInput} onChange={e=>setNoteInput(e.target.value)} rows={2} placeholder="Notiz hinzufügen…"
                    style={{flex:1,border:'1.5px solid #d6d3d1',borderRadius:6,padding:'6px 8px',fontSize:10,fontFamily:'inherit',resize:'none',outline:'none',color:'#1c1917',background:'#fff',minHeight:36}}/>
                  <button onClick={saveNote} disabled={saving}
                    style={{background:'#1c1917',color:'#fafaf8',border:'none',borderRadius:6,padding:'6px 10px',fontSize:10,fontWeight:700,cursor:'pointer',fontFamily:'inherit',alignSelf:'flex-end',whiteSpace:'nowrap',opacity:saving?0.6:1}}>+ Notiz</button>
                </div>
              </div>
            </div>

            {/* Footer */}
            <button onClick={onOpenCard}
              style={{width:'100%',border:'none',background:'#1c1917',color:'#fafaf8',cursor:'pointer',fontFamily:'inherit',display:'flex',alignItems:'center',justifyContent:'center',gap:6,fontSize:12,fontWeight:700,padding:'14px 16px',paddingBottom:'calc(env(safe-area-inset-bottom, 0px) + 74px)',flexShrink:0}}>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
              Vollständige Igelkarte öffnen
            </button>
          </div>
        </div>
      );
    };

    // =============================================
    // QR SCANNER MODAL (Real camera via jsQR)
    // =============================================
    const QRScannerModal = ({ hedgehogs, onFound, onClose }) => {
      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const [error, setError] = useState('');
      const [scanning, setScanning] = useState(false);
      const streamRef = useRef(null);
      const rafRef = useRef(null);

      useEffect(() => {
        startCamera();
        return () => stopCamera();
      }, []);

      const startCamera = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment' }
          });
          streamRef.current = stream;
          if (videoRef.current) {
            videoRef.current.srcObject = stream;
            videoRef.current.play();
            setScanning(true);
            rafRef.current = requestAnimationFrame(tick);
          }
        } catch (e) {
          setError('Kamera-Zugriff verweigert. Bitte Kamera-Berechtigung in den Browser-Einstellungen aktivieren.');
        }
      };

      const stopCamera = () => {
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
        if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop());
      };

      const tick = () => {
        const video = videoRef.current;
        const canvas = canvasRef.current;
        if (!video || !canvas || video.readyState !== video.HAVE_ENOUGH_DATA) {
          rafRef.current = requestAnimationFrame(tick);
          return;
        }
        const ctx = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height);
        if (code) {
          // Parse igel ID from QR URL: #igel-IGL-xxx
          const match = code.data.match(/#igel-(IGL-\d+)/);
          if (match) {
            const igelId = match[1];
            const found = hedgehogs.find(h => h.igelId === igelId);
            if (found) { stopCamera(); onFound(found); return; }
          }
          // Fallback: try to match by full igelId string
          const found2 = hedgehogs.find(h => code.data.includes(h.igelId));
          if (found2) { stopCamera(); onFound(found2); return; }
          setError('QR-Code erkannt, aber kein passender Igel gefunden.');
        }
        rafRef.current = requestAnimationFrame(tick);
      };

      const [torch, setTorch] = React.useState(false);
      const toggleTorch = async () => {
        if (!streamRef.current) return;
        const track = streamRef.current.getVideoTracks()[0];
        if (!track || !track.getCapabilities || !track.getCapabilities().torch) return;
        try { await track.applyConstraints({ advanced: [{ torch: !torch }] }); setTorch(t => !t); } catch(e) {}
      };

      return (

              {/* scan line */}

                  <svg style={{opacity:.2,flexShrink:0}} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#111" strokeWidth="2"><polyline points="9 18 15 12 9 6"/></svg>

    // =============================================

      const fmtTime = (s) => String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor((s%3600)/60)).padStart(2,'0');

            <div style={{fontSize:11,color:'#78350f',lineHeight:1.55}}>

    // User Management
    const UserManagement = ({ users, userData: currentUserData, onClose }) => {
      const [showInvite, setShowInvite] = useState(false);
      const [email, setEmail] = useState('');
      const [userName, setUserName] = useState('');
      const [role, setRole] = useState('mitarbeiter');
      const [link, setLink] = useState('');
      const [loading, setLoading] = useState(false);
      const [roleModal, setRoleModal] = useState(null);
      const [deleteConfirm, setDeleteConfirm] = useState(null);
      const [suspendConfirm, setSuspendConfirm] = useState(null);
      const [copyFeedback, setCopyFeedback] = useState(false);
      const [selfRoleConfirm, setSelfRoleConfirm] = useState(null);

      const isAdminUser = currentUserData?.role === 'admin';
      const currentUid = auth.currentUser?.uid;

      // For non-admins: only show own user
      const visibleUsers = isAdminUser
        ? users.filter(u => !u.deleted)
        : users.filter(u => !u.deleted && u.id === currentUid);

      const generateInvite = async () => {
        if (!userName || !email) { alert('Bitte Name und E-Mail eingeben'); return; }
        setLoading(true);
        try {
          const code = Math.random().toString(36).substring(2, 15);
          await db.collection('invites').add({
            code, email, userName, role,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            createdBy: auth.currentUser.uid,
            used: false
          });
          setLink(`${window.location.origin}${window.location.pathname}`);
        } catch (err) { alert('Fehler beim Erstellen: ' + err.message); }
        setLoading(false);
      };

      const copyLink = () => {
        navigator.clipboard.writeText(link);
        setCopyFeedback(true);
        setTimeout(() => setCopyFeedback(false), 1500);
      };

      const shareViaWhatsApp = () => {
        const text = `Du wurdest zur Igelpflegestation eingeladen.\n\nÖffne diesen Link:\n${link}\n\nKlicke auf "Passwort vergessen oder Einladung erhalten" und gib diese E-Mail ein:\n${email}\n\nDu erhältst eine E-Mail. Klicke den Link darin, setze dein Passwort und kehre dann zur App zurück, um dich einzuloggen.`;
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
      };

      const shareViaEmail = () => {
        const subject = 'Einladung zur Igelpflegestation';
        const body = `Hallo,\n\ndu wurdest zur Igelpflegestation eingeladen.\n\nÖffne diesen Link:\n${link}\n\nKlicke auf "Passwort vergessen oder Einladung erhalten" und gib deine E-Mail ein:\n${email}\n\nDu erhältst eine E-Mail mit einem Link. Klicke diesen, setze dein Passwort und kehre danach zur App zurück. Dort kannst du dich nun einloggen.\n\nViele Grüße\nDein Igelpflege-Team`;
        window.location.href = `mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      };

      const changeRole = (u) => {
        const isSelf = u.id === currentUid;
        setRoleModal({ userId: u.id, currentRole: u.role, selectedRole: u.role, userName: u.name, isSelf });
      };

      const saveRole = async () => {
        if (!roleModal) return;
        // If changing own role away from admin
        if (roleModal.isSelf && roleModal.selectedRole !== 'admin') {
          const otherAdmins = users.filter(u => u.role === 'admin' && u.id !== roleModal.userId && !u.deleted);
          if (otherAdmins.length === 0) {

      const deleteUser = (u) => {
        const isSelf = u.id === currentUid;

          const otherAdmins = users.filter(u2 => u2.role === 'admin' && u2.id !== currentUid && !u2.deleted);

      const confirmDeleteUser = async () => {

        try {

            await batch.commit();

      const suspendUser = (u) => setSuspendConfirm({ userId: u.id, userName: u.name, currentActive: u.active });

      const confirmSuspendUser = async () => {

      return (
        <div className="min-h-screen bg-gray-50 pb-16">

            <h2 style={{position:"absolute",left:"50%",transform:"translateX(-50%)",fontSize:15,fontWeight:800,color:"#1c1917",whiteSpace:"nowrap",fontFamily:"'DM Sans',system-ui,sans-serif"}}>Benutzerverwaltung</h2>

                      {link && (

                              title="Link kopieren">

                                : <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                              }

              {isAdminUser && <div className="border-t border-gray-100"></div>}

                    <button key={r.value} onClick={() => setRoleModal({ ...roleModal, selectedRole: r.value })}

                        {roleModal.selectedRole === r.value && (
